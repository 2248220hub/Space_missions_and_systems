{cat:"Antenna & Gain",emoji:"📡",color:"#2563eb",rows:[
{s:"G",d:"Antenna gain",det:"Ratio of radiated power in a direction to isotropic. Dimensionless or dBi.",trap:"G is direction-dependent; Gmax at boresight only"},
{s:"Gmax",d:"Maximum gain (boresight)",det:"Gmax = η(πD/λ)². Dish diameter D, wavelength λ, efficiency η.",trap:"Never assume η = 1 — use 0.55–0.65"},
{s:"η",d:"Aperture efficiency",det:"Fraction of geometric area contributing to gain. Typical 0.55–0.65.",trap:""},
{s:"D",d:"Antenna diameter [m]",det:"Physical diameter of the reflector dish.",trap:""},
{s:"λ",d:"Wavelength [m]",det:"λ = c/f. Higher f → smaller λ → higher gain BUT more atmo loss.",trap:""},
{s:"Aeff",d:"Effective aperture [m²]",det:"Aeff = Gλ²/(4π). At boresight: Aeff_max = ηπD²/4.",trap:""},
{s:"θ₃dB",d:"Half-power beamwidth [deg]",det:"θ₃dB ≈ 70λ/D. FULL angular width at −3 dB.",trap:"FULL width, not half-angle"},
{s:"G(θ)",d:"Off-axis gain",det:"G(θ)_dBi = Gmax_dBi − 12(θ/θ₃dB)². Valid for θ < θ₃dB/2.",trap:""}]},
{cat:"Link Budget",emoji:"📊",color:"#0f766e",rows:[
{s:"EIRP",d:"Equiv. Isotropic Radiated Power [W]",det:"EIRP = GT × PT. In direction of receiver.",trap:"G depends on pointing direction"},
{s:"LFS",d:"Free Space Loss",det:"LFS = (4πR/λ)². Dominant loss — grows as R².",trap:"Not physical absorption — geometric spreading"},
{s:"LATM",d:"Atmospheric loss",det:"Tropospheric + ionospheric attenuation.",trap:""},

{s:"Tant",d:"Antenna noise temp [K]",det:"Galactic (~10 K), Earth sidelobes, Sun.",trap:"Increases near solar conjunction"},

const MODULES=[
{id:"nota",title:"📋 Notation Table",slides:"—",icon:"📋",isNota:true},
{id:"ttc",title:"1. TT&C & Tracking Config",slides:"1–9",icon:"🛰️",
overview:"Satellite TT&C is the backbone of any space mission. Every spacecraft carries active radio equipment to receive commands (uplink), transmit data (downlink), and enable tracking.\n\nTracking configurations:\n• One-way: downlink only — onboard oscillator generates carrier\n• Two-way: ground H-maser generates carrier → transponder coherently retransmits → KEY for precision Doppler\n• Three-way: like two-way but downlink received at different station\n• TWNC: two-way non-coherent — onboard oscillator for downlink (no precision Doppler)\n\nFrequency bands:\n• S-band: 2.0–2.3 GHz (legacy/emergency)\n• X-band: 7.1–8.5 GHz (current standard)\n• Ka-band: 32–34.7 GHz (future deep space, high data rate)\n\nHigher f → higher gain (G ∝ f²) → higher data rate, BUT also more atmospheric opacity (H₂O absorption). The trade-off defines band selection.",
equations:"Telecommand (uplink):\n  S: 2025–2120 MHz, X: 7145–7235 MHz, Ka: 34.2–34.7 GHz\n\nTelemetry (downlink):\n  S: 2200–2300 MHz, X: 8400–8500 MHz, Ka: 31.8–32.3 GHz\n\nCoherent turnaround ratios:\n  S→S: 240/221, X→X: 880/749\n  S→X: 880/221, X→S: 240/749\n\nPrinciple:\n  Higher f → higher G → higher data rate\n  But: higher f → more atmospheric loss",
derivation:"Why coherent two-way?\n\nThe ground H-maser (stability ~10⁻¹⁵) generates the uplink carrier. The transponder PLL locks to it and retransmits at fD = (M/N)×fU. This means:\n\n1. Onboard oscillator jitter is bypassed\n2. Both up/down Doppler reference the same clock\n3. Total 2-way Doppler = sum of both legs\n\nOne-way uses the onboard USO (drift ~Hz/day). Two-way eliminates this entirely.\n\nWhy different frequencies for up/down?\nIf same frequency, the powerful TX signal leaks into the sensitive RX (self-interference). Frequency separation allows front-end filters to reject the TX signal.",
matlab:'<span class="cmt">% === TT&C Frequency Band Comparison ===</span>\n<span class="cmt">% Free-space loss at Jupiter distance for each band</span>\n\nc = <span class="num">3e8</span>;\nR = <span class="num">7.78e11</span>;  <span class="cmt">% Jupiter ~5.2 AU [m]</span>\n\nbands = {<span class="str">\'S-band\'</span>,<span class="str">\'X-band\'</span>,<span class="str">\'Ka-band\'</span>};\nfreqs = [<span class="num">2.3e9</span>, <span class="num">8.45e9</span>, <span class="num">32e9</span>];\n\n<span class="fn">fprintf</span>(<span class="str">\'Free Space Loss at Jupiter (%.1f AU):\\n\'</span>, R/<span class="num">1.496e11</span>);\n<span class="kw">for</span> i = <span class="num">1</span>:<span class="num">3</span>\n    lam = c / freqs(i);\n    LFS_dB = <span class="num">20</span>*<span class="fn">log10</span>(<span class="num">4</span>*<span class="kw">pi</span>*R/lam);\n    <span class="fn">fprintf</span>(<span class="str">\'  %s (%.1f GHz): LFS = %.1f dB\\n\'</span>, ...\n            bands{i}, freqs(i)/<span class="num">1e9</span>, LFS_dB);\n<span class="kw">end</span>\n\n<span class="cmt">% Output:</span>\n<span class="cmt">% S-band:  LFS ≈ 271.7 dB</span>\n<span class="cmt">% X-band:  LFS ≈ 283.0 dB</span>\n<span class="cmt">% Ka-band: LFS ≈ 294.5 dB</span>',
diagrams:'<svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Two-Way Coherent Tracking Configuration</text><rect x="40" y="50" width="160" height="80" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="120" y="80" text-anchor="middle" font-weight="600" font-size="12">Ground Station</text><text x="120" y="96" text-anchor="middle" font-size="10" fill="#2563eb">H-Maser Clock</text><text x="120" y="110" text-anchor="middle" font-size="9" fill="#5a5a55">σ_y ~ 10⁻¹⁵ @ 1000s</text><rect x="420" y="50" width="160" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="500" y="80" text-anchor="middle" font-weight="600" font-size="12">Spacecraft</text><text x="500" y="96" text-anchor="middle" font-size="10" fill="#dc2626">Transponder</text><text x="500" y="110" text-anchor="middle" font-size="9" fill="#5a5a55">PLL + ×880/749</text><line x1="200" y1="75" x2="418" y2="75" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/><text x="310" y="68" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="500">Uplink fU (X: 7.2 GHz)</text><line x1="418" y1="105" x2="200" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#a1)"/><text x="310" y="120" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="500">Downlink fD = (880/749)×fU (X: 8.4 GHz)</text><rect x="160" y="155" width="300" height="36" rx="8" fill="#ecfdf5" stroke="#86efac"/><text x="310" y="177" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="500">Phase coherence preserved → precision Doppler</text></svg>',
graphs:'<div class="graph-desc"><h4>Atmospheric Opacity vs Frequency</h4><p>The radio window (10 MHz – 30 GHz) is nearly transparent. H₂O absorption at ~22 GHz creates a small bump. O₂ at ~60 GHz causes a strong peak. Above ~40 GHz, atmosphere becomes increasingly opaque. This dictates which bands are usable for space TT&C. Ka-band (32 GHz) sits near the edge of good transparency.</p></div><div class="graph-desc"><h4>Free Space Loss vs Distance</h4><p>Three curves for S, X, Ka bands. LFS grows as 20log₁₀(R), adding ~6 dB per doubling of distance. At Jupiter (~5.2 AU), LFS exceeds 280 dB at X-band. This drives the need for large ground antennas and high spacecraft EIRP for deep space missions.</p></div>',
traps:[{n:1,t:"One-way Doppler is limited by onboard oscillator stability (Hz-level jitter). Two-way eliminates this using the ground H-maser. Don't claim equal accuracy."},{n:2,t:"Higher frequency ≠ always better. Professor may ask 'why not use the highest frequency?' — cite the atmospheric opacity trade-off."},{n:3,t:"TWNC ≠ two-way. TWNC uses onboard oscillator for downlink — no phase coherence, no precision Doppler."},{n:4,t:"Three-way: downlink goes to a DIFFERENT station. Doppler equation changes because the two legs have different geometry."}],
drill:[{q:"What is the fundamental difference between two-way and TWNC tracking?",a:"In two-way, the downlink is coherently derived from the uplink via the transponder turnaround ratio — both legs reference the ground H-maser. In TWNC, the downlink uses the onboard oscillator independently — no phase coherence, so precision Doppler is not possible."},{q:"Why is Ka-band increasingly used for deep space despite higher atmospheric loss?",a:"Ka-band gives much higher antenna gain (G ∝ f²) for the same dish size, enabling higher data rates. The atmospheric loss is manageable with weather selection and WVR calibration. The data rate advantage outweighs the loss penalty at deep space distances."},{q:"In a three-way config, which station's clock error enters the Doppler measurement?",a:"Both stations' clock errors enter — TX station for uplink, RX station for downlink timing. Unlike two-way where only one clock is involved. Clock synchronisation between stations becomes critical."}]},

{id:"para",title:"2. Parabolic Antennas & Cassegrain",slides:"10–16",icon:"📡",
overview:"Parabolic reflector antennas concentrate all incoming power at the focus. The defining property: all rays from a plane wavefront reach focus F with equal path length → constructive interference → maximum signal.\n\nWA + AF = WO + OF (constant for all rays)\nPhase: φ = kx − ωt + φ₀\n\nPrime Focus vs Cassegrain:\n• Prime focus: feed at F. Simple but feed sees warm ground (~300 K) → high Tant.\n• Cassegrain: hyperboloidal subreflector redirects rays to secondary focus SF behind dish. Feed at SF points at cold sky (~3 K) → dramatically lower Tant → better G/T.\n\nThe hyperboloid has two foci: one at F (shared with paraboloid), other at SF. Phase coherence is preserved because all path lengths remain equal.\n\nAll deep space signals arrive as plane waves (distance >> antenna size).",
equations:"Phase coherence:\n  WA + AF = WO + OF  (constant for all rays)\n\nCassegrain:\n  Main reflector: paraboloid (focus F)\n  Subreflector: hyperboloid (foci at F and SF)\n  Feed at secondary focus SF\n\nAntenna parameters:\n  Gain G, Radiation pattern, θ₃dB\n  Polarization, EIRP, PFD, G/T\n\nHouseholder reflection:\n  H = I − 2nnᵀ (n = surface normal)\n  Used to prove parabolic focus property algebraically",
derivation:"Why must the subreflector be a hyperboloid?\n\nA hyperboloid has two foci. Place one focus at F (the paraboloid's focus) and the other at SF.\n\nFor any ray hitting the paraboloid:\n  path(Wavefront → surface → F) = constant (parabola property)\n  path(F → hyperboloid → SF) = constant (hyperboloid property)\n\nTherefore: total path(Wavefront → surface → F → hyperboloid → SF) = constant\nAll rays arrive at SF with equal phase → perfect signal at the feed.\n\nA flat mirror would NOT preserve equal path lengths — rays from different parts of the dish would arrive at different phases, destroying coherence.\n\nCassegrain noise advantage:\n  Prime focus: feed sees Earth (~300 K blackbody through sidelobes)\n  Cassegrain: feed sees cold sky (~3 K CMB) → Tant drops ~100× → much better G/T",
matlab:'<span class="cmt">% === Parabolic Antenna Phase Verification ===</span>\nf_length = <span class="num">10</span>;  <span class="cmt">% focal length [m]</span>\nxA = [<span class="num">-4</span>, <span class="num">-2</span>, <span class="num">0</span>, <span class="num">2</span>, <span class="num">4</span>];\nyA = xA.^<span class="num">2</span> / (<span class="num">4</span>*f_length);\n\ny_wave = <span class="fn">max</span>(yA);  <span class="cmt">% wavefront height</span>\n<span class="fn">fprintf</span>(<span class="str">\'Path lengths (should be equal):\\n\'</span>);\n<span class="kw">for</span> i = <span class="num">1</span>:<span class="fn">length</span>(xA)\n    d_wave = y_wave - yA(i);  <span class="cmt">% wavefront to surface</span>\n    d_focus = <span class="fn">sqrt</span>(xA(i)^<span class="num">2</span> + (yA(i)-f_length)^<span class="num">2</span>);  <span class="cmt">% surface to F</span>\n    <span class="fn">fprintf</span>(<span class="str">\'  x=%+.1fm: total=%.6f m\\n\'</span>, xA(i), d_wave+d_focus);\n<span class="kw">end</span>\n\n<span class="cmt">% Plot</span>\nx = <span class="fn">linspace</span>(<span class="num">-5</span>,<span class="num">5</span>,<span class="num">100</span>);\n<span class="kw">figure</span>; <span class="kw">hold</span> <span class="kw">on</span>;\n<span class="fn">plot</span>(x, x.^<span class="num">2</span>/(<span class="num">4</span>*f_length), <span class="str">\'b-\'</span>, <span class="str">\'LineWidth\'</span>, <span class="num">2</span>);\n<span class="fn">plot</span>(<span class="num">0</span>, f_length, <span class="str">\'r*\'</span>, <span class="str">\'MarkerSize\'</span>, <span class="num">15</span>);\n<span class="kw">for</span> i = <span class="num">1</span>:<span class="fn">length</span>(xA)\n    <span class="fn">plot</span>([xA(i) xA(i)], [y_wave yA(i)], <span class="str">\'g--\'</span>);\n    <span class="fn">plot</span>([xA(i) <span class="num">0</span>], [yA(i) f_length], <span class="str">\'m-\'</span>);\n<span class="kw">end</span>\n<span class="kw">axis</span> <span class="kw">equal</span>; <span class="kw">grid</span> <span class="kw">on</span>;\n<span class="fn">xlabel</span>(<span class="str">\'x [m]\'</span>); <span class="fn">ylabel</span>(<span class="str">\'y [m]\'</span>);\n<span class="fn">title</span>(<span class="str">\'Parabolic Reflector: Ray Paths to Focus\'</span>);',
diagrams:'<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Prime Focus vs Cassegrain Configuration</text><rect x="20" y="40" width="290" height="220" rx="12" fill="#fef2f2" stroke="#fca5a5" opacity="0.5"/><text x="165" y="60" text-anchor="middle" font-weight="600" fill="#dc2626">PRIME FOCUS</text><path d="M60,220 Q165,100 270,220" stroke="#1a1a18" stroke-width="2.5" fill="none"/><circle cx="165" cy="140" r="6" fill="#dc2626"/><text x="180" y="138" font-size="10" fill="#dc2626" font-weight="500">Feed at F</text><line x1="165" y1="146" x2="165" y2="230" stroke="#dc2626" stroke-dasharray="3,3"/><text x="165" y="248" text-anchor="middle" font-size="9" fill="#dc2626">↓ Sees warm ground ~300K</text><rect x="350" y="40" width="290" height="220" rx="12" fill="#ecfdf5" stroke="#86efac" opacity="0.5"/><text x="495" y="60" text-anchor="middle" font-weight="600" fill="#0f766e">CASSEGRAIN</text><path d="M390,220 Q495,100 600,220" stroke="#1a1a18" stroke-width="2.5" fill="none"/><ellipse cx="495" cy="148" rx="30" ry="8" fill="none" stroke="#2563eb" stroke-width="1.5"/><text x="540" y="148" font-size="9" fill="#2563eb">Hyperboloid</text><circle cx="495" cy="230" r="6" fill="#0f766e"/><text x="510" y="235" font-size="10" fill="#0f766e" font-weight="500">Feed at SF</text><line x1="495" y1="224" x2="495" y2="160" stroke="#0f766e" stroke-dasharray="3,3"/><text x="495" y="268" text-anchor="middle" font-size="9" fill="#0f766e">↑ Sees cold sky ~3K ✓</text></svg>\n<div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Cassini_Dish_on_the_Spacecraft.jpg/800px-Cassini_Dish_on_the_Spacecraft.jpg" alt="Cassini HGA" loading="lazy"><div class="img-cap">Cassini 4m High Gain Antenna during integration. This fixed Cassegrain reflector operated at S, X, Ku, and Ka bands simultaneously and doubled as a sunshield during Venus flybys.</div></div>',
graphs:'<div class="graph-desc"><h4>Ray Path Lengths Verification</h4><p>X-axis: position on dish aperture x [m]. Y-axis: total path (wavefront → surface → focus) [m]. Result: perfectly flat horizontal line — all paths are equal. ANY surface deformation breaks this condition. Manufacturing tolerance: surface RMS error < λ/20.</p></div>',
traps:[{n:1,t:"Prof may ask: 'Why not prime focus?' — explain the noise temperature advantage of Cassegrain, not just 'it\'s better.'"},{n:2,t:"The subreflector MUST be a hyperboloid. A flat mirror would NOT preserve equal path lengths."},{n:3,t:"Householder transformation connection: H = I − 2nnᵀ proves the parabolic focus property algebraically. Know this link."},{n:4,t:"Don't confuse F (primary focus) with SF (secondary focus). Feed goes at SF in Cassegrain."}],
drill:[{q:"Why must the Cassegrain subreflector be a hyperboloid?",a:"A hyperboloid has two foci. One coincides with the paraboloid's focus F, the other defines SF where the feed sits. This preserves equal path lengths for all rays → phase coherence at SF. A flat mirror would redirect rays but NOT preserve equal paths → destructive interference."},{q:"Main advantage of Cassegrain over prime focus in terms of noise?",a:"In prime focus, the feed points at warm Earth (~300 K) → high Tant. In Cassegrain, the feed points at cold sky (~3 K CMB) → much lower Tant → better G/T figure of merit."},{q:"Connection between parabolic focus and Householder transformation?",a:"The Householder matrix H = I − 2nnᵀ gives the reflected ray direction. Applied to all rays hitting a paraboloid, it proves algebraically that all reflected rays pass through F with equal total path length from the wavefront."}]},

{id:"gain",title:"3. Gain, Beamwidth & Pattern",slides:"17–22",icon:"📊",
overview:"Antenna gain quantifies how well an antenna concentrates power compared to isotropic. It arises from diffraction.\n\nDiffraction angle: θ ~ λ/D\nGain: G ≈ 4π/(πθ²) = 4D²/λ²\n\nPrecise formula: Gmax = η(πD/λ)²  (η ≈ 0.6)\n\nHalf-power beamwidth: θ₃dB ≈ 70λ/D [degrees]\n\nGmax from beamwidth (η ≈ 0.6): Gmax ≈ 29000/θ₃dB² [degrees]\n\nOff-axis gain: G(θ)_dBi = Gmax_dBi − 12(θ/θ₃dB)²\nValid for θ < θ₃dB/2.\n\nThe radiation pattern (polar plot) shows: main lobe, sidelobes, nulls. The ESA DSA1 35m pattern (slide 21) is NOT perfectly symmetric — asymmetry from tripod blockage.",
equations:"Effective aperture:\n  Aeff = Gλ²/(4π)\n  At boresight: Aeff_max = ηπD²/4\n\nMaximum gain:\n  Gmax = η(πD/λ)² = 4πAeff_max/λ²\n  Gmax_dBi = 10log₁₀[η(πD/λ)²]\n\nHalf-power beamwidth:\n  θ₃dB = 70λ/D [degrees]\n\nOff-axis gain:\n  G(θ)_dBi = Gmax_dBi − 12(θ/θ₃dB)²\n\nGmax from beamwidth:\n  Gmax ≈ 29000/θ₃dB² [θ₃dB in degrees, η ≈ 0.6]\n  Gmax = 14.9η/θ₃dB² [θ₃dB in radians]",
derivation:"From diffraction:\n  θ_diff ~ λ/D → Ω_beam ~ π(λ/D)²\n  G ~ 4π/Ω_beam = 4D²/λ²\n\nIntroducing effective aperture:\n  Aeff_max = ηπD²/4\n  Gmax = 4πAeff_max/λ² = η(πD/λ)² ✓\n\nRelating gain to beamwidth:\n  θ₃dB = 70λ/D → λ/D = θ₃dB/70\n  Gmax = η(70π/θ₃dB)² = η×49000/θ₃dB²\n  For η = 0.6: Gmax ≈ 29000/θ₃dB²\n\nOff-axis approximation (Gaussian taper):\n  G(θ)/Gmax = exp[−4ln2(θ/θ₃dB)²]\n  In dB: G(θ)_dBi ≈ Gmax_dBi − 12(θ/θ₃dB)²",
matlab:'<span class="cmt">% === Antenna Gain & Pattern Calculator ===</span>\nc = <span class="num">3e8</span>;\nD = <span class="num">35</span>; f = <span class="num">8.45e9</span>; eta = <span class="num">0.6</span>;\nlam = c/f;\n\nGmax = eta*(pi*D/lam)^<span class="num">2</span>;\nGmax_dBi = <span class="num">10</span>*<span class="fn">log10</span>(Gmax);\ntheta3dB = <span class="num">70</span>*lam/D;  <span class="cmt">% degrees</span>\n\n<span class="fn">fprintf</span>(<span class="str">\'D=%dm, f=%.2fGHz, λ=%.4fm\\n\'</span>, D, f/<span class="num">1e9</span>, lam);\n<span class="fn">fprintf</span>(<span class="str">\'Gmax = %.1f dBi\\n\'</span>, Gmax_dBi);\n<span class="fn">fprintf</span>(<span class="str">\'HPBW = %.4f deg = %.2f arcmin\\n\'</span>, theta3dB, theta3dB*<span class="num">60</span>);\n<span class="fn">fprintf</span>(<span class="str">\'Gmax from HPBW: %.1f dBi (check)\\n\'</span>, ...\n    <span class="num">10</span>*<span class="fn">log10</span>(<span class="num">29000</span>/theta3dB^<span class="num">2</span>));\n\n<span class="cmt">% Radiation pattern</span>\ntheta = <span class="fn">linspace</span>(<span class="num">-1</span>,<span class="num">1</span>,<span class="num">1000</span>);\nG_dBi = Gmax_dBi - <span class="num">12</span>*(theta/theta3dB).^<span class="num">2</span>;\nG_dBi(G_dBi<<span class="num">0</span>)=<span class="num">0</span>;\n<span class="kw">figure</span>;\n<span class="fn">plot</span>(theta*<span class="num">60</span>, G_dBi, <span class="str">\'b-\'</span>, <span class="str">\'LineWidth\'</span>, <span class="num">2</span>);\n<span class="fn">xlabel</span>(<span class="str">\'Off-axis [arcmin]\'</span>); <span class="fn">ylabel</span>(<span class="str">\'Gain [dBi]\'</span>);\n<span class="fn">title</span>(<span class="str">\'Radiation Pattern\'</span>); <span class="kw">grid</span> <span class="kw">on</span>;',
diagrams:'<svg viewBox="0 0 660 230" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Antenna Gain vs Size at X-band (8.4 GHz)</text><line x1="60" y1="200" x2="620" y2="200" stroke="#1a1a18"/><line x1="60" y1="200" x2="60" y2="40" stroke="#1a1a18"/><text x="56" y="38" text-anchor="end" font-size="10">G [dBi]</text><text x="620" y="215" font-size="10">D [m]</text><g fill="#2563eb"><rect x="100" y="182" width="40" height="18" rx="4"/><text x="120" y="175" text-anchor="middle" font-size="9" fill="#2563eb">LGA</text><text x="120" y="195" text-anchor="middle" font-size="9" fill="#fff">~0</text><rect x="180" y="140" width="40" height="60" rx="4"/><text x="200" y="133" text-anchor="middle" font-size="9" fill="#2563eb">1m</text><text x="200" y="175" text-anchor="middle" font-size="9" fill="#fff">37</text><rect x="280" y="105" width="50" height="95" rx="4"/><text x="305" y="98" text-anchor="middle" font-size="9" fill="#2563eb">4m HGA</text><text x="305" y="158" text-anchor="middle" font-size="9" fill="#fff">49</text><rect x="400" y="72" width="55" height="128" rx="4" fill="#0f766e"/><text x="428" y="65" text-anchor="middle" font-size="9" fill="#0f766e">35m ESA</text><text x="428" y="142" text-anchor="middle" font-size="9" fill="#fff">68</text><rect x="520" y="52" width="55" height="148" rx="4" fill="#dc2626"/><text x="548" y="45" text-anchor="middle" font-size="9" fill="#dc2626">70m DSN</text><text x="548" y="132" text-anchor="middle" font-size="9" fill="#fff">74</text></g></svg>',
graphs:'<div class="graph-desc"><h4>Radiation Pattern — ESA 35m DSA1 (Slide 21)</h4><p>Polar plot showing sharp main lobe at boresight (~68 dBi), first sidelobes ~15–20 dB below. Pattern is NOT symmetric — asymmetry from tripod supporting subreflector. Sidelobes pick up thermal noise from ground. The −3 dB points define θ₃dB.</p></div><div class="graph-desc"><h4>Off-Axis Gain Loss</h4><p>G(θ) − Gmax = −12(θ/θ₃dB)². A pointing error of θ₃dB/2 costs exactly 3 dB (half power). This defines the pointing accuracy requirement for the servo system.</p></div>',
traps:[{n:1,t:"θ₃dB = 70λ/D gives DEGREES, not radians. Gmax = 29000/θ₃dB² requires degrees."},{n:2,t:"η ≠ 1: writing Gmax = (πD/λ)² without η ≈ 0.6 overestimates gain by ~2 dB."},{n:3,t:"Off-axis formula valid ONLY for θ < θ₃dB/2. Beyond that, sidelobes are complex."},{n:4,t:"Gain depends on direction. Always specify Gmax (boresight) or G(θ) for off-axis."}],
drill:[{q:"35m at X-band (8.45 GHz), η=0.6. Gain in dBi?",a:"λ = 0.0355 m. Gmax = 0.6×(π×35/0.0355)² = 5.75×10⁶. 10log₁₀(5.75×10⁶) = 67.6 dBi."},{q:"Pointing error = half HPBW. How much gain lost?",a:"ΔG = −12(0.5)² = −3 dB. Exactly half power. This is the definition of θ₃dB."},{q:"Express Gmax purely in terms of θ₃dB, without D or λ.",a:"θ₃dB = 70λ/D → Gmax = η(70π/θ₃dB)² ≈ 29000/θ₃dB² for η=0.6. Gain depends only on beamwidth and efficiency."}]},

{id:"link",title:"4. EIRP & Link Budget",slides:"23–26",icon:"📈",
overview:"The link budget models end-to-end power from TX to RX.\n\nEIRP = GT × PT [W] — apparent power toward receiver.\n\nReceived power:\n  PRX = EIRP/(4πR²) × (1/LATM) × Aeff_RX\n  PRX = EIRP × GRX / (LFS × LATM)\n\nwhere LFS = (4πR/λ)² is free space loss.\n\nIn dB (ALWAYS done this way):\n  PRX [dBW] = EIRP − LFS − LATM + GRX\n\nC/N₀ = EIRP − LFS − LATM + G/T + 228.6 [dB-Hz]\n\nwhere 228.6 = −10log₁₀(k).\n\nThe link designer's job: ensure PRX gives sufficient C/N₀ for the required data rate and measurement accuracy.",
equations:"EIRP = GT × PT [W]\nEIRP [dBW] = GT [dBi] + PT [dBW]\n\nFree space loss:\n  LFS = (4πR/λ)²\n  LFS [dB] = 20log₁₀(4πR/λ)\n\nLink budget:\n  PRX = EIRP − LFS − LATM + GRX [dB]\n\nC/N₀:\n  C/N₀ = EIRP − LFS − LATM + G/T + 228.6 [dB-Hz]\n\nBit rate:\n  R = (C/N₀) / (Eb/N₀)_required\n  = 10^((C/N₀_dBHz − α_dB)/10)",
derivation:"Step 1: Power flux at distance R:\n  PF = PT·GT/(4πR²) = EIRP/(4πR²)\n\nStep 2: Received power = flux × effective area:\n  PRX = PF × Aeff_RX\n\nStep 3: Account for atmosphere:\n  PRX = EIRP/(4πR²) × (1/LATM) × Aeff_RX\n\nStep 4: Substitute Aeff = GRXλ²/(4π):\n  PRX = EIRP × GRX × [λ/(4πR)]² / LATM\n  = EIRP × GRX / (LFS × LATM)\n\nStep 5: In dB:\n  PRX = EIRP + GRX − LFS − LATM [all dB]\n\nThis is the fundamental link budget equation.",
matlab:'<span class="cmt">% === Link Budget Calculator: Cassini at Saturn ===</span>\nc = <span class="num">3e8</span>; k = <span class="num">1.38e-23</span>;\n\n<span class="cmt">% Spacecraft</span>\nPT = <span class="num">20</span>; PT_dBW = <span class="num">10</span>*<span class="fn">log10</span>(PT);  <span class="cmt">% 20 W</span>\nGT_dBi = <span class="num">47.2</span>;  <span class="cmt">% 4m HGA at X-band</span>\n\n<span class="cmt">% Path: Saturn ~9.5 AU</span>\nR = <span class="num">9.5</span>*<span class="num">1.496e11</span>;\nf = <span class="num">8.4e9</span>; lam = c/f;\nLFS_dB = <span class="num">20</span>*<span class="fn">log10</span>(<span class="num">4</span>*<span class="kw">pi</span>*R/lam);\nLATM_dB = <span class="num">0.3</span>;\n\n<span class="cmt">% Ground: DSN 34m</span>\nGR_dBi = <span class="num">68.0</span>; Tsys = <span class="num">25</span>;\nGT_ratio = GR_dBi - <span class="num">10</span>*<span class="fn">log10</span>(Tsys);\n\nEIRP = PT_dBW + GT_dBi;\nPRX = EIRP - LFS_dB - LATM_dB + GR_dBi;\nCN0 = EIRP - LFS_dB - LATM_dB + GT_ratio + <span class="num">228.6</span>;\n\nalpha = <span class="num">9.6</span>;  <span class="cmt">% Eb/N0 for BPSK BER=1e-5</span>\nR_bps = <span class="num">10</span>^((CN0-alpha)/<span class="num">10</span>);\n\n<span class="fn">fprintf</span>(<span class="str">\'EIRP=%.1f dBW, LFS=%.1f dB\\n\'</span>, EIRP, LFS_dB);\n<span class="fn">fprintf</span>(<span class="str">\'PRX=%.1f dBW, C/N0=%.1f dBHz\\n\'</span>, PRX, CN0);\n<span class="fn">fprintf</span>(<span class="str">\'Max rate=%.0f bps (BER=1e-5)\\n\'</span>, R_bps);',
diagrams:'<svg viewBox="0 0 660 180" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Link Budget Flow (dB Arithmetic)</text><rect x="20" y="45" width="100" height="55" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="70" y="68" text-anchor="middle" font-weight="600" font-size="10">TRANSMITTER</text><text x="70" y="82" text-anchor="middle" font-size="9" fill="#2563eb">EIRP = PT+GT</text><line x1="120" y1="72" x2="170" y2="72" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2)"/><rect x="172" y="45" width="110" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="227" y="65" text-anchor="middle" font-weight="600" font-size="10" fill="#dc2626">PATH LOSS</text><text x="227" y="80" text-anchor="middle" font-size="9" fill="#dc2626">−LFS −LATM</text><text x="227" y="92" text-anchor="middle" font-size="8" fill="#5a5a55">LFS ∝ R² (dominant)</text><line x1="282" y1="72" x2="332" y2="72" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2)"/><rect x="334" y="45" width="100" height="55" rx="8" fill="#ecfdf5" stroke="#86efac"/><text x="384" y="65" text-anchor="middle" font-weight="600" font-size="10" fill="#0f766e">RECEIVER</text><text x="384" y="80" text-anchor="middle" font-size="9" fill="#0f766e">+GRX</text><text x="384" y="92" text-anchor="middle" font-size="8" fill="#5a5a55">G/T = GRX/Tsys</text><line x1="434" y1="72" x2="484" y2="72" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2)"/><rect x="486" y="45" width="120" height="55" rx="8" fill="#2563eb"/><text x="546" y="68" text-anchor="middle" font-weight="600" font-size="11" fill="#fff">C/N₀</text><text x="546" y="84" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)">→ Eb/N₀ → BER → R</text><text x="330" y="140" text-anchor="middle" font-size="11" fill="#1a1a18" font-weight="500">PRX [dBW] = EIRP − LFS − LATM + GRX</text><text x="330" y="160" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="500">C/N₀ [dBHz] = EIRP − LFS − LATM + G/T + 228.6</text></svg>',
graphs:'<div class="graph-desc"><h4>Link Budget Waterfall Chart</h4><p>EIRP (+60 dBW) → −LFS (−290 dB) → −LATM (−0.3 dB) → +GRX (+68 dBi) → PRX (~−162 dBW). Free space loss is the dominant factor. Large ground antennas (+68 dBi) and high EIRP are essential for deep space.</p></div><div class="graph-desc"><h4>Max Bit Rate vs Distance</h4><p>Curve drops as R² because LFS ∝ R². At 1 AU: ~1 Mbps. Jupiter: ~40 kbps. Saturn: ~15 kbps. Neptune: ~3 kbps. Every doubling of distance cuts data rate by 4× (−6 dB). This is why deep space missions have limited data return.</p></div>',
traps:[{n:1,t:"ALL link budgets are done in dB. Gains added, losses subtracted. Don't mix linear and dB values."},{n:2,t:"LFS is NOT physical absorption — it's geometric spreading over 4πR². The name 'free space loss' is misleading."},{n:3,t:"Higher f → smaller λ → higher LFS, BUT also higher G ∝ (D/λ)². Net effect depends on antenna sizes."},{n:4,t:"JUICE exercise (slide 37): 1.4 Gbit/day at Jupiter, 8h contact, 35m antenna. Must work this out quantitatively."}],
drill:[{q:"Double the distance R. How does PRX change in dB?",a:"LFS ∝ R², so doubling R adds +6 dB to LFS. PRX decreases by 6 dB (factor 4 in linear power)."},{q:"Write C/N₀ in dB. What is the receiver figure of merit?",a:"C/N₀ = EIRP − LFS − LATM + G/T + 228.6 [dB-Hz]. Receiver figure of merit: G/T = GRX/Tsys. Higher G/T = better sensitivity."},{q:"Double Tsys. What happens to bit rate at same BER?",a:"Doubling Tsys reduces C/N₀ by 3 dB. Since R = C/(N₀×α), bit rate must halve. Classic link budget trade-off from Prof. Iess's exam list."}]},

{id:"noise",title:"5. Noise Model & Cascade",slides:"27–29",icon:"🌡️",
overview:"Every element adds noise characterised by equivalent temperature T. For a resistor at T:\n  N = kTB [W]\nwhere k = 1.379×10⁻²³ W/(K·Hz).\n\nKey temperatures:\n  Tant: galactic (~10 K), Earth sidelobes, Sun\n  Tsys: all receiving chain noise at receiver input\n  Teq = Tant + Tsys\n\nCascade of n amplification stages:\n  Te = Te₁ + Te₂/G₁ + Te₃/(G₁G₂) + ...\n\nThe FIRST STAGE DOMINATES if G₁ >> Te₂/Te₁. This is why the LNA must have:\n  1. LOW Te₁ (cryogenic to ~15 K)\n  2. HIGH G₁ (suppress downstream noise)\n\nNoise figure: F = 1 + Te/T₀ (T₀ = 290 K)\n\nState-of-the-art: Tsys < 30 K at X-band for deep space stations.",
equations:"Thermal noise:\n  N = kTB [W],  N₀ = kT [W/Hz]\n\nBoltzmann: k = 1.379×10⁻²³ W/(K·Hz)\n  10log₁₀(kT₀) = −204 dBW/Hz (T₀=290K)\n  10log₁₀(k) = −228.6 dBW/(K·Hz)\n\nNoise figure: F = 1 + Te/T₀\n\nCascade:\n  Te = Te₁ + Te₂/G₁ + Te₃/(G₁G₂) + ...\n\nSystem: Teq = Tant + Tsys\n\nExample (DSN 34m BWG):\n  Te₁ = 15 K, G₁ = 1000 (LNA)\n  Te₂ = 200 K, G₂ = 100 (2nd amp)\n  Te_total = 15 + 0.2 + ... ≈ 15.2 K",
derivation:"Two-stage cascade derivation:\n\nStage 1 output: N₁ = G₁kB(Ts + Te₁)\nStage 2 amplifies N₁ and adds own noise:\n  N = G₂N₁ + G₂kBTe₂\n  = G₁G₂kB(Ts + Te₁ + Te₂/G₁)\n\nTotal equivalent temp: Te = Te₁ + Te₂/G₁\n\nGeneralising to n stages:\n  Te = Te₁ + Te₂/G₁ + Te₃/(G₁G₂) + ...\n\nIf G₁ >> Te₂/Te₁, second stage contributes negligibly.\nWith G₁ = 1000, Te₂ = 200: Te₂/G₁ = 0.2 K → negligible vs Te₁ = 15 K.\n\nThis is why the LNA is THE most critical component.",
matlab:'<span class="cmt">% === Noise Temperature Cascade ===</span>\nk = <span class="num">1.38e-23</span>;\n\n<span class="cmt">% DSN 34-m BWG chain</span>\nTe1 = <span class="num">15</span>; G1 = <span class="num">1000</span>;   <span class="cmt">% LNA: 15K, 30dB</span>\nTe2 = <span class="num">200</span>; G2 = <span class="num">100</span>;   <span class="cmt">% 2nd amp: 200K, 20dB</span>\nTe3 = <span class="num">500</span>;\n\nTe = Te1 + Te2/G1 + Te3/(G1*G2);\n<span class="fn">fprintf</span>(<span class="str">\'Cascade Te = %.3f K\\n\'</span>, Te);\n<span class="fn">fprintf</span>(<span class="str">\'  LNA:     %.1f K (%.1f%%)\\n\'</span>, Te1, Te1/Te*<span class="num">100</span>);\n<span class="fn">fprintf</span>(<span class="str">\'  2nd/G1:  %.3f K (%.1f%%)\\n\'</span>, Te2/G1, Te2/G1/Te*<span class="num">100</span>);\n\nTant = <span class="num">10</span>;\nTeq = Tant + Te;\n<span class="fn">fprintf</span>(<span class="str">\'Teq = Tant+Te = %.1f K\\n\'</span>, Teq);\n<span class="fn">fprintf</span>(<span class="str">\'N0 = %.2e W/Hz = %.1f dBW/Hz\\n\'</span>, k*Teq, <span class="num">10</span>*<span class="fn">log10</span>(k*Teq));',
diagrams:'<svg viewBox="0 0 660 160" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0f766e"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Receiving Chain Noise Model</text><rect x="20" y="50" width="70" height="45" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="55" y="70" text-anchor="middle" font-size="10" font-weight="500">Antenna</text><text x="55" y="84" text-anchor="middle" font-size="9" fill="#2563eb">Tant~10K</text><line x1="90" y1="72" x2="120" y2="72" stroke="#0f766e" marker-end="url(#a3)"/><rect x="122" y="50" width="90" height="45" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="167" y="68" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">LNA</text><text x="167" y="84" text-anchor="middle" font-size="9" fill="#0f766e">Te₁=15K, G₁=30dB</text><line x1="212" y1="72" x2="242" y2="72" stroke="#0f766e" marker-end="url(#a3)"/><rect x="244" y="50" width="90" height="45" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="289" y="68" text-anchor="middle" font-size="10">2nd Amp</text><text x="289" y="84" text-anchor="middle" font-size="9" fill="#5a5a55">Te₂=200K, G₂=20dB</text><line x1="334" y1="72" x2="364" y2="72" stroke="#0f766e" marker-end="url(#a3)"/><rect x="366" y="50" width="80" height="45" rx="8" fill="#fff" stroke="#d8d6d0"/><text x="406" y="68" text-anchor="middle" font-size="10">Down-conv</text><text x="406" y="84" text-anchor="middle" font-size="9" fill="#5a5a55">Te₃=500K</text><line x1="446" y1="72" x2="476" y2="72" stroke="#0f766e" marker-end="url(#a3)"/><rect x="478" y="50" width="80" height="45" rx="8" fill="#2563eb"/><text x="518" y="75" text-anchor="middle" font-size="10" fill="#fff" font-weight="500">Receiver</text><text x="330" y="120" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">Te = 15 + 200/1000 + ... ≈ 15.2 K → LNA dominates (98.7%)</text><text x="330" y="140" text-anchor="middle" font-size="10" fill="#5a5a55">Tsys referred to LNA input ← here</text></svg>',
graphs:'<div class="graph-desc"><h4>Stage Contribution Bar Chart</h4><p>LNA: 15 K (98.7% of total). 2nd amp: 0.2 K (1.3%). 3rd stage: negligible. The first stage utterly dominates. Investing in a better LNA (lower Te₁) is far more effective than improving downstream. This is why cryogenic LNAs (~15–20 K) are essential for deep space stations.</p></div>',
traps:[{n:1,t:"Tsys ALWAYS referred to receiver input, not output. If at output, it would scale with gain — meaningless as a figure of merit."},{n:2,t:"Noise figure vs temperature: F = 1 + Te/290. Perfect: F=1, Te=0. Don't confuse them."},{n:3,t:"Cascade formula proves only FIRST stage matters. Prof will ask 'why is LNA so important?' → cite cascade formula."},{n:4,t:"Tant ≠ antenna physical temperature. It's the equivalent temperature of a resistor producing the same noise power."}],
drill:[{q:"If LNA gain drops from 30 dB to 20 dB, how does Tsys change?",a:"G₁: 1000→100. Te₂/G₁: 0.2→2.0 K. Total Te: 15.2→17 K. Teq: 25.2→27 K. ~8% degradation, ~0.3 dB C/N₀ loss."},{q:"Why can't amplifier noise be characterised by physical temperature?",a:"Te is the equivalent temperature producing the same noise. A 300 K amplifier can have Te = 50 K (good) or 1000 K (bad). Te depends on electronic design, not ambient temperature."},{q:"What is 10log₁₀(k) and why memorise it?",a:"−228.6 dBW/(K·Hz). Appears in every link budget: C/N₀ = PRX − 10log₁₀(k) − 10log₁₀(Tsys). Essential constant."}]},

{id:"cn0",title:"6. C/N₀ & Figure of Merit",slides:"30",icon:"📡",
overview:"C/N₀ = PRX/(kTsys) is THE master metric.\n\nC/N₀ [dB-Hz] = EIRP − LFS − LATM + G/T + 228.6\n\nG/T = GRX/Tsys captures receiver sensitivity.\n\nFrom C/N₀:\n• Carrier tracking (Pc/N₀) → Doppler\n• Ranging (Pr/N₀) → Range\n• Data rate: R = (C/N₀)/(Eb/N₀)_required\n\nG/T measured via Y-factor:\n  Point at Sun: P_sun. Point at cold sky: P_cold.\n  Y = P_sun/P_cold\n  G/T = (Y−1)×8πk/(F×L×λ²)",
equations:"C/N₀ = PRX/(kTsys) [Hz]\nC/N₀ [dBHz] = EIRP − LFS − LATM + G/T + 228.6\n\nG/T = GRX/Tsys [K⁻¹]\nG/T [dB/K] = GRX [dBi] − 10log₁₀(Tsys)\n\nR = (C/N₀)/α  [bps]\n\nY-factor: Y = P_sun/P_cold\nG/T = (Y−1)×8πk/(F×L×λ²)",
derivation:"C/N₀ from link budget:\n  PRX = EIRP × GRX / (LFS × LATM)\n  N₀ = kTsys\n  C/N₀ = PRX/N₀ = EIRP/(LFS × LATM × k) × (GRX/Tsys)\n\nIn dB: C/N₀ = EIRP − LFS − LATM + G/T + 228.6\n\nY-factor method:\n  P_sun/P_cold = (Tsys + T_sun_eff)/Tsys = 1 + T_sun_eff/Tsys\n  T_sun_eff = F×G×λ²×L/(8πk)\n  → G/T = (Y−1)×8πk/(F×L×λ²)",
matlab:'<span class="cmt">% === G/T from Y-factor ===</span>\nk=<span class="num">1.38e-23</span>;c=<span class="num">3e8</span>;f=<span class="num">8.45e9</span>;lam=c/f;D=<span class="num">34</span>;eta=<span class="num">0.6</span>;\nGmax=eta*(pi*D/lam)^<span class="num">2</span>; G_dBi=<span class="num">10</span>*<span class="fn">log10</span>(Gmax);\nTsys=<span class="num">25</span>; F_sol=<span class="num">1e-22</span>; L=<span class="num">1.05</span>;\nTsun=F_sol*Gmax*lam^<span class="num">2</span>/(<span class="num">8</span>*pi*k)*L;\nY=<span class="num">1</span>+Tsun/Tsys;\nGT=(Y-<span class="num">1</span>)*<span class="num">8</span>*pi*k/(F_sol*L*lam^<span class="num">2</span>);\n<span class="fn">fprintf</span>(<span class="str">\'G/T = %.1f dB/K (meas) vs %.1f dB/K (calc)\\n\'</span>,...\n    <span class="num">10</span>*<span class="fn">log10</span>(GT), G_dBi-<span class="num">10</span>*<span class="fn">log10</span>(Tsys));',
diagrams:'<svg viewBox="0 0 660 130" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">C/N₀ → Observables</text><rect x="240" y="35" width="180" height="35" rx="8" fill="#2563eb"/><text x="330" y="57" text-anchor="middle" fill="#fff" font-weight="600">C/N₀ [dB-Hz]</text><line x1="280" y1="70" x2="120" y2="95" stroke="#2563eb"/><line x1="330" y1="70" x2="330" y2="95" stroke="#2563eb"/><line x1="380" y1="70" x2="540" y2="95" stroke="#2563eb"/><rect x="60" y="95" width="120" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="120" y="113" text-anchor="middle" font-size="10">Pc/N₀ → Doppler</text><rect x="270" y="95" width="120" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="330" y="113" text-anchor="middle" font-size="10">Pr/N₀ → Range</text><rect x="480" y="95" width="120" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="540" y="113" text-anchor="middle" font-size="10">Eb/N₀ → Telemetry</text></svg>',
graphs:'<div class="graph-desc"><h4>G/T vs System Noise Temperature</h4><p>For a 34m antenna at X-band: G/T = 67.6 − 10log₁₀(Tsys). At 25 K: 53.6 dB/K (cryogenic DSN). At 290 K: 43.0 dB/K. Going cryogenic gives ~10 dB improvement — equivalent to 3× larger dish! Cost-effective vs building bigger antennas.</p></div>',
traps:[{n:1,t:"G/T units: dB/K. The '/' is ratio in linear, expressed in dB: G/T = G[dBi] − 10log₁₀(T)."},{n:2,t:"C/N₀ ≠ C/N. C/N₀ is in Hz. C/N = C/N₀ × B is dimensionless."},{n:3,t:"Prof may ask: 'Double Tsys → what happens to bit rate?' Answer: halves (−3 dB)."},{n:4,t:"228.6 = −10log₁₀(k). Memorise this constant."}],
drill:[{q:"C/N₀ = 50 dB-Hz. Physical meaning?",a:"Carrier power is 10⁵ times noise in 1 Hz bandwidth. Equivalently, carrier = noise in 100 kHz bandwidth."},{q:"GRX = 68 dBi, Tsys = 25 K. What is G/T?",a:"G/T = 68 − 10log₁₀(25) = 68 − 14.0 = 54.0 dB/K."},{q:"How is G/T measured in practice?",a:"Y-factor: point at Sun (P_sun), point at cold sky (P_cold). Y = P_sun/P_cold. G/T = (Y−1)×8πk/(F×L×λ²) where F = solar flux. Absolute measurement."}]},

{id:"bpsk",title:"7. BPSK & Eb/N₀",slides:"31–35",icon:"📶",
overview:"BPSK encodes bits as 180° phase shifts:\n  Bit 1: s₁(t) = A cos(ωct)\n  Bit 0: s₂(t) = −A cos(ωct)\n\nMatched filter correlates with cos(ωct):\n  If ∫ > 0 → bit 1; if < 0 → bit 0\n\nEnergy per bit: Eb = A²Tb/2 = C/R\nNoise variance: σ²N = TbN₀/2\nDecision SNR: as²/σ²N = Eb/N₀\n\nFundamental relation:\n  C/N₀ = (Eb/N₀) × R\n  → R = (C/N₀)/(Eb/N₀)_required\n\nFor BPSK at BER = 10⁻⁵: Eb/N₀ ≈ 9.6 dB\n\nTrade-off: more data rate needs more C/N₀ or more efficient modulation.",
equations:"BPSK: s₁ = Acos(ωct), s₂ = −Acos(ωct)\nCarrier power: C = A²/2\nEb = A²Tb/2 = C×Tb = C/R\n\nMatched filter: as ≈ ATb/2\nNoise variance: σ²N = TbN₀/2\nas²/σ²N = Eb/N₀\n\nC/N₀ = (Eb/N₀)×R → R = (C/N₀)/α\n\nBPSK: BER = ½erfc(√(Eb/N₀))\nBER = 10⁻⁵ → α ≈ 9.6 dB",
derivation:"Noise variance derivation (slides 32-33):\n\nσ²N = ∫∫⟨n(t)n(t')⟩cos(ωct)cos(ωct')dtdt'\n\nUsing ⟨n(t)n(t')⟩ = N₀δ(t'−t) and barycentric coords:\n  σ²N = ½N₀∫cos(2ωcη)dη + TbN₀/2\n\nFor ωcTb >> 2π: first term → 0\n  σ²N ≈ TbN₀/2 ✓\n\nTherefore: as²/σ²N = (A²Tb²/4)/(TbN₀/2) = Eb/N₀\nThe decision SNR IS the energy-per-bit to noise ratio.",
matlab:'<span class="cmt">% === BPSK BER Simulation ===</span>\nEbN0_dB = <span class="num">0</span>:<span class="num">0.5</span>:<span class="num">12</span>;\nBER_theory = <span class="num">0.5</span>*<span class="fn">erfc</span>(<span class="fn">sqrt</span>(<span class="num">10</span>.^(EbN0_dB/<span class="num">10</span>)));\n\n<span class="kw">figure</span>;\n<span class="fn">semilogy</span>(EbN0_dB, BER_theory, <span class="str">\'b-\'</span>, <span class="str">\'LineWidth\'</span>, <span class="num">2</span>);\n<span class="fn">xlabel</span>(<span class="str">\'E_b/N_0 [dB]\'</span>); <span class="fn">ylabel</span>(<span class="str">\'BER\'</span>);\n<span class="fn">title</span>(<span class="str">\'BPSK Bit Error Rate\'</span>);\n<span class="kw">grid</span> <span class="kw">on</span>; <span class="fn">ylim</span>([<span class="num">1e-6</span> <span class="num">1</span>]);\n<span class="fn">yline</span>(<span class="num">1e-5</span>, <span class="str">\'r--\'</span>, <span class="str">\'BER = 10^{-5}\'</span>);\n<span class="fn">xline</span>(<span class="num">9.6</span>, <span class="str">\'r--\'</span>, <span class="str">\'E_b/N_0 = 9.6 dB\'</span>);\n\n<span class="cmt">% Max bit rate example</span>\nCN0 = <span class="num">50</span>;  <span class="cmt">% dB-Hz</span>\nalpha = <span class="num">9.6</span>; <span class="cmt">% dB for BER=1e-5</span>\nR = <span class="num">10</span>^((CN0-alpha)/<span class="num">10</span>);\n<span class="fn">fprintf</span>(<span class="str">\'C/N0=%d dBHz → R=%.0f bps\\n\'</span>, CN0, R);',
diagrams:'<svg viewBox="0 0 660 120" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">BPSK Coherent Demodulator</text><rect x="30" y="45" width="100" height="35" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="80" y="66" text-anchor="middle" font-size="10">r(t)=±Acos+n</text><line x1="130" y1="62" x2="160" y2="62" stroke="#2563eb" marker-end="url(#a4)"/><rect x="162" y="45" width="60" height="35" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="192" y="66" text-anchor="middle" font-size="10" font-weight="500">× d(t)</text><line x1="222" y1="62" x2="252" y2="62" stroke="#2563eb" marker-end="url(#a4)"/><rect x="254" y="45" width="70" height="35" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="289" y="66" text-anchor="middle" font-size="10">∫₀ᵀᵇ dt</text><line x1="324" y1="62" x2="354" y2="62" stroke="#2563eb" marker-end="url(#a4)"/><rect x="356" y="45" width="80" height="35" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="396" y="66" text-anchor="middle" font-size="10">a > 0 ?</text><line x1="436" y1="62" x2="466" y2="62" stroke="#2563eb" marker-end="url(#a4)"/><rect x="468" y="45" width="80" height="35" rx="8" fill="#2563eb"/><text x="508" y="66" text-anchor="middle" fill="#fff" font-weight="600">bit 0/1</text><text x="192" y="100" text-anchor="middle" font-size="9" fill="#5a5a55">d(t) = cos(ωct)</text></svg>',
graphs:'<div class="graph-desc"><h4>BER vs Eb/N₀ (Slide 35)</h4><p>BPSK/QPSK: BER = ½erfc(√(Eb/N₀)). At BER = 10⁻⁵ → Eb/N₀ ≈ 9.6 dB. This is THE design chart for sizing a radio link. Given required BER, read off required Eb/N₀, then compute max R = C/N₀ / (Eb/N₀).</p></div>',
traps:[{n:1,t:"Eb/N₀ ≠ C/N. Related by C/N = (Eb/N₀)×(R/B). Don't interchange."},{n:2,t:"Carrier power = A²/2, NOT A². Common calculation error."},{n:3,t:"BPSK and QPSK have SAME BER vs Eb/N₀, but QPSK carries 2 bits/symbol → double data rate."}],
drill:[{q:"Derive C/N₀ from Eb/N₀.",a:"C = Eb/Tb = Eb×R. So C/N₀ = (Eb×R)/N₀ = (Eb/N₀)×R. Therefore Eb/N₀ = (C/N₀)/R."},{q:"C/N₀ = 50 dBHz, BPSK BER = 10⁻⁵. Max bit rate?",a:"α = 9.6 dB. R = 10^((50−9.6)/10) = 10^4.04 ≈ 11000 bps ≈ 11 kbps."},{q:"Why is matched filter optimal for BPSK in AWGN?",a:"Maximises output SNR. Correlating with expected shape maximises signal energy while noise grows only as √Tb (random walk), giving SNR ∝ Eb/N₀."}]},

{id:"design",title:"8. Link Design & JUICE",slides:"36–37",icon:"🔧",
overview:"Link design steps:\n1. Data volume → bit rate R = data_vol/contact_time\n2. BER → required Eb/N₀ = α\n3. C/N₀ = R × α\n4. Select ground station → G/T\n5. Path loss → LFS\n6. Required EIRP = C/N₀ + LFS + LATM − G/T − 228.6\n7. Size S/C: EIRP = GT + PT\n\nJUICE Exercise:\n  1.4 Gbit/day, 8h contact → R ≈ 49 kbps\n  Required C/N₀ ≈ 56.5 dBHz\n  At Jupiter with 35m ESTRACK → EIRP ≈ 58 dBW\n  → 2.5m HGA + ~40W TX at X-band",
equations:"R = data_vol/contact_time\nC/N₀ = 10log₁₀(R) + α [dBHz]\nEIRP = C/N₀ + LFS + LATM − G/T − 228.6 [dBW]\n\nJUICE:\n  R = 1.4×10⁹/(8×3600) = 48611 bps\n  α = 9.6 dB → C/N₀ = 56.5 dBHz\n  LFS(Jupiter) = 283.3 dB\n  G/T(35m,25K) = 53.6 dB/K\n  EIRP = 57.9 dBW → ~40W + 2.5m HGA",
derivation:"JUICE worked example:\n  Step 1: R = 1.4×10⁹/28800 ≈ 49 kbps\n  Step 2: α = 9.6 dB\n  Step 3: C/N₀ = 46.9 + 9.6 = 56.5 dBHz\n  Step 4: GRX(35m X) = 67.6 dBi, G/T = 53.6 dB/K\n  Step 5: LFS(5.2 AU, X) = 283.3 dB, LATM = 0.3 dB\n  Step 6: EIRP = 56.5 + 283.3 + 0.3 − 53.6 − 228.6 = 57.9 dBW\n  Step 7: 2.5m HGA → GT ≈ 42 dBi → PT = 15.9 dBW ≈ 39W",
matlab:'<span class="cmt">% === JUICE Link Design ===</span>\nc=<span class="num">3e8</span>;k=<span class="num">1.38e-23</span>;\nR=<span class="num">1.4e9</span>/(<span class="num">8</span>*<span class="num">3600</span>);\n<span class="fn">fprintf</span>(<span class="str">\'Bit rate: %.0f bps\\n\'</span>,R);\nCN0=<span class="num">10</span>*<span class="fn">log10</span>(R)+<span class="num">9.6</span>;\n<span class="fn">fprintf</span>(<span class="str">\'Required C/N0: %.1f dBHz\\n\'</span>,CN0);\n\nf=<span class="num">8.45e9</span>;lam=c/f;D_gs=<span class="num">35</span>;eta=<span class="num">0.6</span>;\nGRX=<span class="num">10</span>*<span class="fn">log10</span>(eta*(pi*D_gs/lam)^<span class="num">2</span>);\nGT=GRX-<span class="num">10</span>*<span class="fn">log10</span>(<span class="num">25</span>);\nR_jup=<span class="num">5.2</span>*<span class="num">1.496e11</span>;\nLFS=<span class="num">20</span>*<span class="fn">log10</span>(<span class="num">4</span>*pi*R_jup/lam);\nEIRP=CN0+LFS+<span class="num">0.3</span>-GT-<span class="num">228.6</span>;\n\n<span class="fn">fprintf</span>(<span class="str">\'GRX=%.1f, G/T=%.1f, LFS=%.1f\\n\'</span>,GRX,GT,LFS);\n<span class="fn">fprintf</span>(<span class="str">\'Required EIRP: %.1f dBW\\n\'</span>,EIRP);\n<span class="kw">for</span> D_sc=[<span class="num">1.5</span>,<span class="num">2</span>,<span class="num">2.5</span>,<span class="num">3</span>]\n    GT_sc=<span class="num">10</span>*<span class="fn">log10</span>(eta*(pi*D_sc/lam)^<span class="num">2</span>);\n    PT=EIRP-GT_sc;\n    <span class="fn">fprintf</span>(<span class="str">\'  D=%.1fm: PT=%.1f dBW (%.0fW)\\n\'</span>,D_sc,PT,<span class="num">10</span>^(PT/<span class="num">10</span>));\n<span class="kw">end</span>',
diagrams:"",graphs:"",
traps:[{n:1,t:"R = data_volume/contact_time. 8h contact is realistic for a single ground station."},{n:2,t:"JUICE exercise is a classic exam question. Know the numbers: ~49 kbps, ~58 dBW EIRP."},{n:3,t:"Ka-band looks better on paper but atmospheric losses are higher and weather-dependent."}],
drill:[{q:"JUICE: 1.4 Gbit/day, 8h contact. Bit rate?",a:"R = 1.4×10⁹/28800 ≈ 49 kbps."},{q:"Double contact time (8→16h). EIRP change?",a:"R halves → C/N₀ drops 3 dB → EIRP drops 3 dB (halve TX power)."},{q:"Why 'iterations needed'?",a:"Link design is coupled to system design. Antenna size affects mass/attitude. TX power affects thermal. Ground station affects cost/scheduling. All interact → iterative refinement."}]},

{id:"pol",title:"9. Polarization, PFD & G/T",slides:"38–42",icon:"🔄",
overview:"Circular polarization preferred for space: no loss regardless of antenna orientation.\nLinear polarization: loss = cos²(θ) → total loss at 90°.\n\nPFD = EIRP/(4πR²×bandwidth) [W/m²/Hz]\n\nG/T measured by Y-factor method (see Module 6).",
equations:"Linear pol loss: cos²(θ)\n  θ=0°: 0 dB, θ=45°: −3 dB, θ=90°: −∞ dB\n\nCircular pol: 0 dB at all angles\n\nPF = EIRP/(4πR²) [W/m²]\nPFD = PF/BW [W/m²/Hz]",
derivation:"Why circular for space: spacecraft orientation changes continuously. Linear pol would cause varying signal loss. Circular is orientation-independent.\n\nException: VSAT/telecom uses dual linear (V+H) for frequency reuse — doubling capacity by using both polarisations at the same frequency.",
matlab:'<span class="cmt">% === Polarization Loss ===</span>\ntheta = <span class="num">0</span>:<span class="num">90</span>;\nloss_dB = <span class="num">10</span>*<span class="fn">log10</span>(<span class="fn">cosd</span>(theta).^<span class="num">2</span>);\n<span class="kw">figure</span>;\n<span class="fn">plot</span>(theta, loss_dB, <span class="str">\'r-\'</span>, <span class="str">\'LineWidth\'</span>, <span class="num">2</span>); <span class="kw">hold</span> <span class="kw">on</span>;\n<span class="fn">plot</span>(theta, <span class="fn">zeros</span>(<span class="fn">size</span>(theta)), <span class="str">\'b--\'</span>, <span class="str">\'LineWidth\'</span>, <span class="num">2</span>);\n<span class="fn">xlabel</span>(<span class="str">\'Rotation [deg]\'</span>); <span class="fn">ylabel</span>(<span class="str">\'Loss [dB]\'</span>);\n<span class="fn">legend</span>(<span class="str">\'Linear\'</span>,<span class="str">\'Circular\'</span>);\n<span class="fn">title</span>(<span class="str">\'Polarization Loss\'</span>); <span class="kw">grid</span> <span class="kw">on</span>;',
diagrams:"",graphs:'<div class="graph-desc"><h4>Polarization Loss vs Misalignment</h4><p>Linear: cos²(θ). At 45°: −3 dB. At 90°: total loss. Circular: 0 dB everywhere. This is why space missions use circular polarization — a tumbling spacecraft would cause continuous signal variation with linear pol.</p></div>',
traps:[{n:1,t:"RHCP and LHCP are different. If TX sends RHCP and RX is LHCP → total loss."},{n:2,t:"Dual linear polarization enables frequency reuse (double capacity) but requires controlled antenna orientation."}],
drill:[{q:"Why circular polarization for space?",a:"S/C orientation changes continuously. Linear pol at 90° misalignment → total signal loss. Circular is orientation-independent."},{q:"PF vs PFD?",a:"PF = EIRP/(4πR²) [W/m²]. PFD = PF per Hz [W/m²/Hz]. PFD used for comparing signals at different bandwidths."}]},

{id:"sca",title:"10. S/C Antennas: LGA, MGA, HGA",slides:"43–51",icon:"🛰️",
overview:"Every spacecraft carries multiple antennas:\n\nLGA (×2): −2 to −3 dBi, pseudo-omnidirectional. Emergency/safe mode.\nMGA (30–60 cm): ~25 dBi. Intermediate use.\nHGA (1–4 m): 30–48 dBi. Normal science downlink.\n\nFeed horn: transducer between EM waves and electrical signals. Phase center at focal point. Separates polarisations.\n\nExamples: Cassini 4m fixed HGA (S/X/Ku/Ka), BepiColombo steerable 2-DOF HGA, Rosetta X-band MGA.",
equations:"HGA gain at X-band (η=0.6):\n  D=1m: 36.6 dBi, D=2m: 42.6 dBi\n  D=4m: 48.6 dBi\n\nBeamwidth (D=4m, X):\n  θ₃dB = 70×0.036/4 = 0.63°\n  → tight pointing requirement!",
derivation:"Cassini fixed HGA rationale: doubles as sunshield during Venus flybys. Steerable would add mass, complexity, failure modes. During Venus phases, LGAs are used. At Saturn, the Earth direction changes slowly → attitude manoeuvres maintain HGA pointing.\n\nBepiColombo steerable: thermal constraints near Mercury prevent free spacecraft pointing → 2-DOF gimbal needed.",
matlab:'<span class="cmt">% === S/C Antenna Comparison ===</span>\nc=<span class="num">3e8</span>;f=<span class="num">8.4e9</span>;lam=c/f;eta=<span class="num">0.6</span>;\nnames={<span class="str">\'LGA\'</span>,<span class="str">\'MGA 0.5m\'</span>,<span class="str">\'HGA 2m\'</span>,<span class="str">\'HGA 4m\'</span>};\nDs=[<span class="num">0</span>,<span class="num">0.5</span>,<span class="num">2</span>,<span class="num">4</span>];\n<span class="kw">for</span> i=<span class="num">1</span>:<span class="num">4</span>\n  <span class="kw">if</span> Ds(i)><span class="num">0</span>\n    G=<span class="num">10</span>*<span class="fn">log10</span>(eta*(pi*Ds(i)/lam)^<span class="num">2</span>);\n    th=<span class="num">70</span>*lam/Ds(i);\n  <span class="kw">else</span>\n    G=-<span class="num">3</span>;th=<span class="num">180</span>;\n  <span class="kw">end</span>\n  <span class="fn">fprintf</span>(<span class="str">\'%s: G=%.1f dBi, θ=%.2f°\\n\'</span>,names{i},G,th);\n<span class="kw">end</span>',
diagrams:'<div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Rosetta_spacecraft_model.png/800px-Rosetta_spacecraft_model.png" alt="Rosetta spacecraft" loading="lazy"><div class="img-cap">Rosetta spacecraft showing the 2.2m steerable HGA (dish visible at top), solar panels, and instrument boom. The HGA was critical for data return from comet 67P at >3 AU from the Sun.</div></div>',
graphs:'<div class="graph-desc"><h4>Gain vs Antenna Diameter</h4><p>Three curves (S/X/Ka). G ∝ D². Doubling D → +6 dB gain. Ka gives highest gain at any size but requires tightest pointing. Optimal size depends on mass/pointing budgets.</p></div>',
traps:[{n:1,t:"LGA gain is NEGATIVE (−2 to −3 dBi) — worse than isotropic but provides hemispheric coverage."},{n:2,t:"Feed horn IS an antenna. Used alone (without reflector) → horn antenna → LGA."},{n:3,t:"Phase center ≠ geometric center of horn. Misplacement at focal point degrades gain."}],
drill:[{q:"Why two LGAs per spacecraft?",a:"One per hemisphere → pseudo-omnidirectional. At least one visible regardless of orientation. Critical for safe mode when spacecraft may be tumbling."},{q:"4m HGA at X-band: θ₃dB ≈ 0.63°. Implication?",a:"Attitude control must point HGA at Earth with <0.3° accuracy (half beamwidth for 3 dB). Drives star tracker and reaction wheel design. If pointing degrades → switch to MGA/LGA with much lower data rate."}]},

{id:"trp",title:"11. Transponders & Turnaround",slides:"52–53",icon:"🔄",
overview:"The transponder receives uplink, locks via PLL, coherently retransmits at fD = (M/N)×fU.\n\nCoherent turnaround ratios:\n  S→S: 240/221 (1.086)\n  X→X: 880/749 (1.175)\n  S→X: 880/221, X→S: 240/749\n\nCOHERENCE is the key word. The downlink phase is deterministically related to uplink → enables precision Doppler, 2-way ranging, plasma calibration.\n\nRosetta/Mars-Express transponder:\n  X up: 7.145–7.235 GHz, X down: 8.400–8.500 GHz\n  Stability: ±3 ppm, Mass: 6.3 kg, Power: ~46 W",
equations:"fD = (M/N) × fU\n  X→X: 880/749 → fD/fU = 1.1749\n\n2-way Doppler with turnaround:\n  fD_rx = (M/N)×fU×(1−vr/c)²\n  Δf ≈ −(M/N)×fU×(2vr/c)",
derivation:"Why rational ratios M/N?\n\nImplemented as: PLL → ÷N (digital divider) → ×M (multiplier)\nInteger operations maintain EXACT phase coherence.\nIrrational ratio → can't implement with integer counters → phase noise → no precision Doppler.\n\nSpecific ratios place fD in allocated downlink band while avoiding self-interference.",
matlab:'<span class="cmt">% === Turnaround Ratios ===</span>\nratios = [<span class="num">240</span>/<span class="num">221</span>, <span class="num">880</span>/<span class="num">749</span>, <span class="num">880</span>/<span class="num">221</span>, <span class="num">240</span>/<span class="num">749</span>];\nnames = {<span class="str">\'S→S\'</span>,<span class="str">\'X→X\'</span>,<span class="str">\'S→X\'</span>,<span class="str">\'X→S\'</span>};\nfU = [<span class="num">2.1e9</span>,<span class="num">7.19e9</span>,<span class="num">2.1e9</span>,<span class="num">7.19e9</span>];\n<span class="kw">for</span> i=<span class="num">1</span>:<span class="num">4</span>\n  <span class="fn">fprintf</span>(<span class="str">\'%s: %.6f → fD=%.3fGHz\\n\'</span>,...\n      names{i},ratios(i),ratios(i)*fU(i)/<span class="num">1e9</span>);\n<span class="kw">end</span>',
diagrams:'<svg viewBox="0 0 660 140" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Transponder Block Diagram</text><rect x="30" y="45" width="80" height="35" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="70" y="66" text-anchor="middle" font-size="10">fU input</text><line x1="110" y1="62" x2="140" y2="62" stroke="#2563eb" marker-end="url(#a5)"/><rect x="142" y="45" width="70" height="35" rx="6" fill="#ecfdf5" stroke="#86efac"/><text x="177" y="66" text-anchor="middle" font-size="10" font-weight="500">PLL</text><line x1="212" y1="62" x2="242" y2="62" stroke="#2563eb" marker-end="url(#a5)"/><rect x="244" y="45" width="70" height="35" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="279" y="66" text-anchor="middle" font-size="10">÷ 749</text><line x1="314" y1="62" x2="344" y2="62" stroke="#2563eb" marker-end="url(#a5)"/><rect x="346" y="45" width="70" height="35" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="381" y="66" text-anchor="middle" font-size="10">× 880</text><line x1="416" y1="62" x2="446" y2="62" stroke="#2563eb" marker-end="url(#a5)"/><rect x="448" y="45" width="70" height="35" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="483" y="66" text-anchor="middle" font-size="10">+ TLM</text><line x1="518" y1="62" x2="548" y2="62" stroke="#2563eb" marker-end="url(#a5)"/><rect x="550" y="45" width="80" height="35" rx="6" fill="#dc2626"/><text x="590" y="66" text-anchor="middle" fill="#fff" font-size="10" font-weight="500">fD output</text><text x="330" y="110" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="500">fD = (880/749) × fU — exact phase coherence</text></svg>',
graphs:"",
traps:[{n:1,t:"Turnaround ratio ≠ 1. X→X is 880/749 ≈ 1.175. Downlink ~17.5% higher than uplink."},{n:2,t:"Coherent ≠ same frequency. It means the phase relationship is deterministic."},{n:3,t:"In TWNC, transponder does NOT lock to uplink → onboard oscillator → orders-of-magnitude worse Doppler."}],
drill:[{q:"X-band turnaround ratio — what does it mean?",a:"880/749 ≈ 1.175. For fU = 7.19 GHz → fD = 8.45 GHz. Falls in allocated X-band downlink. Exact phase coherence maintained via integer divide/multiply."},{q:"Why must ratios be rational?",a:"Rational M/N → integer dividers and multipliers → exact digital implementation → zero phase noise from conversion. Irrational → synthesiser → phase noise → breaks coherence needed for 10⁻¹⁴ Doppler."}]},

{id:"gs",title:"12. Ground Stations & BWG",slides:"54–64",icon:"🏗️",
overview:"NASA DSN: 3 complexes ~120° apart (Goldstone, Madrid, Canberra). 70m, 34m, 26m antennas.\nESA ESTRACK: 35m (New Norcia, Cebreros), 15m standard.\n\nBWG antennas: feed/LNA in pedestal room (ground level). RF mirrors transport signal. Easier maintenance, more flexibility.\n\nFrequency standard (H-maser, σ_y ~ 10⁻¹⁵ at 1000 s) is the HEART of every station.\n\nSignal conversion uses mixers:\n  cos(2πft+φ)·cos(2πf₀t) → sum + difference\n  BPF selects one → coherent frequency translation\n  Phase φ PRESERVED — key for Doppler.",
equations:"Mixer:\n  cos(2πft+φ)·cos(2πf₀t)\n  = ½cos[2π(f−f₀)t+φ] + ½cos[2π(f+f₀)t+φ]\n\nH-maser: σ_y ~ 10⁻¹⁵ at 1000 s\n\nTypical specs:\n  DSN 70m X: G ≈ 74 dBi, Tsys ≈ 20 K\n  DSN 34m BWG: G ≈ 68 dBi, Tsys ≈ 25 K\n  HPA: 4–20 kW (X), 500 kW (S, 70m)",
derivation:"120° separation ensures near-continuous coverage: as Earth rotates, one station sets → next rises. For LEO: only a few 10-min passes/day → TDRSS relay satellites provide continuous coverage.\n\nMixer preserves phase: the original Doppler-carrying phase φ appears unchanged in the output. ALL LOs from same H-maser → phase coherent end-to-end.",
matlab:'<span class="cmt">% === DSN Coverage Simulation ===</span>\nstations = [<span class="num">-117</span>, <span class="num">-3.7</span>, <span class="num">149</span>];  <span class="cmt">% Goldstone, Madrid, Canberra</span>\nnames = {<span class="str">\'Goldstone\'</span>,<span class="str">\'Madrid\'</span>,<span class="str">\'Canberra\'</span>};\nomega = <span class="num">360</span>/<span class="num">24</span>;  <span class="cmt">% deg/hr</span>\nt = <span class="fn">linspace</span>(<span class="num">0</span>,<span class="num">24</span>,<span class="num">1440</span>);\nSC_RA = <span class="num">180</span>; SC_Dec = <span class="num">10</span>;\n<span class="kw">figure</span>; <span class="kw">hold</span> <span class="kw">on</span>;\n<span class="kw">for</span> s=<span class="num">1</span>:<span class="num">3</span>\n  vis = <span class="fn">zeros</span>(<span class="fn">size</span>(t));\n  <span class="kw">for</span> i=<span class="num">1</span>:<span class="fn">length</span>(t)\n    ha = <span class="fn">mod</span>(stations(s)+omega*t(i),<span class="num">360</span>)-SC_RA;\n    el = <span class="fn">asind</span>(<span class="fn">sind</span>(<span class="num">35</span>)*<span class="fn">sind</span>(SC_Dec)+<span class="fn">cosd</span>(<span class="num">35</span>)*<span class="fn">cosd</span>(SC_Dec)*<span class="fn">cosd</span>(ha));\n    vis(i) = el><span class="num">10</span>;\n  <span class="kw">end</span>\n  <span class="fn">plot</span>(t, vis*s, <span class="str">\'LineWidth\'</span>, <span class="num">3</span>);\n<span class="kw">end</span>\n<span class="fn">yticks</span>([<span class="num">1</span> <span class="num">2</span> <span class="num">3</span>]); <span class="fn">yticklabels</span>(names);\n<span class="fn">xlabel</span>(<span class="str">\'UTC [hours]\'</span>); <span class="fn">title</span>(<span class="str">\'DSN Visibility\'</span>);',
diagrams:'<div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Canberra_Deep_Space_Communication_Complex_-_GPN-2000-000502.jpg/1200px-Canberra_Deep_Space_Communication_Complex_-_GPN-2000-000502.jpg" alt="DSN Canberra" loading="lazy"><div class="img-cap">NASA DSN 70m antenna at Canberra (DSS-43). Three DSN complexes 120° apart provide near-continuous tracking of interplanetary spacecraft.</div></div><div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Goldstone_DSN_antenna.jpg/800px-Goldstone_DSN_antenna.jpg" alt="DSN Goldstone 34m BWG" loading="lazy"><div class="img-cap">DSN 34m BWG antenna DSS-25 at Goldstone. In BWG design, all electronics sit in the pedestal room at ground level — much easier maintenance than vertex-room configurations.</div></div>',
graphs:'<div class="graph-desc"><h4>DSN Coverage Windows (24h)</h4><p>Goldstone: ~06–18 UTC. Madrid: ~14–02 UTC. Canberra: ~22–10 UTC. Overlap provides handover. During critical events (orbit insertion, EDL), all three may track simultaneously.</p></div>',
traps:[{n:1,t:"Frequency standard is THE most critical element. Prof: 'What limits Doppler accuracy?' → H-maser stability."},{n:2,t:"BWG ≠ Cassegrain: in BWG, feed is at ground level, not Cassegrain focus."},{n:3,t:"Mixer preserves phase — not obvious. The original φ survives in both output terms."},{n:4,t:"Exam classic: draw and comment the full ground station block diagram from memory."}],
drill:[{q:"Draw the receiving chain of a ground station.",a:"Antenna → LNA (15K, 30dB) → Mixer 1 (×LO₁, BPF) → Mixer 2 (×LO₂, LPF) → Digital Receiver (PLL, Doppler, range, telemetry). All LOs from H-maser → phase coherent."},{q:"Why is LNA placed closest to feed?",a:"Any loss BEFORE LNA adds noise at ambient (~300K). Even 0.1 dB loss → +7K noise. In BWG, the longer path to pedestal must minimise pre-LNA loss."},{q:"H-maser stability and Doppler impact?",a:"σ_y = 10⁻¹⁵ at 1000s. Range rate floor: c×σ_y/2 = 0.15 µm/s. This IS the thermal noise floor for deep space Doppler."}]}
];

let activeSection = MODULES[0].id;
let activeTab = 0;

function render(){
 const sl=document.getElementById('sideList');
 sl.innerHTML=MODULES.map(m=>{
  const act=activeSection===m.id;
  return `<button class="sitem ${act?'active':''}" onclick="setSection('${m.id}')"><span class="sicon">${m.icon}</span><div class="stxt"><div class="st">${m.title}</div><div class="sp">${m.isNota?'Searchable':'Slides '+m.slides}</div></div></button>`;
 }).join('');
 const mod=MODULES.find(m=>m.id===activeSection);
 if(!mod)return;
 const mh=document.getElementById('modHead');
 mh.innerHTML=`<h2>${mod.icon} ${mod.title}</h2><div class="sub">${mod.isNota?'All key symbols from Chapter 3':'Slides '+mod.slides}</div>`;
 const tb=document.getElementById('tabBar');
 if(mod.isNota){tb.innerHTML='';renderNota();return;}
 tb.innerHTML=TABS.map((t,i)=>`<button class="tab-btn ${activeTab===i?'active':''}" onclick="setTab(${i})"><span>${TICONS[i]}</span>${t}</button>`).join('');
 const ca=document.getElementById('contentArea');
 if(activeTab===0)ca.innerHTML=`<div class="prose">${mod.overview}</div>`;
 else if(activeTab===1)ca.innerHTML=`<div class="eqbox">${mod.equations}</div>`;
 else if(activeTab===2)ca.innerHTML=`<div class="prose">${mod.derivation}</div>`;
 else if(activeTab===3)ca.innerHTML=`<div class="matlab-box">${mod.matlab}</div>`;
 else if(activeTab===4)ca.innerHTML=mod.diagrams||'<p style="color:var(--t3)">See other modules for diagrams on this topic, or refer to the lecture slides.</p>';
 else if(activeTab===5)ca.innerHTML=mod.graphs||'<p style="color:var(--t3)">See the linked modules for relevant graphs.</p>';
 else if(activeTab===6)ca.innerHTML=(mod.traps||[]).map(t=>`<div class="trap-card"><div class="label">Trap #${t.n}</div><p>${t.t}</p></div>`).join('')||'<p style="color:var(--t3)">No specific traps for this module.</p>';
 else if(activeTab===7)ca.innerHTML=(mod.drill||[]).map((d,i)=>`<div class="drill-card"><div class="q">Q${i+1}: ${d.q}</div><button class="drill-btn" onclick="toggleDrill(this)">Reveal answer</button><div class="drill-ans">${d.a}</div></div>`).join('')||'<p style="color:var(--t3)">No drills for this module.</p>';
}

function renderNota(){
 const ca=document.getElementById('contentArea');
 let html='<input class="search-box" id="notaSearch" placeholder="Search symbols, names, descriptions..." oninput="filterNota()">';
 html+=NOTATION.map(g=>`<div class="nota-wrap" data-cat="${g.cat}"><div class="nota-head" onclick="this.nextElementSibling.classList.toggle(\'open\')" style="color:${g.color}"><span>${g.emoji}</span> ${g.cat} <span style="margin-left:auto;font-size:10px;color:var(--t3)">▼</span></div><div class="nota-body open"><table class="nota-table"><thead><tr><th style="width:70px">Symbol</th><th style="width:160px">Name</th><th>Detail</th><th style="width:140px">Exam trap</th></tr></thead><tbody>${g.rows.map(r=>`<tr class="nota-row"><td class="sym" style="color:${g.color}">${r.s}</td><td style="font-weight:500">${r.d}</td><td style="color:var(--t2);font-size:11.5px;line-height:1.5">${r.det}</td><td style="color:${r.trap?'var(--warn)':'var(--t3)'};font-size:11px">${r.trap||'—'}</td></tr>`).join('')}</tbody></table></div></div>`).join('');
 ca.innerHTML=html;
}

function filterNota(){
 const q=document.getElementById('notaSearch').value.toLowerCase();
 document.querySelectorAll('.nota-row').forEach(r=>{
  r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
 });
}

function setSection(id){activeSection=id;activeTab=0;render();}
function setTab(i){activeTab=i;render();}
function toggleDrill(btn){const ans=btn.nextElementSibling;ans.classList.toggle('show');btn.textContent=ans.classList.contains('show')?'Hide answer':'Reveal answer';}
render();
</script>
</body>
</html>
