const T=["Overview","Equations","Derivation","MATLAB","Diagrams","Graphs","Exam Traps","Drill"],TI=["📖","📐","✏️","💻","🖼️","📊","⚠️","💪"];

{id:"ts",title:"5. Time Scales & Julian Day",sl:"67–72",icon:"📅",
ov:`Navigation is timekeeping. Historically, longitude could not be determined without a precise clock keeping Greenwich time onboard. If local noon occurs when the clock reads 15:00, the ship is 3 hours = 45° West of Greenwich.\n\nKey definitions from the slides:\n\n• Apparent Solar Day: time between two successive solar transits (~24h, varies seasonally → analemma)\n• Mean Solar Day: averaged solar day. Currently ~86400.002 SI seconds.\n• Sidereal Day: rotation period relative to stars. 23h 56m 4s. 366.25 per year vs 365.25 solar days.\n• Julian Day (JD): continuous day count from 4713 BC. JD 0 starts at noon, Mon 1 Jan 4713 BC.\n  J2000.0 = JD 2451545.0 = 1 Jan 2000, 12:00 noon.\n• Modified Julian Day: MJD = JD − 2400000.5. Starts at midnight.\n• Julian Century: exactly 36525 Julian days.\n\nLength-of-Day (LOD) variations:\n  Annual, semiannual, random and systematic components.\n  Mean solar day is getting longer (~2.3 ms/century) due to tidal deceleration.\n  Random jumps from core-mantle coupling.\n\nThe analemma (figure-8 in the sky): caused by orbital eccentricity (east-west asymmetry) + obliquity (north-south asymmetry).`,
eq:`Julian Day:\n  J2000.0 = JD 2451545.0 = 1 Jan 2000, 12:00 noon\n\nModified Julian Day:\n  MJD = JD − 2400000.5  (starts at midnight)\n  J2000.0 → MJD 51545\n\nJulian Century: 36525 Julian days exactly\n\nSidereal day:\n  T_sid = (365.25/366.25) × T_solar = 86164.0989 s\n\nTime differences (as of 1 Jan 2021):\n  TAI − UTC = 37 s (leap seconds)\n  TAI − GPS = 19 s\n  GPS − UTC = 18 s\n  TT = TAI + 32.184 s\n\nGPS epoch: 6 Jan 1980 (synchronized to UTC at that date)\nGPS does NOT use leap seconds.`,
der:`Why does TAI differ from UTC?\n\nTAI is a pure atomic scale — it counts SI seconds uniformly. The Earth's rotation is NOT uniform: it's slowing down due to tidal friction.\n\nUTC was designed to track both:\n• Atomic rate (= TAI rate) for precise timekeeping\n• Earth rotation (UT1) for astronomical/navigational needs\n\nSolution: leap seconds. When UT1 − UTC approaches ±0.9 s, a leap second is inserted into UTC (usually 30 June or 31 Dec). This keeps UTC within 0.9 s of UT1 while maintaining an atomic tick rate.\n\nSince 1972: 37 leap seconds added (all positive — Earth is slowing).\n\nGPS time chose NOT to use leap seconds → simpler for navigation but drifts from UTC. As of 2021: GPS = UTC + 18 s.\n\nTT (Terrestrial Time) = TAI + 32.184 s (historical offset from old Ephemeris Time). TT is the time scale for geocentric ephemerides.`,
mat:'<span class="c">% === Time Scale Conversions ===</span>\n\n<span class="c">% Julian Day from calendar date</span>\nyear = <span class="n">2026</span>; month = <span class="n">5</span>; day = <span class="n">12</span>;\na = <span class="f">floor</span>((<span class="n">14</span>-month)/<span class="n">12</span>);\ny = year + <span class="n">4800</span> - a;\nm = month + <span class="n">12</span>*a - <span class="n">3</span>;\nJD = day + <span class="f">floor</span>((<span class="n">153</span>*m+<span class="n">2</span>)/<span class="n">5</span>) + <span class="n">365</span>*y + <span class="f">floor</span>(y/<span class="n">4</span>) ...\n   - <span class="f">floor</span>(y/<span class="n">100</span>) + <span class="f">floor</span>(y/<span class="n">400</span>) - <span class="n">32045</span>;\nMJD = JD - <span class="n">2400000.5</span>;\n\n<span class="f">fprintf</span>(<span class="s">\'Date: %d-%02d-%02d\\n\'</span>, year, month, day);\n<span class="f">fprintf</span>(<span class="s">\'JD  = %.1f\\n\'</span>, JD);\n<span class="f">fprintf</span>(<span class="s">\'MJD = %.1f\\n\'</span>, MJD);\n\n<span class="c">% Time scale offsets (as of 2021)</span>\nTAI_UTC = <span class="n">37</span>;  <span class="c">% leap seconds</span>\nTT_TAI = <span class="n">32.184</span>;\nGPS_UTC = TAI_UTC - <span class="n">19</span>;\n<span class="f">fprintf</span>(<span class="s">\'\\nTAI-UTC = %d s\\n\'</span>, TAI_UTC);\n<span class="f">fprintf</span>(<span class="s">\'TT-TAI  = %.3f s\\n\'</span>, TT_TAI);\n<span class="f">fprintf</span>(<span class="s">\'GPS-UTC = %d s\\n\'</span>, GPS_UTC);\n\n<span class="c">% Sidereal vs solar day</span>\nT_solar = <span class="n">86400</span>;  <span class="c">% mean solar day [s]</span>\nT_sid = <span class="n">365.25</span>/<span class="n">366.25</span> * T_solar;\n<span class="f">fprintf</span>(<span class="s">\'\\nSidereal day: %.4f s = %dh %dm %.2fs\\n\'</span>, ...\n    T_sid, <span class="f">floor</span>(T_sid/<span class="n">3600</span>), <span class="f">mod</span>(<span class="f">floor</span>(T_sid/<span class="n">60</span>),<span class="n">60</span>), <span class="f">mod</span>(T_sid,<span class="n">60</span>));',
dia:'<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" class="svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Time Scale Relationships</text><rect x="30" y="50" width="90" height="40" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/><text x="75" y="74" text-anchor="middle" font-weight="600" font-size="11" fill="#6d28d9">TAI</text><text x="75" y="100" text-anchor="middle" font-size="9" fill="#5a5a55">Pure atomic</text><rect x="170" y="50" width="90" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="215" y="74" text-anchor="middle" font-weight="600" font-size="11" fill="#2563eb">TT</text><text x="215" y="100" text-anchor="middle" font-size="9" fill="#2563eb">+32.184s</text><line x1="120" y1="70" x2="168" y2="70" stroke="#2563eb" stroke-width="1.5"/><rect x="310" y="50" width="90" height="40" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="355" y="74" text-anchor="middle" font-weight="600" font-size="11" fill="#0f766e">UTC</text><text x="355" y="100" text-anchor="middle" font-size="9" fill="#0f766e">−37s (leaps)</text><line x1="120" y1="70" x2="120" y2="115" stroke="#1a1a18" stroke-dasharray="3,3"/><line x1="120" y1="115" x2="355" y2="115" stroke="#1a1a18" stroke-dasharray="3,3"/><line x1="355" y1="115" x2="355" y2="90" stroke="#0f766e"/><rect x="450" y="50" width="90" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="495" y="74" text-anchor="middle" font-weight="600" font-size="11" fill="#dc2626">GPS</text><text x="495" y="100" text-anchor="middle" font-size="9" fill="#dc2626">−19s from TAI</text><line x1="400" y1="70" x2="448" y2="70" stroke="#dc2626"/><text x="425" y="64" text-anchor="middle" font-size="9" fill="#dc2626">+18s</text><rect x="170" y="135" width="90" height="40" rx="8" fill="#fffbeb" stroke="#fbbf24"/><text x="215" y="159" text-anchor="middle" font-weight="600" font-size="11" fill="#b45309">UT1</text><text x="215" y="180" text-anchor="middle" font-size="9" fill="#b45309">Earth rotation</text><line x1="355" y1="90" x2="355" y2="130" stroke="#b45309" stroke-dasharray="4,3"/><line x1="355" y1="130" x2="262" y2="155" stroke="#b45309" stroke-dasharray="4,3"/><text x="320" y="128" font-size="9" fill="#b45309">±0.9s</text><text x="330" y="195" text-anchor="middle" font-size="10" font-weight="500" fill="#1a1a18">TAI = pure atomic · UTC = atomic + leap seconds · UT1 = astronomical · GPS = no leaps</text></svg>',
gra:'<div class="gd"><h4>Length-of-Day (LOD) Variations (Slide 72)</h4><p>X-axis: Year (1960–2020). Y-axis: Excess LOD [ms] (deviation from 86400 s). Annual oscillation ~±0.5 ms (atmospheric angular momentum). Secular trend: ~+2.3 ms/century (tidal deceleration). Random jumps: core-mantle coupling events. Negative excursions mean the Earth briefly spins faster (rare). This chart explains why leap seconds are needed irregularly.</p></div><div class="gd"><h4>The Analemma (Slide 71)</h4><p>Figure-8 traced by the Sun\'s position at the same clock time across a year. The east-west extent comes from orbital eccentricity (equation of time). The north-south extent comes from the 23.5° obliquity. The analemma shows why apparent solar time differs from mean solar time by up to ±16 minutes.</p></div>',
traps:[{n:1,t:"UTC is NOT purely atomic — it has leap seconds to track UT1. TAI is the pure atomic scale. The professor explicitly asks: 'Is UTC atomic?'"},{n:2,t:"GPS time does NOT use leap seconds. GPS = TAI − 19 s (constant since 1980). GPS − UTC changes with each leap second."},{n:3,t:"Julian Day starts at NOON, not midnight. MJD starts at midnight. The 0.5 offset in MJD = JD − 2400000.5 accounts for this."},{n:4,t:"Know the numbers: TAI−UTC = 37 s, TT = TAI + 32.184 s, GPS−UTC = 18 s, J2000.0 = JD 2451545.0."}],
drill:[{q:"What are the differences between TAI, UTC, and UT1?",a:"TAI: International Atomic Time — average of ~200 atomic clocks, counts SI seconds uniformly. UT1: astronomical time based on Earth rotation (corrected for polar motion) — non-uniform. UTC: atomic RATE (= TAI rate) but with leap seconds to stay within ±0.9 s of UT1. TAI−UTC = 37 s (as of 2021). UT1−UTC varies, published by IERS."},{q:"Why does GPS time not use leap seconds?",a:"GPS was synchronised to UTC at its epoch (6 Jan 1980). Since then, GPS has counted SI seconds uniformly (like TAI) without inserting leap seconds. This avoids discontinuities in the navigation solution. GPS − UTC changes each time a leap second is added to UTC. As of 2021: GPS = UTC + 18 s."},{q:"What is a Julian Day and why is it useful?",a:"A continuous count of days since noon, 1 Jan 4713 BC. It avoids calendar discontinuities (leap years, calendar reforms). J2000.0 = JD 2451545.0 = 1 Jan 2000, 12:00 noon. MJD = JD − 2400000.5 gives a smaller number starting at midnight. A Julian Century = 36525 days exactly."}]},

{id:"sr",title:"6. Special Relativity & Lorentz",sl:"73–82",icon:"⚡",
ov:`Special Relativity rests on one experimental fact: the speed of light is the same for ALL inertial observers. This has profound consequences:\n\n1. RELATIVITY OF SIMULTANEITY: events simultaneous for observer O occur at different times for observer O' in relative motion. The train thought experiment (slide 73): a light pulse from the centre reaches both ends simultaneously for an onboard observer, but the platform observer sees the rear-ward pulse arrive first.\n\n2. TIME DILATION: a moving clock runs slower. The Einstein clock (slide 74): light bouncing between mirrors. For the rest observer: t' = w/c. For the lab observer: ct = √(w² + (Vt)²) → t = (w/c)/√(1−V²/c²). The moving clock ticks SLOWER by the Lorentz factor γ = 1/√(1−V²/c²).\n\n3. LENGTH CONTRACTION: a moving rod appears shorter: L' = L√(1−V²/c²).\n\n4. The LORENTZ TRANSFORMATIONS replace Galilean transformations:\n  x' = (x−Vt)/√(1−V²/c²)\n  t' = (t−Vx/c²)/√(1−V²/c²)\n  y' = y, z' = z\n\n5. The SPACE-TIME INTERVAL ds² = c²dt² − dx² − dy² − dz² is INVARIANT under Lorentz transformations. All observers agree on ds².`,
eq:`Lorentz transformations (O→O'):\n  x' = γ(x − Vt)\n  t' = γ(t − Vx/c²)\n  y' = y,  z' = z\n  where γ = 1/√(1 − V²/c²)\n\nInverse (O'→O):\n  x = γ(x' + Vt')\n  t = γ(t' + Vx'/c²)\n\nTime dilation:\n  Δt' = γΔt  (moving clock ticks slower)\n\nLength contraction:\n  L' = L/γ = L√(1 − V²/c²)  (moving rod shorter)\n\nMinkowski metric:\n  η = diag(+1, −1, −1, −1)\n\nInvariant interval:\n  ds² = c²(t₂−t₁)² − (x₂−x₁)² − (y₂−y₁)² − (z₂−z₁)²\n  ds² is the SAME for all inertial observers`,
der:`Deriving Lorentz transformations from the invariance of light speed:\n\nStep 1: Light front from origin at t=0. For observer O:\n  x² + y² + z² = c²t² (sphere expanding at speed c)\n\nStep 2: For observer O' moving at V along x, the light front must ALSO be a sphere:\n  x'² + y'² + z'² = c²t'²\n\nStep 3: Try Galilean: x' = x−Vt, t' = t → (x−Vt)² + y² + z² = c²t². This gives extra terms −2Vxt + V²t² which destroy the sphere.\n\nStep 4: Allow time to transform too: t' = t + fx. The mixed term 2Vxt must cancel:\n  f = −V/c² cancels the xt cross-term.\n\nStep 5: We still get (1−V²/c²)x² + y² + z² = c²(1−V²/c²)t². Rescale by 1/√(1−V²/c²) to get a perfect sphere:\n\n  x' = (x−Vt)/√(1−V²/c²)\n  t' = (t−Vx/c²)/√(1−V²/c²)\n\nThese are the Lorentz transformations. They reduce to Galilean for V≪c.\n\nInvariance proof: substitute Lorentz transforms into ds'² = c²dt'²−dx'²−dy'²−dz'². After algebra, ds'² = ds². The space-time interval is invariant.`,
mat:'<span class="c">% === Lorentz Transformation Demo ===</span>\nc = <span class="n">3e8</span>;  <span class="c">% speed of light [m/s]</span>\n\n<span class="c">% GPS satellite velocity</span>\nV_gps = <span class="n">3874</span>;  <span class="c">% orbital speed [m/s]</span>\nbeta = V_gps/c;\ngamma = <span class="n">1</span>/<span class="f">sqrt</span>(<span class="n">1</span> - beta^<span class="n">2</span>);\n\n<span class="f">fprintf</span>(<span class="s">\'GPS satellite:\\n\'</span>);\n<span class="f">fprintf</span>(<span class="s">\'  V = %.0f m/s, β = %.2e\\n\'</span>, V_gps, beta);\n<span class="f">fprintf</span>(<span class="s">\'  γ = 1 + %.4e\\n\'</span>, gamma-<span class="n">1</span>);\n\n<span class="c">% Time dilation: how much does 1 day slow?</span>\ndt_proper = <span class="n">86400</span>;  <span class="c">% 1 day [s]</span>\ndt_coord = gamma * dt_proper;\nslowing = (dt_coord - dt_proper);\n<span class="f">fprintf</span>(<span class="s">\'  Time dilation per day: %.2f µs (SR only)\\n\'</span>, slowing*<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'  → Clock runs SLOWER by %.2f µs/day\\n\'</span>, slowing*<span class="n">1e6</span>);\n\n<span class="c">% Compare with GR effect</span>\nGM = <span class="n">3.986e14</span>; R_earth = <span class="n">6371e3</span>; R_gps = <span class="n">26560e3</span>;\nU_surface = -GM/R_earth;\nU_gps = -GM/R_gps;\ndelta_U = U_gps - U_surface;\nGR_effect = delta_U/c^<span class="n">2</span> * <span class="n">86400</span>;\n<span class="f">fprintf</span>(<span class="s">\'\\nGR effect per day: %.2f µs\\n\'</span>, GR_effect*<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'  → Clock runs FASTER by %.2f µs/day\\n\'</span>, -GR_effect*<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'\\nNet effect: %.2f µs/day\\n\'</span>, (-slowing+(-GR_effect))*<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'Position drift if uncorrected: %.1f km/day\\n\'</span>, ...\n    <span class="f">abs</span>(-slowing+(-GR_effect))*c/<span class="n">1e3</span>);',
dia:'<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" class="svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Einstein Clock — Time Dilation</text><rect x="40" y="40" width="260" height="220" rx="12" fill="#f5f3ff" stroke="#c4b5fd" opacity="0.5"/><text x="170" y="60" text-anchor="middle" font-weight="600" fill="#6d28d9">Observer O (at rest with clock)</text><line x1="170" y1="100" x2="170" y2="80" stroke="#2563eb" stroke-width="2"/><rect x="130" y="75" width="80" height="6" rx="3" fill="#2563eb"/><text x="170" y="70" text-anchor="middle" font-size="9" fill="#2563eb">Mirror</text><line x1="170" y1="220" x2="170" y2="200" stroke="#2563eb" stroke-width="2"/><rect x="130" y="220" width="80" height="6" rx="3" fill="#2563eb"/><text x="170" y="235" text-anchor="middle" font-size="9" fill="#2563eb">Mirror</text><line x1="170" y1="100" x2="170" y2="200" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/><circle cx="170" cy="150" r="4" fill="#f59e0b"/><text x="190" y="155" font-size="10" fill="#b45309">photon</text><text x="170" y="250" text-anchor="middle" font-size="11" fill="#6d28d9" font-weight="500">t\' = w/c</text><rect x="360" y="40" width="260" height="220" rx="12" fill="#fef2f2" stroke="#fca5a5" opacity="0.5"/><text x="490" y="60" text-anchor="middle" font-weight="600" fill="#dc2626">Observer O\' (sees clock moving →)</text><rect x="410" y="75" width="80" height="6" rx="3" fill="#dc2626"/><rect x="450" y="220" width="80" height="6" rx="3" fill="#dc2626"/><line x1="450" y1="81" x2="490" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/><text x="510" y="155" font-size="10" fill="#b45309">ct</text><line x1="450" y1="220" x2="450" y2="81" stroke="#1a1a18" stroke-width="0.5" stroke-dasharray="2,3"/><text x="440" y="155" text-anchor="end" font-size="9" fill="#5a5a55">w</text><line x1="450" y1="226" x2="490" y2="226" stroke="#dc2626" stroke-width="1"/><text x="470" y="240" text-anchor="middle" font-size="9" fill="#dc2626">Vt</text><text x="490" y="265" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="500">t = w/c × 1/√(1−V²/c²)</text></svg>',
gra:'<div class="gd"><h4>Time Dilation Factor γ vs Velocity</h4><p>X-axis: V/c (0 to 1). Y-axis: γ = 1/√(1−V²/c²). At V ≪ c: γ ≈ 1 (no effect). At V = 0.5c: γ = 1.155. At V = 0.9c: γ = 2.294. At V = 0.99c: γ = 7.09. For GPS (V ≈ 3.9 km/s): γ − 1 ≈ 8.4×10⁻¹¹ — tiny but measurable over a day (−7 µs/day).</p></div>',
traps:[{n:1,t:"Time dilation: the MOVING clock runs SLOWER. A GPS satellite clock appears to run slower by ~7 µs/day due to SR. Don't get the sign wrong."},{n:2,t:"The Lorentz transformation has t' = γ(t − Vx/c²). The −Vx/c² term means TIME depends on POSITION — the key feature that makes simultaneity relative."},{n:3,t:"ds² is INVARIANT — all observers agree on it. This is the foundation of relativistic physics. The metric η = diag(+1,−1,−1,−1) defines how to compute it."},{n:4,t:"Length contraction: L' = L/γ. The rod appears SHORTER in the moving frame. But the rod is NOT physically compressed — it's a measurement effect."}],
drill:[{q:"Derive time dilation from the Einstein clock.",a:"Two mirrors separated by w. Rest observer: light travel time t' = w/c. For the lab observer, the clock moves at V. Light path: ct = √(w² + V²t²). Solving: t = (w/c)/√(1−V²/c²) = γ·t'. Since t > t', the moving clock ticks slower."},{q:"Write the Lorentz transformations and their inverse.",a:"O→O': x' = γ(x−Vt), t' = γ(t−Vx/c²), y'=y, z'=z. O'→O: x = γ(x'+Vt'), t = γ(t'+Vx'/c²). Inverse is obtained by changing V→−V. γ = 1/√(1−V²/c²)."},{q:"What is the invariant interval and why is it important?",a:"ds² = c²dt² − dx² − dy² − dz². It's invariant under Lorentz transformations: ds'² = ds². While different observers disagree on time intervals and spatial distances separately, they ALL agree on ds². This quantity replaces the Euclidean distance as the fundamental 'distance' in space-time."}]},

{id:"gr",title:"7. General Relativity & Schwarzschild",sl:"83–95",icon:"🌀",
ov:`GR rests on two pillars: (1) constancy of light speed, (2) equivalence principle (laws of physics identical for all freely falling observers).\n\nThe metric becomes position-dependent — determined by Einstein's field equation. For a spherical, non-rotating mass:\n\nSchwarzschild metric:\n  ds² = (1 + 2U/c²)(cdt)² − (1 − 2U/c²)(dx² + dy² + dz²)\n  where U = −GM/r (Newtonian potential)\n\nKey result — comparing clock rates:\nFor a clock at rest in a gravitational field vs one at infinity:\n  dτ/dt = 1 + (1/c²)(U(r) − ½V²)\n\nThis means:\n• A clock DEEPER in a gravity well (larger |U|) runs SLOWER (GR effect)\n• A clock moving FASTER runs SLOWER (SR time dilation)\n\nTwo clocks at DIFFERENT altitudes but both at rest:\n  dtA/dtB ≈ 1 + (UB − UA)/c²\n  The deeper clock runs slower.\n\nFor TAI: all ~200 clocks are corrected to the geoid. On the rotating geoid:\n  Φ₀/c² = GM/(a₁c²) − GMJ₂/(2a₁c²) − ω²a₁²/(2c²) = −6.96927×10⁻¹⁰\n\nGPS relativistic correction:\n  SR: satellite clock runs SLOWER by ~7 µs/day (velocity effect)\n  GR: satellite clock runs FASTER by ~45 µs/day (weaker gravity at altitude)\n  NET: +38 µs/day faster → corrected by pre-adjusting frequency\n  10.23 MHz → 10.22999999543 MHz (lowered by 4.57×10⁻³ Hz)\n\nEccentricity correction: Δtr = 2r·v/c² (periodic, up to ~23 ns for e=0.01)`,
eq:`Schwarzschild metric:\n  ds² = (1+2U/c²)(cdt)² − (1−2U/c²)(dx²+dy²+dz²)\n  U = −GM/r\n\nProper time vs coordinate time:\n  dτ/dt = 1 + (1/c²)(U − V²/2)\n\nTwo clocks at different altitudes (at rest):\n  dtA/dtB ≈ 1 + (UB−UA)/c²\n\nRotating geoid:\n  (cdτ)² = (1 + 2U/c² − ω²r²sin²θ/c²)(cdt)²\n  Φ₀/c² = −6.96927×10⁻¹⁰\n\nGPS relativistic effects per day:\n  SR (velocity): −7.2 µs (clock slower)\n  GR (gravity):  +45.8 µs (clock faster)\n  NET:           +38.6 µs/day\n  → Position drift if uncorrected: ~11.6 km/day\n\nFrequency pre-adjustment:\n  f_nominal = 10.23 MHz\n  f_adjusted = 10.22999999543 MHz\n  Δf/f = −4.465×10⁻¹⁰\n\nEccentricity correction:\n  Δtr = 2r·v/c²\n  Max ~23 ns for e = 0.01 → ~7 m`,
der:`Deriving the clock rate difference from Schwarzschild metric:\n\nStep 1: For a freely falling observer (e.g. GPS satellite), the proper time τ is measured by their onboard clock. Between two ticks, the space coordinates change (the satellite moves!) but for the satellite observer, the clock is at rest → ds² = (cdτ)².\n\nStep 2: For an observer at infinity (coordinate time t):\n  (cdτ)² = (1+2U/c²)(cdt)² − (1−2U/c²)(dx²+dy²+dz²)\n\nStep 3: Divide by (cdt)²:\n  (dτ/dt)² = (1+2U/c²) − (1−2U/c²)(V/c)²\n\nStep 4: Linearise (U/c² ≪ 1, V/c ≪ 1):\n  dτ/dt ≈ 1 + U/c² − V²/(2c²)\n\nStep 5: For GPS satellite vs ground clock:\n  SR: −V²/(2c²) ≈ −(3874)²/(2×9×10¹⁶) ≈ −8.3×10⁻¹¹ per tick → −7.2 µs/day\n  GR: (U_GPS − U_surface)/c² = (−GM/R_GPS + GM/R_earth)/c²\n    = GM(1/R_earth − 1/R_GPS)/c² ≈ +5.3×10⁻¹⁰ per tick → +45.8 µs/day\n  NET: +38.6 µs/day → clock runs FASTER\n\nStep 6: Pre-adjust frequency down by 38.6 µs / 86400 s = 4.465×10⁻¹⁰ fractional:\n  f = 10.23 MHz × (1 − 4.465×10⁻¹⁰) = 10.22999999543 MHz`,
mat:'<span class="c">% === GPS Relativistic Corrections ===</span>\nc = <span class="n">3e8</span>; GM = <span class="n">3.986e14</span>;\nR_e = <span class="n">6371e3</span>; R_gps = <span class="n">26560e3</span>;\n\n<span class="c">% Orbital velocity (circular orbit)</span>\nV_gps = <span class="f">sqrt</span>(GM/R_gps);\n<span class="f">fprintf</span>(<span class="s">\'GPS orbital velocity: %.0f m/s\\n\'</span>, V_gps);\n\n<span class="c">% SR effect (time dilation — clock SLOWER)</span>\nSR = -V_gps^<span class="n">2</span> / (<span class="n">2</span>*c^<span class="n">2</span>) * <span class="n">86400</span>;\n<span class="f">fprintf</span>(<span class="s">\'SR effect: %+.2f µs/day (slower)\\n\'</span>, SR*<span class="n">1e6</span>);\n\n<span class="c">% GR effect (gravitational — clock FASTER at altitude)</span>\nGR = GM * (<span class="n">1</span>/R_e - <span class="n">1</span>/R_gps) / c^<span class="n">2</span> * <span class="n">86400</span>;\n<span class="f">fprintf</span>(<span class="s">\'GR effect: %+.2f µs/day (faster)\\n\'</span>, GR*<span class="n">1e6</span>);\n\n<span class="c">% Net effect</span>\nnet = SR + GR;\n<span class="f">fprintf</span>(<span class="s">\'NET:       %+.2f µs/day\\n\'</span>, net*<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'Position drift: %.1f km/day\\n\\n\'</span>, <span class="f">abs</span>(net)*c/<span class="n">1e3</span>);\n\n<span class="c">% Frequency pre-adjustment</span>\nf_nom = <span class="n">10.23e6</span>;  <span class="c">% nominal [Hz]</span>\ndf_f = net / <span class="n">86400</span>;  <span class="c">% fractional correction</span>\nf_adj = f_nom * (<span class="n">1</span> + df_f);  <span class="c">% lower frequency</span>\n<span class="f">fprintf</span>(<span class="s">\'Frequency adjustment:\\n\'</span>);\n<span class="f">fprintf</span>(<span class="s">\'  f_nominal  = %.6f MHz\\n\'</span>, f_nom/<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'  f_adjusted = %.14f MHz\\n\'</span>, f_adj/<span class="n">1e6</span>);\n<span class="f">fprintf</span>(<span class="s">\'  Δf/f = %.3e\\n\'</span>, df_f);\n\n<span class="c">% Eccentricity correction</span>\ne = <span class="n">0.01</span>;  <span class="c">% typical GPS eccentricity</span>\na = R_gps;\ndt_ecc = <span class="n">2</span>*a*V_gps*e / c^<span class="n">2</span>;\n<span class="f">fprintf</span>(<span class="s">\'\\nEccentricity correction (e=%.2f): %.1f ns → %.1f m\\n\'</span>, ...\n    e, dt_ecc*<span class="n">1e9</span>, dt_ecc*c);',
dia:'<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" class="svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">GPS Relativistic Clock Corrections</text><rect x="30" y="50" width="280" height="90" rx="12" fill="#fef2f2" stroke="#fca5a5"/><text x="170" y="72" text-anchor="middle" font-weight="600" font-size="12" fill="#dc2626">Special Relativity (Velocity)</text><text x="170" y="92" text-anchor="middle" font-size="11">V = 3874 m/s → −V²/(2c²)</text><text x="170" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">−7.2 µs/day</text><text x="170" y="128" text-anchor="middle" font-size="10" fill="#dc2626">Clock runs SLOWER</text><rect x="350" y="50" width="280" height="90" rx="12" fill="#ecfdf5" stroke="#86efac"/><text x="490" y="72" text-anchor="middle" font-weight="600" font-size="12" fill="#0f766e">General Relativity (Gravity)</text><text x="490" y="92" text-anchor="middle" font-size="11">R = 26560 km → ΔU/c²</text><text x="490" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">+45.8 µs/day</text><text x="490" y="128" text-anchor="middle" font-size="10" fill="#0f766e">Clock runs FASTER</text><line x1="310" y1="160" x2="310" y2="175" stroke="#1a1a18" stroke-width="2"/><line x1="350" y1="160" x2="350" y2="175" stroke="#1a1a18" stroke-width="2"/><rect x="180" y="175" width="300" height="50" rx="12" fill="#6d28d9"/><text x="330" y="198" text-anchor="middle" font-weight="600" font-size="14" fill="#fff">NET: +38.6 µs/day → 11.6 km/day drift</text><text x="330" y="215" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)">GR dominates: satellite clock runs FASTER</text><rect x="130" y="240" width="400" height="30" rx="8" fill="#fffbeb" stroke="#fbbf24"/><text x="330" y="260" text-anchor="middle" font-size="11" font-weight="500" fill="#b45309">Corrected by: f = 10.22999999543 MHz (pre-adjusted down)</text></svg>\n<div class="imf"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/ConstellationGPS.gif/800px-ConstellationGPS.gif" alt="GPS constellation" loading="lazy"><div class="imc">GPS constellation of 24+ satellites in 6 orbital planes at ~20200 km altitude. Each satellite carries atomic clocks pre-adjusted for relativistic effects. Without this correction, positioning would drift ~11.6 km/day.</div></div>',
gra:'<div class="gd"><h4>GPS Clock Correction: SR vs GR Contributions</h4><p>Bar chart: SR (velocity) = −7.2 µs/day (downward, clock slower). GR (gravity) = +45.8 µs/day (upward, clock faster). Net = +38.6 µs/day. GR dominates because the gravitational potential difference between GPS altitude and ground is large. If uncorrected: 38.6 µs/day × c = 11.6 km/day positioning error. This is THE classic GPS relativity exam question — know both numbers and their signs.</p></div><div class="gd"><h4>Clock Rate vs Altitude</h4><p>Below ~3200 km altitude: SR dominates (satellite moves fast) → clock slower than ground. Above ~3200 km: GR dominates (weaker gravity) → clock faster. GPS at 20200 km is well above the crossover → net faster. At exactly ~3200 km: the two effects cancel and the satellite clock matches the ground clock.</p></div>',
traps:[{n:1,t:"CLASSIC EXAM: GPS relativity — know SR (−7 µs), GR (+45 µs), net (+38 µs/day → ~10 km/day if uncorrected)."},{n:2,t:"GR makes clocks run FASTER at altitude (weaker gravity). SR makes moving clocks run SLOWER. Students often get the signs confused."},{n:3,t:"The pre-adjustment lowers the frequency from 10.23 MHz to 10.22999999543 MHz. The clock is intentionally slowed on the ground so it matches the ground rate when in orbit."},{n:4,t:"The eccentricity correction Δtr = 2r·v/c² is PERIODIC (not constant). It must be computed in real-time from satellite ephemeris. For e=0.01: up to ~7 m error."}],
drill:[{q:"What are the SR and GR contributions to GPS clock drift? Which dominates?",a:"SR: moving clock runs slower → −7.2 µs/day. GR: higher altitude = weaker gravity → clock faster → +45.8 µs/day. NET: +38.6 µs/day. GR dominates by a factor of ~6. If uncorrected: position drift of ~11.6 km/day."},{q:"How is the GPS clock pre-adjusted for relativity?",a:"The onboard oscillator frequency is lowered from 10.23000000000 MHz to 10.22999999543 MHz before launch. This fractional adjustment of −4.465×10⁻¹⁰ exactly compensates the net +38.6 µs/day relativistic drift. In orbit, the clock ticks at effectively 10.23 MHz relative to ground clocks."},{q:"Write the Schwarzschild metric and explain each term.",a:"ds² = (1+2U/c²)(cdt)² − (1−2U/c²)(dx²+dy²+dz²), U = −GM/r. The first term (1+2U/c²) modifies time intervals — clocks deep in gravity (U more negative) have smaller time intervals (run slower). The second term (1−2U/c²) modifies spatial distances — rulers near massive bodies are slightly contracted. For U = 0 (no gravity): reduces to Minkowski metric."}]},

{id:"gnss",title:"8. GPS/GNSS Triangulation",sl:"102–112",icon:"📍",
ov:`GPS positioning is based on trilateration (not triangulation — we measure distances, not angles).\n\nBasic principle with synchronised clocks:\n• Each satellite broadcasts its position (ephemeris) and a time-tagged signal\n• User measures reception time → computes range ρᵢ = c(t_rx − t_tx)\n• With 3 satellites → 3 equations → solve for x, y, z\n\nReality: user clock is NOT synchronised. Clock bias δt is a 4th unknown.\n  c²(t_tr − t_ri − δt)² = (x−xᵢ)² + (y−yᵢ)² + (z−zᵢ)² = ρᵢ²\n\n→ Need minimum 4 satellites to solve for (x, y, z, δt).\n\nWith >4 satellites: use least-squares or Kalman filter for better accuracy.\n\nThree GPS segments:\n1. Space segment: 24+ satellites in 6 orbital planes, ~20200 km altitude, 12h period. Each carries atomic clocks (Rb/Cs).\n2. Control segment: master control station + 16 monitoring sites + 11 command antennas. Tracks satellites, computes ephemerides and clock offsets, uploads to spacecraft.\n3. User segment: GPS receivers that track signals and compute position/velocity.\n\nGPS observables:\n• Pseudorange: from PRN code correlation (~meter accuracy)\n• Carrier phase: accumulated phase (~mm precision, ambiguous by Nλ)\n• Doppler: frequency shift → velocity\n• C/N₀: signal quality metric`,
eq:`Pseudorange equations (4 satellites):\n  c²(t_tr − t_r1 − δt)² = (x−x₁)² + (y−y₁)² + (z−z₁)²\n  c²(t_tr − t_r2 − δt)² = (x−x₂)² + (y−y₂)² + (z−z₂)²\n  c²(t_tr − t_r3 − δt)² = (x−x₃)² + (y−y₃)² + (z−z₃)²\n  c²(t_tr − t_r4 − δt)² = (x−x₄)² + (y−y₄)² + (z−z₄)²\n\n4 unknowns: x, y, z (position) + δt (clock bias)\n\nPseudorange observable (expanded):\n  ρ̃ = ρ + c(δtR − δtT) + δρ_trop + δρ_ion + ε\n\nGPS frequencies:\n  L1: 1575.42 MHz, L2: 1227.60 MHz\n  Carrier wavelength: λ₁ ≈ 19 cm, λ₂ ≈ 24 cm\n\nPRN codes:\n  C/A: 1.023 Mcps, 1 ms repetition\n  P: 10.23 Mcps, 1 week repetition`,
der:`Why 4 satellites, not 3?\n\nWith 3 satellites and perfectly synchronised clocks:\n  ρᵢ = c(t_rx − t_txᵢ) = √[(x−xᵢ)² + (y−yᵢ)² + (z−zᵢ)²]\nThree equations, three unknowns (x,y,z) → solvable.\n\nBut the user clock has unknown offset δt from GPS time:\n  Measured time: t_rx + δt (biased)\n  Measured range: ρ̃ᵢ = c(t_tr − t_ri − δt) = ρᵢ − cδt\n\nThis introduces a 4th unknown. With only 3 satellites, the system is under-determined. A 4th satellite provides the 4th equation needed.\n\nGeometrically: each satellite defines a sphere of possible positions. With 3 spheres → 2 intersection points (one usually discarded by Earth proximity). With clock bias → spheres have wrong radii → need 4th sphere to solve for the bias.\n\nWith N > 4 satellites: over-determined → least-squares or KF improves accuracy. DOP (Dilution of Precision) measures geometric quality of satellite configuration.\n\nWhy good clocks onboard? A 1 ns clock error → 30 cm range error (c×10⁻⁹ = 0.3 m). GPS requires ~10 ns clock accuracy → 3 m. This is why atomic clocks are essential on GPS satellites.`,
mat:'<span class="c">% === GPS Positioning: 4-Satellite Trilateration ===</span>\nc = <span class="n">3e8</span>;\n\n<span class="c">% Satellite positions [m] (WGS84 ECEF)</span>\nxs = [<span class="n">15600e3</span>, <span class="n">18760e3</span>, <span class="n">17610e3</span>, <span class="n">19170e3</span>;\n      <span class="n">7540e3</span>, <span class="n">2750e3</span>, <span class="n">14630e3</span>, <span class="n">610e3</span>;\n      <span class="n">20140e3</span>, <span class="n">18610e3</span>, <span class="n">13480e3</span>, <span class="n">18390e3</span>];\n\n<span class="c">% True user position (Rome, approx)</span>\nx_true = [<span class="n">4642e3</span>; <span class="n">1028e3</span>; <span class="n">4236e3</span>];\ndt_true = <span class="n">100e-9</span>;  <span class="c">% 100 ns clock bias</span>\n\n<span class="c">% Generate pseudoranges</span>\nrho = <span class="f">zeros</span>(<span class="n">4</span>,<span class="n">1</span>);\n<span class="k">for</span> i = <span class="n">1</span>:<span class="n">4</span>\n    rho(i) = <span class="f">norm</span>(x_true - xs(:,i)) + c*dt_true;\n<span class="k">end</span>\n<span class="f">fprintf</span>(<span class="s">\'Pseudoranges [km]: %.1f %.1f %.1f %.1f\\n\'</span>, rho/<span class="n">1e3</span>);\n\n<span class="c">% Iterative least-squares solution</span>\nx_est = [<span class="n">0</span>;<span class="n">0</span>;<span class="n">0</span>;<span class="n">0</span>];  <span class="c">% initial guess [x,y,z,cdt]</span>\n<span class="k">for</span> iter = <span class="n">1</span>:<span class="n">10</span>\n    H = <span class="f">zeros</span>(<span class="n">4</span>,<span class="n">4</span>); dy = <span class="f">zeros</span>(<span class="n">4</span>,<span class="n">1</span>);\n    <span class="k">for</span> i = <span class="n">1</span>:<span class="n">4</span>\n        dx = x_est(<span class="n">1</span>:<span class="n">3</span>) - xs(:,i);\n        r = <span class="f">norm</span>(dx);\n        H(i,:) = [dx\'/r, <span class="n">1</span>];  <span class="c">% Jacobian row</span>\n        dy(i) = rho(i) - r - x_est(<span class="n">4</span>);  <span class="c">% residual</span>\n    <span class="k">end</span>\n    x_est = x_est + H\\dy;  <span class="c">% LS update</span>\n<span class="k">end</span>\n<span class="f">fprintf</span>(<span class="s">\'Solved position [km]: %.3f %.3f %.3f\\n\'</span>, x_est(<span class="n">1</span>:<span class="n">3</span>)/<span class="n">1e3</span>);\n<span class="f">fprintf</span>(<span class="s">\'Clock bias: %.1f ns\\n\'</span>, x_est(<span class="n">4</span>)/c*<span class="n">1e9</span>);',
dia:'<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="svg"><defs><marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6d28d9"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">GPS Three-Segment Architecture</text><rect x="30" y="45" width="180" height="85" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="120" y="65" text-anchor="middle" font-weight="600" font-size="11" fill="#2563eb">SPACE SEGMENT</text><text x="120" y="82" text-anchor="middle" font-size="9">24+ satellites, 6 planes</text><text x="120" y="95" text-anchor="middle" font-size="9">~20200 km, 12h period</text><text x="120" y="108" text-anchor="middle" font-size="9" fill="#2563eb">Rb/Cs atomic clocks</text><text x="120" y="121" text-anchor="middle" font-size="9">PRN ranging codes + nav msg</text><rect x="240" y="45" width="180" height="85" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="330" y="65" text-anchor="middle" font-weight="600" font-size="11" fill="#0f766e">CONTROL SEGMENT</text><text x="330" y="82" text-anchor="middle" font-size="9">Master control station</text><text x="330" y="95" text-anchor="middle" font-size="9">16 monitoring sites</text><text x="330" y="108" text-anchor="middle" font-size="9" fill="#0f766e">11 command antennas</text><text x="330" y="121" text-anchor="middle" font-size="9">KF → orbits + clock offsets</text><rect x="450" y="45" width="180" height="85" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="540" y="65" text-anchor="middle" font-weight="600" font-size="11" fill="#6d28d9">USER SEGMENT</text><text x="540" y="82" text-anchor="middle" font-size="9">GPS receivers</text><text x="540" y="95" text-anchor="middle" font-size="9">Low-cost quartz clocks</text><text x="540" y="108" text-anchor="middle" font-size="9" fill="#6d28d9">Solve for x,y,z,δt</text><text x="540" y="121" text-anchor="middle" font-size="9">Need ≥4 satellites</text><line x1="120" y1="130" x2="120" y2="155" stroke="#2563eb" marker-end="url(#a1)"/><line x1="330" y1="130" x2="330" y2="155" stroke="#0f766e" marker-end="url(#a1)"/><line x1="540" y1="130" x2="540" y2="155" stroke="#6d28d9" marker-end="url(#a1)"/><rect x="30" y="157" width="600" height="55" rx="10" fill="#fafaf8" stroke="#d8d6d0"/><text x="50" y="178" font-weight="600" font-size="11" fill="#6d28d9">GPS Observables:</text><text x="50" y="195" font-size="10">• Pseudorange (C/A code: ~m) · Carrier phase (~mm, ambiguous) · Doppler (velocity) · C/N₀ (quality)</text><text x="330" y="240" text-anchor="middle" font-size="11" font-weight="500">c²(t_tr − t_ri − δt)² = (x−xᵢ)² + (y−yᵢ)² + (z−zᵢ)² → 4 unknowns: x, y, z, δt</text></svg>\n<div class="imf"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/GPS_Block_IIIA.jpg/800px-GPS_Block_IIIA.jpg" alt="GPS Block III satellite" loading="lazy"><div class="imc">GPS Block III satellite. Carries rubidium atomic clocks with frequency pre-adjusted for relativistic effects. Transmits L1/L2 signals with PRN ranging codes and 50 bps navigation message containing ephemerides and clock corrections.</div></div>',
gra:'<div class="gd"><h4>Clock Error → Position Error</h4><p>Linear relationship: Δρ = c × Δt. A 1 ns error = 0.3 m. A 1 µs error = 300 m. A 1 ms error = 300 km. GPS requires clock errors < ~30 ns for 10 m positioning. This is why atomic clocks are on the satellites and why clock corrections are broadcast in the navigation message. The user clock (quartz, ~µs accuracy) is NOT good enough — its bias is solved as the 4th unknown.</p></div>',
traps:[{n:1,t:"Need 4 satellites, not 3. The 4th solves for the user clock bias δt. With >4 satellites, use least-squares (this connects to Chapter 4 of TSB!)."},{n:2,t:"1 ns clock error = 30 cm position error. 1 µs = 300 m. Know this scale for the exam."},{n:3,t:"GPS uses pseudoranges (ρ̃), not true ranges. The 'pseudo' comes from the unknown clock bias: ρ̃ = ρ + cδt + errors."},{n:4,t:"The control segment uses a Kalman Filter to determine satellite orbits and clock offsets — direct connection to your OD course material."}],
drill:[{q:"Why does GPS need 4 satellites instead of 3?",a:"3 satellites give 3 equations for 3 unknowns (x,y,z) — but ONLY if the user clock is perfectly synchronised to GPS time. Since the user clock has unknown bias δt, there are 4 unknowns (x,y,z,δt) → need 4 equations → 4 satellites."},{q:"Why must GPS satellites carry good atomic clocks? Why not just use quartz?",a:"A 1 µs clock error = 300 m position error (c×10⁻⁶). GPS requires ~10 ns accuracy → 3 m. Quartz clocks drift ~1 µs/day — unacceptable without constant correction. Atomic clocks (Rb/Cs) maintain ~10 ns/day stability. Also, good onboard clocks allow autonomy: the satellite can still provide positioning even if ground updates are temporarily unavailable."},{q:"What observables does a GPS receiver measure?",a:"1) Pseudorange: from C/A or P-code correlation — measures propagation delay plus clock bias (~meter accuracy). 2) Carrier phase: accumulated phase of L1/L2 carrier (~mm precision but ambiguous by Nλ). 3) Doppler: frequency shift → velocity. 4) C/N₀: carrier-to-noise spectral density — signal quality metric."}]},

{id:"exam",title:"📝 Final Exam Questions",sl:"All",icon:"📝",isExam:true}
];

const EQ=[
{tag:"hot",q:"GPS relativity: SR vs GR contributions and net effect. What happens if uncorrected? How is it corrected?",a:"SR (velocity): GPS at 3874 m/s → clock runs SLOWER by −7.2 µs/day. GR (gravity): GPS at 26560 km altitude → weaker gravity → clock runs FASTER by +45.8 µs/day. NET: +38.6 µs/day faster. If uncorrected: 38.6 µs/day × c = 11.6 km/day positioning drift. Corrected by pre-adjusting the onboard oscillator from 10.23 MHz to 10.22999999543 MHz (lowered by Δf/f = −4.465×10⁻¹⁰). Residual eccentricity correction: Δtr = 2r·v/c² (computed in real-time)."},
{tag:"hot",q:"Lorentz transformations. What is the metric? How does GR change it?",a:"Lorentz: x' = γ(x−Vt), t' = γ(t−Vx/c²), γ = 1/√(1−V²/c²). Minkowski metric: η = diag(1,−1,−1,−1) → ds² = c²dt²−dx²−dy²−dz². This ds² is INVARIANT under Lorentz transformations. In GR: the metric g_ik is determined by Einstein's field equation. For a spherical mass (Schwarzschild): ds² = (1+2U/c²)(cdt)²−(1−2U/c²)(dx²+dy²+dz²). The metric now depends on the gravitational potential U = −GM/r → space-time is curved by mass."},
{tag:"hot",q:"GNSS triangulation equations. Why are synchronised clocks needed? How is synchronisation done?",a:"Pseudorange: c²(t_tr−t_ri−δt)² = (x−xi)²+(y−yi)²+(z−zi)². Need 4 satellites for 4 unknowns (x,y,z,δt). Clocks must be synchronised because range = c×Δt → 1 ns error = 30 cm. Onboard: atomic clocks (Rb/Cs) with frequency pre-adjusted for relativity. Ground control continuously monitors clock offsets via tracking stations with H-masers, uploads corrections in the nav message. User clock offset is solved as 4th unknown."},
{tag:"hot",q:"Difference UT0, UT1, UTC, TAI. Is UTC atomic?",a:"TAI: pure atomic (average of ~200 clocks). UT0: rotational time at specific station. UT1: UT0 corrected for polar motion (best Earth rotation measure). UTC: atomic RATE (= TAI) but with leap seconds to stay within ±0.9 s of UT1. Is UTC atomic? PARTIALLY — its tick rate is atomic (SI seconds), but its epoch is adjusted to match Earth rotation via leap seconds. So it's a HYBRID: atomic rate with astronomical corrections. TAI−UTC = 37 s (2021). TT = TAI + 32.184 s."},
{tag:"hot",q:"Relativity of simultaneity. Explain with an example.",a:"Events simultaneous for one observer occur at different times for another in relative motion. Train experiment: a light pulse from the centre of a moving carriage reaches both ends simultaneously for the onboard observer. But for the platform observer, the rear-ward pulse arrives FIRST because the carriage moves toward it. This is NOT an illusion — it's a fundamental consequence of the invariance of c. The Lorentz transformation: t' = γ(t−Vx/c²) shows time depends on POSITION → simultaneity is relative."},
{tag:"hot",q:"General clock structure, then questions about resonator feedback: conditions for stability, what facilitates feedback.",a:"Clock = Oscillator + High-Q Resonator + Feedback. The resonator provides a precise frequency reference (e.g. Cs hyperfine at 9.192 GHz, Q~10⁸–10¹⁰). Feedback loop: compares oscillator output with resonator response → generates error signal → corrects oscillator. Stability conditions: (1) high Q → narrow resonance → strong error signal, (2) low coupling to environment → minimal perturbations, (3) feedback bandwidth must match signal dynamics. What facilitates feedback: HIGH Q. Because Δf = f₀/Q is narrow, even tiny deviations produce large amplitude changes → effective correction."},
{tag:"med",q:"GPS functioning and why you need a good onboard clock. How are clocks synchronised? If a clock is unstable, what's the problem?",a:"GPS: 24+ satellites broadcast ephemerides and time-tagged signals. Receiver measures pseudoranges to ≥4 satellites → solves for position + clock bias. Good onboard clock needed because: 1 ns error → 30 cm range error. Synchronisation: ground control segment tracks satellite clocks using H-masers, computes offsets via KF, uploads corrections. If clock unstable: (1) navigation message clock polynomial becomes inaccurate between updates, (2) autonomous operation degrades, (3) pseudorange errors grow → positioning accuracy degrades."},
{tag:"med",q:"Kinematic vs dynamic definition of reference system. Body-fixed frames: what are they, mean axis.",a:"Kinematic: fixed to observed objects (ICRF → quasars via VLBI). No dynamics needed. Robust, accessible. Dynamic: defined from equations of motion (require Coriolis = 0 in the frame). Depends on force model quality. Body-fixed: rotate with the Earth (ECEF). Z-axis should be Earth's angular velocity vector but polar motion causes it to wander (~0.4\", 430-day period). 'Mean' axis: averaged over time to remove polar motion. This gives a stable reference; instantaneous deviations are described by Earth Orientation Parameters."},
{tag:"med",q:"What is the Schwarzschild metric? Derive clock rate difference at different altitudes.",a:"ds² = (1+2U/c²)(cdt)² − (1−2U/c²)(dx²+dy²+dz²), U = −GM/r. For two clocks A (low) and B (high) at rest: (1+2UA/c²)(cdtA)² = (1+2UB/c²)(cdtB)² → dtA/dtB ≈ 1 + (UB−UA)/c². Since UA < UB (A deeper in gravity well → more negative U), dtA/dtB < 1 → clock A runs SLOWER. For TAI: all clocks corrected to geoid potential Φ₀/c² = −6.969×10⁻¹⁰."},
{tag:"low",q:"What is proper time vs coordinate time? TDB vs TCB.",a:"Proper time τ: measured by clock moving with the observer — independent of path/gravity. Coordinate time t: the time variable in equations of motion — depends on the chosen frame. Relation: dτ/dt = 1 + (U−V²/2)/c². TCB (Barycentric Coordinate Time): K=1 → large secular drift from TT (~1.55×10⁻⁸ per second). TDB (Barycentric Dynamical Time): K chosen so average drift is zero → only periodic variations from TT (largest: 1.658 ms annual). TDB is used in JPL ephemerides and nearly all navigation codes."}
];

let aS=M[0].id,aT=0;
function R(){
 document.getElementById('sL').innerHTML=M.map(m=>`<button class="sitem ${aS===m.id?'active':''}" onclick="S('${m.id}')"><span class="sicon">${m.icon}</span><div class="stxt"><div class="st">${m.title}</div><div class="sp">${m.isExam?'Past papers':'Slides '+m.sl}</div></div></button>`).join('');
 const m=M.find(x=>x.id===aS);if(!m)return;
 document.getElementById('mH').innerHTML=`<h2>${m.icon} ${m.title}</h2><div class="sub">${m.isExam?'Prof. Iess — all chapters':'Slides '+m.sl}</div>`;
 const tb=document.getElementById('tB'),ca=document.getElementById('cA');
 if(m.isExam){tb.innerHTML='';ca.innerHTML=`<div style="margin-bottom:16px"><h3 style="font-family:var(--serif);font-size:16px;margin-bottom:4px">Prof. Iess — Ch4 Final Exam Questions</h3><p style="font-size:12px;color:var(--t2)">Click to reveal model answer. <span class="et hot">HOT</span> = very frequent.</p></div>`+EQ.map(e=>`<div class="eq" onclick="this.classList.toggle('open')"><span class="et ${e.tag}">${e.tag.toUpperCase()}</span><span class="qt">${e.q}</span><div class="qa">${e.a}</div></div>`).join('');return;}
 tb.innerHTML=T.map((t,i)=>`<button class="tab-btn ${aT===i?'active':''}" onclick="P(${i})"><span>${TI[i]}</span>${t}</button>`).join('');
 if(aT===0)ca.innerHTML=`<div class="prose">${m.ov}</div>`;
 else if(aT===1)ca.innerHTML=`<div class="eqbox">${m.eq}</div>`;
 else if(aT===2)ca.innerHTML=`<div class="prose">${m.der}</div>`;
 else if(aT===3)ca.innerHTML=`<div class="mb">${m.mat}</div>`;
 else if(aT===4)ca.innerHTML=m.dia||'<p style="color:var(--t3)">See lecture slides.</p>';
 else if(aT===5)ca.innerHTML=m.gra||'';
 else if(aT===6)ca.innerHTML=(m.traps||[]).map(t=>`<div class="tc"><div class="lb">Trap #${t.n}</div><p>${t.t}</p></div>`).join('');

}
function S(id){aS=id;aT=0;R();}

function F(b){const a=b.nextElementSibling;a.classList.toggle('show');b.textContent=a.classList.contains('show')?'Hide':'Reveal answer';}
R();
