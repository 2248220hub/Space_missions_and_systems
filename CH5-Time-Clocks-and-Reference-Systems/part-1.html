{id:"ref",title:"1. Reference Systems & Frames",slides:"1–7",icon:"🌍",
overview:`Precise space navigation requires precise definitions of time scales and reference frames. Einstein showed time and space are intimately related, but in this course we adopt a Newtonian view.\n\nKey distinction:\n• Reference System: a set of prescriptions, conventions, and models defining at any time a triad of axes and coordinates. It's abstract/mathematical.\n• Reference Frame: a set of physical points with precisely determined coordinates — a REALIZATION of the system.\n\nTwo main classes:\n1. Inertial frames (non-rotating, origin at SSB or geocenter)\n2. Body-fixed frames (rotating with the Earth)\n\nThe equatorial system uses:\n• X,Y,Z: non-rotating axes (X toward vernal equinox, Z toward North Pole)\n• x,y,z: body-fixed axes (rotating with Earth)\n\nThe J2000 system (ECI): equinox and mean equator at epoch 2000.0 (1 Jan 2000, 12:00 noon). ECEF: Earth-Centered Earth-Fixed.\n\nTransformation: ECI to ECEF requires 4 rotations:\n  [ECEF] = W · S' · N · P · [ECI_J2000]\nwhere P = precession, N = nutation, S' = sidereal rotation, W = polar motion.\n\nThe similarity transform between two TRS:\n  X₂ = T₁₂ + λ₁₂ · R₁₂ · X₁`,
equations:`Reference frame transformation:\n  X₂ = T₁₂ + λ₁₂ · R₁₂ · X₁\n  T = translation, λ = scale factor, R = rotation\n\nECI → ECEF:\n  [ECEF] = W · S' · N · P · [ECI_J2000]\n  P: precession (epoch → date)\n  N: nutation (at current time)\n  S': Earth rotation (sidereal time)\n  W: polar motion (align to ECEF axes)\n\nObliquity of ecliptic: ε ≈ 23.5°\nGreenwich Mean Sidereal Time: αG\n\nRA, DEC coordinates:\n  HA = LST − α  (Hour Angle = Local Sidereal Time − Right Ascension)\n\nSidereal day: 23h 56m 4s\nSolar day: 24h 0m 0s (average)\n1 year = 365.25 solar days = 366.25 sidereal days`,
derivation:`Why two more sidereal days than solar days per year?\n\nAs the Earth orbits the Sun, it completes one extra rotation relative to the stars. After one year:\n• Earth has rotated 366.25 times relative to the stars (sidereal)\n• But only 365.25 times relative to the Sun (solar)\n\nThe extra rotation comes from the orbital revolution itself.\n\nSidereal day = 365.25/366.25 × solar day = 23h 56m 4.09s\n\nHour Angle derivation:\n  HA = angle from observer's meridian to star's meridian (westward)\n  LST = angle from observer's meridian to vernal equinox (westward)\n  α = angle from vernal equinox to star's meridian (eastward)\n  → HA = LST − α\n\nNote: α (right ascension) is measured EASTWARD, while HA is measured WESTWARD. The sign convention is critical.`,
matlab:'<span class="cmt">% === ECI to ECEF Transformation ===</span>\n<span class="cmt">% Simplified rotation (sidereal time only)</span>\n\n<span class="cmt">% Current Greenwich Mean Sidereal Time</span>\nJD = <span class="num">2460000.5</span>;  <span class="cmt">% example Julian Date</span>\nT = (JD - <span class="num">2451545.0</span>) / <span class="num">36525</span>;  <span class="cmt">% Julian centuries from J2000</span>\n\n<span class="cmt">% GMST in degrees (simplified formula)</span>\nGMST = <span class="num">280.46061837</span> + <span class="num">360.98564736629</span>*(JD-<span class="num">2451545.0</span>) + ...\n       <span class="num">0.000387933</span>*T^<span class="num">2</span>;\nGMST = <span class="fn">mod</span>(GMST, <span class="num">360</span>);  <span class="cmt">% wrap to [0, 360]</span>\n\n<span class="cmt">% Rotation matrix (S\' — Earth rotation only)</span>\ntheta = GMST * <span class="kw">pi</span>/<span class="num">180</span>;\nS = [<span class="fn">cos</span>(theta) <span class="fn">sin</span>(theta) <span class="num">0</span>;\n    -<span class="fn">sin</span>(theta) <span class="fn">cos</span>(theta) <span class="num">0</span>;\n     <span class="num">0</span>           <span class="num">0</span>          <span class="num">1</span>];\n\n<span class="cmt">% Example: transform ECI position to ECEF</span>\nr_ECI = [<span class="num">6378e3</span>; <span class="num">0</span>; <span class="num">0</span>];  <span class="cmt">% on equator at vernal equinox</span>\nr_ECEF = S * r_ECI;\n<span class="fn">fprintf</span>(<span class="str">\'GMST = %.4f deg\\n\'</span>, GMST);\n<span class="fn">fprintf</span>(<span class="str">\'ECEF: [%.0f, %.0f, %.0f] m\\n\'</span>, r_ECEF);',
diagrams:'<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">ECI → ECEF Transformation Chain</text><rect x="30" y="55" width="100" height="50" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="80" y="77" text-anchor="middle" font-weight="600" font-size="10" fill="#6d28d9">ECI J2000</text><text x="80" y="92" text-anchor="middle" font-size="9" fill="#5a5a55">Non-rotating</text><line x1="130" y1="80" x2="155" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="157" y="55" width="70" height="50" rx="8" fill="#ede9fe" stroke="#c4b5fd"/><text x="192" y="75" text-anchor="middle" font-weight="500" font-size="10">P</text><text x="192" y="92" text-anchor="middle" font-size="8" fill="#5a5a55">Precession</text><line x1="227" y1="80" x2="252" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="254" y="55" width="70" height="50" rx="8" fill="#ede9fe" stroke="#c4b5fd"/><text x="289" y="75" text-anchor="middle" font-weight="500" font-size="10">N</text><text x="289" y="92" text-anchor="middle" font-size="8" fill="#5a5a55">Nutation</text><line x1="324" y1="80" x2="349" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="351" y="55" width="70" height="50" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="386" y="75" text-anchor="middle" font-weight="500" font-size="10">S\'</text><text x="386" y="92" text-anchor="middle" font-size="8" fill="#5a5a55">Sidereal rot.</text><line x1="421" y1="80" x2="446" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="448" y="55" width="70" height="50" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="483" y="75" text-anchor="middle" font-weight="500" font-size="10">W</text><text x="483" y="92" text-anchor="middle" font-size="8" fill="#5a5a55">Polar motion</text><line x1="518" y1="80" x2="543" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="545" y="55" width="90" height="50" rx="10" fill="#6d28d9"/><text x="590" y="77" text-anchor="middle" font-weight="600" font-size="10" fill="#fff">ECEF</text><text x="590" y="92" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)">Body-fixed</text><text x="192" y="130" text-anchor="middle" font-size="9" fill="#5a5a55">50.29\"/yr</text><text x="289" y="130" text-anchor="middle" font-size="9" fill="#5a5a55">9\" (18.6yr)</text><text x="386" y="130" text-anchor="middle" font-size="9" fill="#5a5a55">~15°/hr</text><text x="483" y="130" text-anchor="middle" font-size="9" fill="#5a5a55">~0.4\"</text><rect x="30" y="155" width="605" height="85" rx="10" fill="#fafaf8" stroke="#d8d6d0"/><text x="50" y="175" font-weight="600" font-size="11" fill="#6d28d9">Key Points:</text><text x="50" y="195" font-size="10">• P transforms from J2000 mean equator to equator of date (slow, ~26000 yr period)</text><text x="50" y="210" font-size="10">• N corrects for periodic wobble of spin axis (largest term: 9\", period 18.6 yr from lunar node)</text><text x="50" y="225" font-size="10">• S\' applies Earth rotation (GMST) — the fast rotation (~360°/day)</text><text x="50" y="240" font-size="10">• W corrects for polar motion — quasi-periodic wandering of spin axis (~0.4\", 430 day Chandler period)</text></svg>\n<div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Precession_and_seasons.svg/800px-Precession_and_seasons.svg.png" alt="Precession of Earth axis" loading="lazy"><div class="img-cap">Earth\'s spin axis precesses with a period of ~26000 years. The current pole star (Polaris) will drift away from the North Celestial Pole over millennia. Precession is caused by solar and lunar torques on the Earth\'s equatorial bulge.</div></div>',
graphs:'<div class="graph-desc"><h4>Polar Motion (Slide 33)</h4><p>X-axis: x-coordinate of pole [arcsec]. Y-axis: y-coordinate [arcsec]. A quasi-periodic spiral pattern with amplitude ~0.4 arcsec and dominant Chandler period of 430 days, plus an annual term. 1 arcsec on Earth surface ≈ 31 m. The pole wanders within a ~20 m circle. IERS publishes updated polar motion parameters every 1–2 days.</p></div>',
traps:[{n:1,t:"Reference SYSTEM is abstract (conventions + models). Reference FRAME is physical (coordinates of real points). Don't confuse."},{n:2,t:"J2000 is the EPOCH, not a time scale. It means the equinox and mean equator at 1 Jan 2000, 12:00 noon (JD 2451545.0)."},{n:3,t:"The 4 rotations P, N, S', W go from ECI_J2000 to ECEF. The ORDER matters. Getting it backwards is a common exam error."},{n:4,t:"HA = LST − α. Right ascension α is measured EASTWARD. Hour angle is measured WESTWARD. Sign convention matters."}],
drill:[{q:"What is the difference between a reference system and a reference frame?",a:"A reference system is the set of prescriptions, conventions, and models required to define a triad of axes (abstract/mathematical). A reference frame is a set of physical points with precisely determined coordinates — a concrete realization of the system. Example: ITRS is the system; ITRF2014 is the frame (list of station coordinates + velocities)."},{q:"Name the four rotations to go from ECI J2000 to ECEF and what each corrects for.",a:"P (Precession): transforms from J2000 mean equator to equator of date (~26000 yr period, 50.29\"/yr). N (Nutation): corrects periodic wobble of spin axis (largest term 9\", 18.6 yr). S' (Sidereal rotation): applies Earth rotation (GMST). W (Polar motion): corrects wandering of instantaneous rotation axis (~0.4\", 430 day Chandler period)."},{q:"What is a sidereal day and why is it shorter than a solar day?",a:"A sidereal day is the time for one rotation relative to the stars: 23h 56m 4s. It's shorter because the Earth's orbital motion means the Sun appears to move ~1°/day eastward. The Earth must rotate an extra ~4 minutes past one sidereal day to bring the Sun back to the same meridian."}]},

{id:"icrf",title:"2. ICRS/ICRF & Quasars",slides:"16–19",icon:"⭐",
overview:`The best realization of an inertial frame is the ICRF (International Celestial Reference Frame), originally defined by 212 quasars (now 608).\n\nQuasars are powerful, point-like radio sources at cosmological distances. Due to their extreme distance, proper motions are undetectable — they are effectively "nailed to the sky."\n\nICRS properties:\n• Origin: solar system barycenter (from VLBI modeling in GR)\n• Pole: IAU conventional precession/nutation direction\n• RA origin: fixed by RA of quasar 3C273B to FK5 value at J2000.0\n• Stability: ±20 microarcseconds (µas)\n\nThe ICRS is kinematically defined (fixed to quasars), not dynamically defined (from equations of motion). This is a key distinction — the professor asks about it.\n\nHipparcos and GAIA star positions are expressed in ICRS. JPL planetary ephemerides are also in ICRS.\n\nFK5 (the old optical frame) rotates relative to ICRF at ~3 mas/yr. ICRF is far more stable.`,
equations:`ICRF pole offset from J2000 mean pole:\n  17.3 ± 0.2 mas in direction 12h\n  5.1 ± 0.2 mas in direction 18h\n\n1 mas on Earth surface:\n  4.8×10⁻⁹ × 6371 km = 3.05 cm\n\nFK5 equinox offset from ICRS origin:\n  78 ± 10 mas (rotation around polar axis)\n\nICRF stability: ±20 µas\nFK5 rotation wrt ICRF: ~3 mas/yr`,
derivation:`Kinematic vs Dynamic definition of reference systems:\n\nKINEMATIC (ICRS/ICRF):\n  Fixed to quasars observed by VLBI. No equations of motion needed.\n  Advantage: rigorous, stable, accessible.\n  Limitation: requires large VLBI antennas.\n\nDYNAMIC:\n  Defined from the equations of motion of planets:\n  dvi/dt + 2ω×vi + ω×(ω×ri) = −∑ GMj(ri−rj)/|ri−rj|³\n\n  The Coriolis and centrifugal terms vanish in the inertial frame. By fitting observables (from telescopes, radar, spacecraft) to the dynamical model, one estimates ω and finds the non-rotating frame.\n\n  Advantage: tied to physics (Newton's laws)\n  Limitation: depends on force model accuracy\n\nModern approach: ICRF (kinematic) is the primary standard. The dynamical frame (JPL ephemerides) is aligned to ICRF.`,
matlab:'<span class="cmt">% === Angular Resolution: mas to meters ===</span>\nR_earth = <span class="num">6371e3</span>;  <span class="cmt">% Earth radius [m]</span>\n\n<span class="cmt">% Convert mas to physical distance on Earth</span>\nmas_values = [<span class="num">1</span>, <span class="num">10</span>, <span class="num">100</span>, <span class="num">1000</span>];\n<span class="fn">fprintf</span>(<span class="str">\'Angular resolution on Earth surface:\\n\'</span>);\n<span class="kw">for</span> mas = mas_values\n    rad = mas * <span class="num">1e-3</span> / <span class="num">3600</span> * <span class="kw">pi</span>/<span class="num">180</span>;  <span class="cmt">% mas → radians</span>\n    dist = rad * R_earth;\n    <span class="fn">fprintf</span>(<span class="str">\'  %4d mas = %.2f cm\\n\'</span>, mas, dist*<span class="num">100</span>);\n<span class="kw">end</span>\n\n<span class="cmt">% ICRF stability</span>\n<span class="fn">fprintf</span>(<span class="str">\'\\nICRF stability: 20 µas = %.3f mm on Earth\\n\'</span>, ...\n    <span class="num">20e-6</span>/<span class="num">3600</span>*<span class="kw">pi</span>/<span class="num">180</span>*R_earth*<span class="num">1000</span>);',
diagrams:'<div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/ESA_Gaia_mission_spacecraft.jpg/800px-ESA_Gaia_mission_spacecraft.jpg" alt="ESA GAIA spacecraft" loading="lazy"><div class="img-cap">ESA GAIA astrometric satellite. GAIA measures positions, proper motions, and parallaxes of ~1 billion stars with µas precision, all expressed in the ICRS. GAIA + VLBI quasars together provide the most accurate reference frame ever constructed.</div></div>',
graphs:'<div class="graph-desc"><h4>ICRF Quasar Distribution</h4><p>Sky map showing 608 defining quasars distributed across the celestial sphere. Quasars are compact extragalactic radio sources at cosmological distances. Their angular positions are determined by VLBI with precision of ~40 µas. The distribution is roughly uniform but with gaps near the galactic plane (obscuration by interstellar dust).</p></div>',
traps:[{n:1,t:"ICRF is KINEMATIC (quasars), not dynamic. The professor explicitly asks: 'kinematic or dynamic definition?'"},{n:2,t:"Quasars are used because they're point-like RADIO sources at enormous distance → no detectable proper motion. Stars are too close (have proper motions) and are primarily OPTICAL, not radio."},{n:3,t:"1 mas on Earth ≈ 3 cm. Know this conversion for the exam."}],
drill:[{q:"Define ICRS and ICRF. What is the difference?",a:"ICRS = International Celestial Reference System — the abstract set of conventions (origin at SSB, kinematic, non-rotating). ICRF = International Celestial Reference Frame — the physical realization using 608 quasar positions measured by VLBI."},{q:"Why are quasars used to define the ICRF instead of stars?",a:"Quasars are at cosmological distances → no detectable proper motion ('nailed to the sky'). Stars have proper motions of mas/yr that must be modelled, introducing errors. Quasars are also point-like radio sources accessible to VLBI, which gives the highest angular resolution."},{q:"What is the difference between kinematic and dynamic definition of a reference system?",a:"Kinematic: fixed to observed objects (quasars) without needing equations of motion. Dynamic: defined by requiring that Coriolis acceleration = 0 in the frame — requires solving equations of motion for planets. Modern standard: ICRF (kinematic) is primary; dynamical frames are aligned to it."}]},

{id:"clocks",title:"3. Clocks: Architecture & Q-Factor",slides:"56–60",icon:"⏱️",
overview:`A clock consists of three fundamental building blocks:\n1. Oscillator — generates a periodic signal\n2. High-Q Resonator — stabilises the oscillator frequency\n3. Feedback loop — compares oscillator output with resonator and corrects\n\nThe resonator is described by a forced harmonic oscillator:\n  ẍ + 2λẋ + ω₀²x = (F₀/m)cos(γt)\n\nThe response has peak amplitude near ω₀. The width of the resonance curve is inversely proportional to Q:\n\nQuality factor: Q = 2π × (energy stored)/(energy lost per cycle) = ω₀/(2λ)\n\nHigh Q means:\n• Narrow resonance peak → precise frequency definition\n• Little energy needed to maintain oscillation → less perturbation\n• Best clocks use the highest Q resonators\n\nIf the forcing is turned off, energy decays as E = E₀ exp(−2λt). The decay time constant is τ = 1/(2λ) = Q/(πf₀). Higher Q → slower decay → more stable.`,
equations:`Forced oscillator:\n  ẍ + 2λẋ + ω₀²x = (F₀/m)cos(γt)\n\nSteady-state amplitude:\n  B = F₀/m / √[(ω₀²−γ²)² + 4λ²γ²]\n\nResonance at: γ ≈ ω₀ (for small λ)\n\nQuality factor:\n  Q = 2πE/ΔE = ω₀/(2λ)\n\nEnergy decay: E = E₀ exp(−2λt)\n\nQ values:\n  Tuning fork: 10³\n  Quartz wristwatch: 10⁴\n  OCXO: 10⁶\n  Rubidium: 10⁷\n  Cesium beam: 10⁸\n  H-maser: 10⁹\n  Cs fountain: 10¹⁰\n  Optical (Hg⁺): 10¹⁴`,
derivation:`Why high Q is essential:\n\nStep 1: The resonance curve has width Δf = f₀/Q (at −3 dB).\nHigher Q → narrower peak → more precisely defined frequency.\n\nStep 2: Energy per cycle lost: ΔE = 2πE/Q.\nHigher Q → less energy dissipated → less coupling to environment → fewer perturbations.\n\nStep 3: The feedback loop works by:\n• Resonator compares oscillator output with its natural frequency ω₀\n• If oscillator drifts, the resonator response changes (off-peak → lower amplitude)\n• Error signal corrects the oscillator frequency back to ω₀\n\nStep 4: The BEST clocks use quantum mechanical transitions as resonators:\n• Cesium hyperfine transition: f = 9,192,631,770 Hz (definition of SI second)\n• Hydrogen maser: 1,420,405,751.7667 Hz (21 cm line)\n• These are universal constants → reproducible anywhere\n\nThe combination of high Q and quantum-mechanical frequency stability makes atomic clocks the ultimate timekeeping devices.`,
matlab:'<span class="cmt">% === Resonance Curve & Quality Factor ===</span>\nf0 = <span class="num">9.19263177e9</span>;  <span class="cmt">% Cs-133 hyperfine [Hz]</span>\nw0 = <span class="num">2</span>*<span class="kw">pi</span>*f0;\n\nQ_values = [<span class="num">1e4</span>, <span class="num">1e6</span>, <span class="num">1e8</span>, <span class="num">1e10</span>];\n\n<span class="fn">fprintf</span>(<span class="str">\'Resonance linewidth at Cs frequency:\\n\'</span>);\n<span class="kw">for</span> i = <span class="num">1</span>:<span class="fn">length</span>(Q_values)\n    Q = Q_values(i);\n    delta_f = f0 / Q;  <span class="cmt">% linewidth [Hz]</span>\n    tau = Q / (<span class="kw">pi</span>*f0);  <span class="cmt">% decay time [s]</span>\n    <span class="fn">fprintf</span>(<span class="str">\'  Q=%.0e: Δf=%.1e Hz, τ=%.2e s\\n\'</span>, Q, delta_f, tau);\n<span class="kw">end</span>\n\n<span class="cmt">% Plot resonance curves</span>\nf = <span class="fn">linspace</span>(<span class="num">0.99</span>, <span class="num">1.01</span>, <span class="num">10000</span>);\n<span class="kw">figure</span>; <span class="kw">hold</span> <span class="kw">on</span>;\n<span class="kw">for</span> Q = [<span class="num">10</span>, <span class="num">100</span>, <span class="num">1000</span>]\n    lam = <span class="num">1</span>/(<span class="num">2</span>*Q);\n    B = <span class="num">1</span> ./ <span class="fn">sqrt</span>((<span class="num">1</span>-f.^<span class="num">2</span>).^<span class="num">2</span> + <span class="num">4</span>*lam^<span class="num">2</span>*f.^<span class="num">2</span>);\n    <span class="fn">plot</span>(f, B/<span class="fn">max</span>(B), <span class="str">\'LineWidth\'</span>, <span class="num">1.5</span>);\n<span class="kw">end</span>\n<span class="fn">xlabel</span>(<span class="str">\'f/f_0\'</span>); <span class="fn">ylabel</span>(<span class="str">\'Normalised amplitude\'</span>);\n<span class="fn">title</span>(<span class="str">\'Resonance Curves at Different Q\'</span>);\n<span class="fn">legend</span>(<span class="str">\'Q=10\'</span>,<span class="str">\'Q=100\'</span>,<span class="str">\'Q=1000\'</span>); <span class="kw">grid</span> <span class="kw">on</span>;',
diagrams:'<svg viewBox="0 0 660 180" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6d28d9"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Clock Architecture — Universal Block Diagram</text><rect x="50" y="55" width="120" height="50" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="110" y="77" text-anchor="middle" font-weight="600" font-size="11">Oscillator</text><text x="110" y="92" text-anchor="middle" font-size="9" fill="#5a5a55">Quartz crystal</text><line x1="170" y1="80" x2="220" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a2)"/><rect x="222" y="55" width="140" height="50" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="292" y="72" text-anchor="middle" font-weight="600" font-size="11">High-Q Resonator</text><text x="292" y="92" text-anchor="middle" font-size="9" fill="#6d28d9">Cs atoms / H-maser cavity</text><line x1="362" y1="80" x2="412" y2="80" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#a2)"/><rect x="414" y="55" width="120" height="50" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="474" y="77" text-anchor="middle" font-weight="600" font-size="11">Feedback</text><text x="474" y="92" text-anchor="middle" font-size="9" fill="#0f766e">Error → correction</text><line x1="474" y1="105" x2="474" y2="140" stroke="#0f766e" stroke-dasharray="4,3"/><line x1="474" y1="140" x2="110" y2="140" stroke="#0f766e" stroke-dasharray="4,3"/><line x1="110" y1="140" x2="110" y2="105" stroke="#0f766e" marker-end="url(#a2)"/><text x="292" y="155" text-anchor="middle" font-size="10" fill="#0f766e" font-weight="500">Feedback loop: corrects oscillator to match resonator ω₀</text><rect x="530" y="55" width="100" height="50" rx="10" fill="#6d28d9"/><text x="580" y="77" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Output</text><text x="580" y="92" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)">f₀ ± Δf</text><line x1="362" y1="60" x2="530" y2="60" stroke="#1a1a18" stroke-dasharray="3,3"/></svg>',
graphs:'<div class="graph-desc"><h4>Resonance Curves at Different Q (from slide 58)</h4><p>X-axis: f/f₀ (normalised frequency). Y-axis: Response amplitude (normalised). Three curves for Q=10, 100, 1000. Higher Q → sharper, narrower peak → more precise frequency definition. The linewidth (at −3 dB) is Δf = f₀/Q. For Cs fountain (Q=10¹⁰): Δf ≈ 0.9 Hz — an incredibly narrow line at 9.2 GHz.</p></div>',
traps:[{n:1,t:"The professor asks: 'Draw the general clock block diagram' and then asks about EACH block. Know oscillator, resonator, feedback roles precisely."},{n:2,t:"Q = ω₀/(2λ), NOT ω₀/λ. The factor of 2 matters."},{n:3,t:"'What information does the resonator send to the feedback?' — It sends the ERROR signal: how far the oscillator frequency is from ω₀. The feedback then corrects the oscillator."},{n:4,t:"'What facilitates the feedback?' — High Q. Because the resonance peak is narrow, even small frequency deviations produce large changes in response amplitude → strong error signal."}],
drill:[{q:"Draw and explain the three building blocks of any clock.",a:"1) Oscillator: generates a periodic signal (e.g. quartz crystal). 2) High-Q Resonator: provides a precise frequency reference (e.g. Cs atoms, H-maser cavity). Q = ω₀/(2λ). 3) Feedback loop: compares oscillator output with resonator response, generates error signal, corrects oscillator. The resonator's narrow resonance peak (width Δf = f₀/Q) makes the error signal sensitive to small frequency drifts."},{q:"Why must the resonator have a high Q?",a:"High Q means: (1) narrow resonance curve → precise frequency definition (Δf = f₀/Q), (2) low energy loss per cycle → minimal perturbation of the system, (3) strong error signal for feedback → better correction. Higher Q = better clock stability."},{q:"What is the cesium hyperfine transition frequency and why is it important?",a:"f = 9,192,631,770 Hz. This is the DEFINITION of the SI second: 'the duration of 9,192,631,770 periods of radiation corresponding to the transition between the two hyperfine levels of the ground state of cesium-133.' This number is exact — by definition."}]},

{id:"cesium",title:"4. Cesium Clocks & Atomic Time",slides:"61–66",icon:"⚛️",
overview:`Cesium-133 has one unpaired electron (spin 1/2) and nuclear spin 7/2. The total spin F can be either 4 (parallel) or 3 (anti-parallel). The F=4 state has slightly higher energy due to magnetic interaction between nuclear and electron magnetic moments.\n\nThe hyperfine transition (F=4 ↔ F=3) emits radiation at exactly 9,192,631,770 Hz. This IS the definition of the SI second.\n\nCesium beam clock (traditional):\n1. Cs atoms heated to gas in oven → high-velocity beam\n2. First magnet: selects atoms in one spin state (gate)\n3. Microwave cavity: exposes atoms to radiation from quartz oscillator\n4. If microwave frequency matches 9.192... GHz → atoms change state\n5. Second magnet: only state-changed atoms reach detector\n6. Detector output → feedback to tune quartz oscillator\n\nLimitation: Q is limited by thermal Doppler broadening — hot atoms "see" the microwave at a different frequency.\n\nCesium fountain clock (state-of-the-art):\n1. Cs atoms cooled to ~1 µK using laser cooling (optical molasses)\n2. Atoms launched vertically through microwave cavity (up + down → 2 passes)\n3. Fluorescence detection counts atoms that changed state\n4. Thermal speed: ~1 cm/s (vs ~100 m/s in beam) → much narrower linewidth\n5. Q ~ 10¹⁰ vs 10⁸ for beam → 100× better frequency stability`,
equations:`Cesium-133 hyperfine transition:\n  f = ΔE/h = 9,192,631,770 Hz (EXACT — defines SI second)\n\nTotal spin states:\n  F = I + S = 7/2 + 1/2 = 4 (parallel, higher energy)\n  F = I − S = 7/2 − 1/2 = 3 (anti-parallel, lower energy)\n\nDoppler broadening (beam):\n  Δf_Doppler = f₀ × √(2kT/mc²)\n  At T = 400 K: thermal velocity ~200 m/s\n\nLaser cooling (fountain):\n  T ~ 1 µK → thermal speed ~1 cm/s\n  Δf reduced by factor ~10000\n\nBeam Q: ~10⁸\nFountain Q: ~10¹⁰\n\nTAI: statistical average of ~200 atomic clocks on Earth\nTT = TAI + 32.184 s (by definition)`,
derivation:`Why laser cooling dramatically improves clock performance:\n\nStep 1: In a Cs beam clock, atoms move at ~200 m/s. Due to the Doppler effect, each atom "sees" the microwave at a slightly different frequency:\n  f_seen = f₀(1 ± v/c)\n  At 200 m/s: Δf/f₀ ≈ v/c = 200/(3×10⁸) ≈ 7×10⁻⁷\n\nStep 2: This Doppler broadening limits the effective Q of the resonance.\n\nStep 3: In a fountain clock, laser cooling uses pairs of lasers tuned slightly BELOW the Cs resonance ("to the red"). An atom moving toward one laser sees it blue-shifted (closer to resonance) → higher scattering rate → light pressure slows the atom. The opposite laser is red-shifted further away → less scattering. Net effect: atom is decelerated.\n\nStep 4: Atoms cooled to ~1 µK have thermal speed ~1 cm/s.\n  Doppler broadening: Δf/f₀ ≈ 0.01/(3×10⁸) ≈ 3×10⁻¹¹\n  → Improvement of ~10⁴ over beam clocks!\n\nStep 5: The fountain geometry gives two passes through the cavity (up and down), further improving the measurement.`,
matlab:'<span class="cmt">% === Cesium Clock: Doppler Broadening ===</span>\nk_B = <span class="num">1.38e-23</span>;  <span class="cmt">% Boltzmann [J/K]</span>\nm_Cs = <span class="num">133</span> * <span class="num">1.66e-27</span>;  <span class="cmt">% Cs-133 mass [kg]</span>\nc = <span class="num">3e8</span>;\nf0 = <span class="num">9.192631770e9</span>;  <span class="cmt">% Cs hyperfine [Hz]</span>\n\n<span class="cmt">% Beam clock: T ~ 400 K</span>\nT_beam = <span class="num">400</span>;\nv_beam = <span class="fn">sqrt</span>(<span class="num">2</span>*k_B*T_beam/m_Cs);\ndf_beam = f0 * v_beam/c;\n<span class="fn">fprintf</span>(<span class="str">\'Beam clock (T=%dK):\\n\'</span>, T_beam);\n<span class="fn">fprintf</span>(<span class="str">\'  Thermal speed: %.0f m/s\\n\'</span>, v_beam);\n<span class="fn">fprintf</span>(<span class="str">\'  Doppler width: %.0f Hz\\n\'</span>, df_beam);\n<span class="fn">fprintf</span>(<span class="str">\'  Effective Q: %.1e\\n\\n\'</span>, f0/df_beam);\n\n<span class="cmt">% Fountain: T ~ 1 µK</span>\nT_fount = <span class="num">1e-6</span>;\nv_fount = <span class="fn">sqrt</span>(<span class="num">2</span>*k_B*T_fount/m_Cs);\ndf_fount = f0 * v_fount/c;\n<span class="fn">fprintf</span>(<span class="str">\'Fountain clock (T=%.0e K):\\n\'</span>, T_fount);\n<span class="fn">fprintf</span>(<span class="str">\'  Thermal speed: %.3f m/s\\n\'</span>, v_fount);\n<span class="fn">fprintf</span>(<span class="str">\'  Doppler width: %.3f Hz\\n\'</span>, df_fount);\n<span class="fn">fprintf</span>(<span class="str">\'  Effective Q: %.1e\\n\'</span>, f0/df_fount);\n<span class="fn">fprintf</span>(<span class="str">\'  Improvement: %.0fx\\n\'</span>, df_beam/df_fount);',
diagrams:'<svg viewBox="0 0 660 250" xmlns="http://www.w3.org/2000/svg" class="diagram-svg"><defs><marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6d28d9"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="330" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Cesium Beam Clock — Block Diagram</text><rect x="30" y="55" width="80" height="45" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="70" y="75" text-anchor="middle" font-weight="500" font-size="10">Cs Oven</text><text x="70" y="88" text-anchor="middle" font-size="8" fill="#5a5a55">~400 K gas</text><line x1="110" y1="78" x2="140" y2="78" stroke="#6d28d9" marker-end="url(#a3)"/><rect x="142" y="55" width="70" height="45" rx="8" fill="#ede9fe" stroke="#c4b5fd"/><text x="177" y="72" text-anchor="middle" font-weight="500" font-size="10">Magnet A</text><text x="177" y="88" text-anchor="middle" font-size="8" fill="#6d28d9">State gate</text><line x1="212" y1="78" x2="242" y2="78" stroke="#6d28d9" marker-end="url(#a3)"/><rect x="244" y="48" width="120" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="304" y="68" text-anchor="middle" font-weight="600" font-size="10" fill="#6d28d9">Microwave Cavity</text><text x="304" y="82" text-anchor="middle" font-size="9">9.192... GHz</text><text x="304" y="96" text-anchor="middle" font-size="8" fill="#5a5a55">from quartz osc.</text><line x1="364" y1="78" x2="394" y2="78" stroke="#6d28d9" marker-end="url(#a3)"/><rect x="396" y="55" width="70" height="45" rx="8" fill="#ede9fe" stroke="#c4b5fd"/><text x="431" y="72" text-anchor="middle" font-weight="500" font-size="10">Magnet B</text><text x="431" y="88" text-anchor="middle" font-size="8" fill="#6d28d9">Changed only</text><line x1="466" y1="78" x2="496" y2="78" stroke="#6d28d9" marker-end="url(#a3)"/><rect x="498" y="55" width="80" height="45" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="538" y="75" text-anchor="middle" font-weight="500" font-size="10">Detector</text><text x="538" y="88" text-anchor="middle" font-size="8" fill="#0f766e">Count atoms</text><line x1="538" y1="100" x2="538" y2="135" stroke="#0f766e"/><rect x="440" y="135" width="120" height="35" rx="6" fill="#ecfdf5" stroke="#86efac"/><text x="500" y="157" text-anchor="middle" font-size="10" fill="#0f766e" font-weight="500">Feedback → tune</text><line x1="440" y1="152" x2="304" y2="152" stroke="#0f766e" stroke-dasharray="4,3"/><line x1="304" y1="152" x2="304" y2="106" stroke="#0f766e" marker-end="url(#a3)"/><text x="330" y="200" text-anchor="middle" font-size="10" fill="#1a1a18">Maximise detector count → quartz frequency locked to Cs resonance</text><rect x="80" y="215" width="200" height="25" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="180" y="232" text-anchor="middle" font-size="10" fill="#dc2626">F=4 → selected → cavity → F=3 → detected</text></svg>\n<div class="img-frame"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/NIST-F2_cesium_fountain_clock.jpg/600px-NIST-F2_cesium_fountain_clock.jpg" alt="NIST-F2 cesium fountain" loading="lazy"><div class="img-cap">NIST-F2 cesium fountain clock — currently one of the most accurate clocks in the world. Laser-cooled Cs atoms are launched vertically, passing twice through the microwave cavity. Accuracy: ~1 second in 300 million years.</div></div>',
graphs:'<div class="graph-desc"><h4>Quality Factor Comparison Across Clock Types</h4><p>Bar chart (log scale) of Q values: Tuning fork (10³), Quartz (10⁴), OCXO (10⁶), Rubidium (10⁷), Cs beam (10⁸), H-maser (10⁹), Cs fountain (10¹⁰), Optical/Hg⁺ (10¹⁴). Each order of magnitude in Q represents a fundamental improvement in frequency definition. The jump from Cs beam to Cs fountain comes entirely from laser cooling reducing Doppler broadening.</p></div>',
traps:[{n:1,t:"Cesium defines the SI second. The frequency 9,192,631,770 Hz is EXACT by definition — not a measurement. There is no uncertainty in this number."},{n:2,t:"Q of Cs beam is limited by DOPPLER broadening — hot atoms see different frequencies. Laser cooling (fountain) solves this by reducing thermal speed 10000×."},{n:3,t:"The hyperfine transition is a MAGNETIC interaction between nuclear and electron spins. F=4 (parallel spins) has HIGHER energy than F=3 (anti-parallel)."},{n:4,t:"UTC is NOT TAI. UTC = TAI − N seconds (where N is an integer, currently 37). UTC has leap seconds; TAI does not. The professor specifically asks: 'Is UTC an atomic time scale?'"}],
drill:[{q:"What is the hyperfine transition in Cesium-133?",a:"Cs-133 has nuclear spin I=7/2 and electron spin S=1/2. Total spin F = 4 (parallel) or F = 3 (anti-parallel). The F=4 state has slightly higher energy due to magnetic interaction between nuclear and electron magnetic moments. The transition frequency is ΔE/h = 9,192,631,770 Hz — this defines the SI second."},{q:"How does laser cooling improve a cesium clock?",a:"Beam clocks: atoms at ~400 K have thermal speed ~200 m/s → Doppler broadening limits Q to ~10⁸. Laser cooling (optical molasses) uses pairs of red-detuned lasers. Atoms moving toward a laser see it blue-shifted closer to resonance → more scattering → deceleration. Cooled to ~1 µK (speed ~1 cm/s), Doppler broadening drops 10000×, Q reaches ~10¹⁰."},{q:"Is UTC an atomic time scale? Comment on TAI and UT0/UT1.",a:"TAI is a pure atomic time scale — averaged from ~200 atomic clocks. UTC runs at the same RATE as TAI but is offset by an integer number of leap seconds to stay within ±0.9 s of UT1 (astronomical time based on Earth rotation). UT0 is raw rotational time at a specific station; UT1 corrects UT0 for polar motion. So: TAI is purely atomic, UT1 is purely astronomical, and UTC is a HYBRID — atomic rate with astronomical corrections."}]},

const EXAM_QS=[
{tag:"hot",q:"General clock block diagram. Why must Q be high? What does the resonator send to feedback? What facilitates the feedback?",a:"Three blocks: Oscillator (quartz) → High-Q Resonator (Cs atoms/H-maser) → Feedback (error correction loop back to oscillator). High Q needed because: (1) narrow resonance → precise frequency definition (Δf = f₀/Q), (2) less energy loss → less perturbation. The resonator sends an ERROR SIGNAL: when oscillator drifts from ω₀, the resonator response amplitude drops (off-peak), producing a voltage proportional to the frequency error. What facilitates feedback: HIGH Q — because the narrow peak makes even tiny frequency shifts produce large amplitude changes → strong error signal → effective correction."},
{tag:"hot",q:"Relativity of simultaneity. What is the metric? How does GR change the metric?",a:"Simultaneity is relative: events simultaneous for one observer occur at different times for another in relative motion (light-speed constancy). The METRIC is the prescription for computing space-time distances: ds² = g_ik dx^i dx^k. In SR: g = diag(1,−1,−1,−1) → ds² = c²dt² − dx² − dy² − dz² (Minkowski metric). In GR, the metric is determined by Einstein's field equations. For a spherical, non-rotating mass: Schwarzschild metric ds² = (1+2U/c²)(cdt)² − (1−2U/c²)(dx²+dy²+dz²) where U = −GM/r. The key difference: GR metric depends on the gravitational potential U — space-time is curved by mass."},
{tag:"hot",q:"GPS/GNSS equations of triangulation. Why must clocks be synchronised? How do you synchronise them?",a:"Pseudorange equations: c²(t_tr − t_ri − δt)² = (x−xi)² + (y−yi)² + (z−zi)². Four unknowns: x,y,z (position) + δt (clock bias). Need minimum 4 satellites. Clocks must be synchronised because the measurement IS a time measurement — 1 µs error = 300 m position error (c×10⁻⁶). Onboard: atomic clocks (Rb/Cs) with frequency pre-adjusted for relativistic effects. Synchronisation: the ground control segment continuously measures satellite clock offsets using tracking stations with H-masers, then uploads corrections. The user clock is NOT synchronised — its offset δt is solved as a 4th unknown."},
{tag:"hot",q:"Difference UT0, UT1, UTC, TAI and corrections between them.",a:"TAI: International Atomic Time — averaged from ~200 atomic clocks. Pure atomic, SI seconds. UT0: rotational time at a specific station — from star/quasar transit observations. UT1: UT0 corrected for polar motion — the best measure of Earth rotation angle. UTC: atomic rate (= TAI rate) but with leap seconds to keep within ±0.9 s of UT1. Corrections: TT = TAI + 32.184 s (exact). UTC = TAI − N (currently N=37, from leap seconds). GPS time = TAI − 19 s (no leap seconds since GPS epoch 1980). UT1−UTC published by IERS every 1–2 days."},
{tag:"hot",q:"How to construct an inertial reference system? Define ECI. What is ICRF?",a:"Two methods: (1) KINEMATIC: fix frame to objects with no detectable motion (quasars) → ICRF, realized by VLBI. (2) DYNAMIC: solve equations of motion requiring zero Coriolis acceleration → fitted to planetary observations. ECI (Earth Centered Inertial) = J2000 system: origin at geocenter, X toward J2000 vernal equinox, Z toward J2000 mean North Pole. ICRF: International Celestial Reference Frame — 608 defining quasars, origin at SSB, pole at IAU conventional direction. Stability ±20 µas. The kinematic (ICRF) is now the PRIMARY standard; dynamical frames are aligned to it."},
{tag:"med",q:"Body-fixed reference frames: what are they? Why do we talk about 'mean' axis?",a:"Body-fixed frames rotate with the Earth (ECEF). The Z-axis should coincide with the Earth's angular velocity vector — but it DOESN'T exactly because of polar motion (quasi-periodic wandering, ~0.4 arcsec, 430-day Chandler period). So we use the 'mean' pole (averaged over time) as the Z-axis reference. The 'mean' axis avoids the complications of tracking the instantaneous rotation axis. IERS publishes polar motion corrections (EOP) every 1–2 days."},
{tag:"med",q:"Polar motion: order of magnitude? What causes it?",a:"Polar motion amplitude: ~0.4 arcsec ≈ 12 m on Earth surface. Dominant period: 430 days (Chandler period). Cause: redistribution of masses in Earth's interior, oceans, and atmosphere. Also includes an annual component from seasonal atmospheric/oceanic mass changes. The wandering of the spin axis is monitored by IERS and described by two coordinates (x, −y) of the Celestial Intermediate Pole relative to the terrestrial reference frame."},
{tag:"med",q:"Characteristics of oscillator. What is ω₀? Demodulation. What are Ka and λ?",a:"ω₀ = natural angular frequency of the resonator = 2πf₀. For Cs: f₀ = 9.192631770 GHz. The oscillator generates a signal at approximately ω₀; the resonator + feedback lock it precisely. Ka = Ka-band (32–34.7 GHz) — deep space communication frequency band. λ = wavelength = c/f. These parameters determine antenna gain (G ∝ (D/λ)²) and free space loss (LFS ∝ (R/λ)²)."},
{tag:"med",q:"How to synchronise two clocks? UTC and TAI time scales.",a:"For nearby clocks: exchange signals, measure transit time, compute desynchronisation. For distant clocks: must account for (1) signal propagation delay, (2) different gravitational potentials (GR), (3) relative velocity (SR). In GNSS: ground stations with H-masers measure satellite clock offsets via 2-way ranging, upload corrections. 'Synchronisation' means: ensuring proper times of different clocks correspond to the same coordinate time. TAI: average of ~200 clocks on Earth, all corrected to the geoid. UTC: TAI with leap seconds to track UT1."},
{tag:"low",q:"Relativistic transformations: Lorentz and metric. GPS and triangulation.",a:"Lorentz: x' = (x−Vt)/√(1−V²/c²), t' = (t−Vx/c²)/√(1−V²/c²). The metric ds² = c²dt²−dx²−dy²−dz² is INVARIANT under Lorentz transformations — all observers agree on ds². For GPS: relativistic effects cause onboard clocks to run faster by ~38 µs/day (+45 µs GR gravitational, −7 µs SR time dilation). If uncorrected: ~10 km/day position drift. Corrected by pre-adjusting satellite oscillator frequency from 10.23 MHz to 10.22999999543 MHz. Residual eccentricity effect: Δtr = 2r·v/c²."}
];

let activeSection=M[0].id,activeTab=0;
function render(){
 document.getElementById('sideList').innerHTML=M.map(m=>`<button class="sitem ${activeSection===m.id?'active':''}" onclick="setSection('${m.id}')"><span class="sicon">${m.icon}</span><div class="stxt"><div class="st">${m.title}</div><div class="sp">${m.isExam?'Past papers':'Slides '+m.slides}</div></div></button>`).join('');
 const mod=M.find(m=>m.id===activeSection);if(!mod)return;
 document.getElementById('modHead').innerHTML=`<h2>${mod.icon} ${mod.title}</h2><div class="sub">${mod.isExam?'Prof. Iess oral questions':'Slides '+mod.slides}</div>`;
 const tb=document.getElementById('tabBar'),ca=document.getElementById('contentArea');
 if(mod.isExam){tb.innerHTML='';ca.innerHTML=`<div style="margin-bottom:16px"><h3 style="font-family:var(--serif);font-size:16px;margin-bottom:4px">Prof. Iess — Ch4 Oral Exam Questions</h3><p style="font-size:12px;color:var(--t2)">From sms_oral_questions.pdf. Click to reveal. <span class="eq-tag hot">HOT</span> = very frequent.</p></div>`+EXAM_QS.map(e=>`<div class="exam-q" onclick="this.classList.toggle('open')"><span class="eq-tag ${e.tag}">${e.tag.toUpperCase()}</span><span class="eq-text">${e.q}</span><div class="eq-answer">${e.a}</div></div>`).join('');return;}
 tb.innerHTML=TABS.map((t,i)=>`<button class="tab-btn ${activeTab===i?'active':''}" onclick="setTab(${i})"><span>${TICONS[i]}</span>${t}</button>`).join('');
 if(activeTab===0)ca.innerHTML=`<div class="prose">${mod.overview}</div>`;
 else if(activeTab===1)ca.innerHTML=`<div class="eqbox">${mod.equations}</div>`;
 else if(activeTab===2)ca.innerHTML=`<div class="prose">${mod.derivation}</div>`;
 else if(activeTab===3)ca.innerHTML=`<div class="matlab-box">${mod.matlab}</div>`;
 else if(activeTab===4)ca.innerHTML=mod.diagrams||'<p style="color:var(--t3)">See lecture slides for additional diagrams.</p>';
 else if(activeTab===5)ca.innerHTML=mod.graphs||'';
 else if(activeTab===6)ca.innerHTML=(mod.traps||[]).map(t=>`<div class="trap-card"><div class="label">Trap #${t.n}</div><p>${t.t}</p></div>`).join('');
 else if(activeTab===7)ca.innerHTML=(mod.drill||[]).map((d,i)=>`<div class="drill-card"><div class="q">Q${i+1}: ${d.q}</div><button class="drill-btn" onclick="toggleDrill(this)">Reveal answer</button><div class="drill-ans">${d.a}</div></div>`).join('');
}
function setSection(id){activeSection=id;activeTab=0;render();}
function setTab(i){activeTab=i;render();}
function toggleDrill(btn){const a=btn.nextElementSibling;a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'Hide':'Reveal answer';}
render();
</script>
</body>
</html>
