const M=[
{id:"class",title:"1. Mission Classification",sl:"5–18",icon:"🛰️",
ov:`Space missions are broadly classified by purpose and orbit:\n\n• Earth Observation (EO): gather data on Earth's environment — weather, climate, sea level, gravity field. Polar LEO (global coverage) or GEO. Examples: METEOSAT, LANDSAT, GRACE, GOCE, CosmoSkyMed, Sentinel, Jason-3. Topex/Poseidon measured Global Mean Sea Level rise of ~3.1 mm/yr.\n\n• Telecommunications: distribute data, TV signals, digital comms. GEO for low/mid latitudes (point-to-many: TV broadcast), Molniya for high latitudes, LEO for data constellations (Starlink). Marginal contribution to total global data volume — mainly for remote users and broadcast.\n\n• Navigation: provide position, velocity, and time (PNT) to users. Always in constellation (GPS, GLONASS, Galileo). MEO orbits. Require precise atomic clocks + accurate ephemerides. Radio signal transfer to users.\n\n• Technology Demonstration: test new technologies in the space environment. ESA SMART, EUREKA. Various orbits.\n\n• Space Stations: permanent manned laboratories — ISS, Lunar Gateway (cislunar orbit with Orion capsule for Artemis program). LEO or lunar orbits.\n\n• Defence: observation, intelligence, early warning, telecom. "Spy satellites" gave invaluable contribution to peace during Cold War. Various orbits — mainly polar LEO for observation, GEO for telecom.`,
kf:`Mission Classification Summary:\n\n  Category          | Orbit      | Examples\n  ─────────────────┼────────────┼──────────────────────────\n  Earth Observation | LEO/GEO    | GRACE, GOCE, Jason-3, Sentinel\n  Telecom           | GEO/LEO    | Starlink, Inmarsat\n  Navigation        | MEO        | GPS, GLONASS, Galileo\n  Tech Demo         | Various    | SMART, EUREKA\n  Space Stations    | LEO/Lunar  | ISS, Lunar Gateway\n  Defence           | LEO/GEO    | Classified\n\nKey Numbers:\n  GPS: 24 sats, 6 planes, ~20200 km, 12h period\n  GEO altitude: 35786 km\n  Sea level rise (Topex): ~3.1 mm/yr\n  JUICE data: 1.4 Gbit/day at Jupiter`,
det:`Earth Observation in detail:\n\nTopex/Poseidon (1992–2005) was a joint NASA/CNES altimetry mission measuring ocean surface topography with cm-level accuracy. Its successor Jason-1/2/3 continued the record. The radar altimeter measures the round-trip time of a microwave pulse to the ocean surface. Combined with precise orbit determination (GPS + DORIS + SLR), the sea surface height is determined relative to the reference ellipsoid.\n\nKey instruments on Topex/Poseidon:\n• Radar altimeter (dual-frequency: Ku + C band for ionosphere correction)\n• Microwave radiometer (columnar water vapor — for troposphere correction)\n• GPS receiver (precise orbit determination)\n• DORIS receiver (Doppler tracking for POD)\n• Laser retroreflector (SLR tracking for POD)\n\nThe sea level record shows ~3.1 mm/yr rise since 1993, with the 1997 El Niño clearly visible as a 14–32 cm anomaly in the eastern Pacific.\n\nGPS constellation: 24+ satellites in 6 orbital planes (i = 55°), altitude ~20200 km, orbital period ~12 hours. Each satellite carries Rb/Cs atomic clocks. Provides pseudorange, carrier phase, Doppler, and C/N₀ observables.`,
mat:'<span class="c">% === Orbit Altitudes for Different Mission Types ===</span>\nGM = <span class="n">3.986e14</span>; Re = <span class="n">6371e3</span>;\n\n<span class="c">% Mission categories and typical altitudes [km]</span>\nmissions = {<span class="s">\'LEO (EO)\'</span>, <span class="s">\'MEO (GPS)\'</span>, <span class="s">\'GEO (Telecom)\'</span>, <span class="s">\'Lunar Gateway\'</span>};\nalt_km = [<span class="n">800</span>, <span class="n">20200</span>, <span class="n">35786</span>, <span class="n">384400</span>];\n\n<span class="f">fprintf</span>(<span class="s">\'Mission Type          Alt[km]   Period[h]   V[km/s]\\n\'</span>);\n<span class="k">for</span> i = <span class="n">1</span>:<span class="f">length</span>(alt_km)\n    r = (Re + alt_km(i)*<span class="n">1e3</span>);\n    T = <span class="n">2</span>*<span class="k">pi</span>*<span class="f">sqrt</span>(r^<span class="n">3</span>/GM);\n    v = <span class="f">sqrt</span>(GM/r);\n    <span class="f">fprintf</span>(<span class="s">\'%-20s %7.0f   %8.2f   %7.2f\\n\'</span>, ...\n        missions{i}, alt_km(i), T/<span class="n">3600</span>, v/<span class="n">1e3</span>);\n<span class="k">end</span>\n\n<span class="c">% Sea level rise rate</span>\nrate_mm_yr = <span class="n">3.1</span>;\n<span class="f">fprintf</span>(<span class="s">\'\\nSea level rise: %.1f mm/yr = %.1f cm/decade\\n\'</span>, ...\n    rate_mm_yr, rate_mm_yr*<span class="n">10</span>/<span class="n">10</span>);',
dia:'<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="svg"><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="340" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#0ea5e9">Space Mission Classification by Orbit</text><circle cx="340" cy="190" r="40" fill="#dcfce7" stroke="#86efac"/><text x="340" y="193" text-anchor="middle" font-weight="600" font-size="10" fill="#0f766e">Earth</text><circle cx="340" cy="190" r="65" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/><text x="420" y="140" font-size="10" fill="#2563eb" font-weight="500">LEO ~800 km</text><text x="420" y="153" font-size="9" fill="#5a5a55">EO, ISS, Defence</text><circle cx="340" cy="190" r="110" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4,3"/><text x="465" y="105" font-size="10" fill="#6d28d9" font-weight="500">MEO ~20200 km</text><text x="465" y="118" font-size="9" fill="#5a5a55">GPS, Galileo, GLONASS</text><circle cx="340" cy="190" r="145" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/><text x="500" y="72" font-size="10" fill="#dc2626" font-weight="500">GEO ~35786 km</text><text x="500" y="85" font-size="9" fill="#5a5a55">Telecom, Weather</text><rect x="40" y="50" width="120" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="100" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2563eb">Earth Observation</text><rect x="40" y="86" width="120" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="100" y="104" text-anchor="middle" font-size="10" font-weight="500" fill="#6d28d9">Navigation (GNSS)</text><rect x="40" y="122" width="120" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="100" y="140" text-anchor="middle" font-size="10" font-weight="500" fill="#dc2626">Telecom / Defence</text><rect x="40" y="158" width="120" height="28" rx="6" fill="#ecfdf5" stroke="#86efac"/><text x="100" y="176" text-anchor="middle" font-size="10" font-weight="500" fill="#0f766e">Space Stations</text><rect x="40" y="194" width="120" height="28" rx="6" fill="#fffbeb" stroke="#fbbf24"/><text x="100" y="212" text-anchor="middle" font-size="10" font-weight="500" fill="#b45309">Science (Deep Space)</text><text x="340" y="310" text-anchor="middle" font-size="10" fill="#5a5a55">Not to scale. Deep space missions (Cassini, Juno, JUICE) go far beyond GEO.</text></svg>\n<div class="imf"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Jason-3_satellite_artist_concept.jpg/800px-Jason-3_satellite_artist_concept.jpg" alt="Jason-3 satellite" loading="lazy"><div class="imc">Jason-3 ocean altimetry satellite. Carries dual-frequency radar altimeter, microwave radiometer, GPS/DORIS/SLR for precise orbit determination. Measures sea surface height with cm accuracy from ~1336 km altitude.</div></div>',
gra:'<div class="gd"><h4>Global Mean Sea Level Rise (Topex/Jason, 1993–present)</h4><p>X-axis: Year (1993–2020). Y-axis: Sea level anomaly [mm]. Average trend: ~3.1 mm/yr (accelerating). The 1997 El Niño event appears as a dramatic ~30 cm anomaly in the eastern Pacific. Seasonal variations have been removed to show the underlying trend. This record is only possible because of precise orbit determination (Doppler + ranging + GPS) of the altimetry satellites — directly connecting to the orbit determination techniques studied in this course.</p></div>',
traps:[{n:1,t:"GPS is MEO (~20200 km), NOT GEO. Don't confuse orbit types. GEO is for telecom/weather."},{n:2,t:"Navigation satellites always form CONSTELLATIONS — not single satellites. GPS = 24+ sats in 6 planes."},{n:3,t:"Topex/Poseidon sea level measurement relies on precise orbit determination — the same techniques (Doppler, ranging, GPS, SLR, DORIS) taught in this course. The professor connects everything."}],
drill:[{q:"Name the main categories of space missions and their typical orbits.",a:"Earth Observation: polar LEO or GEO. Telecommunications: GEO (broadcast), LEO (constellations like Starlink), Molniya (high lat). Navigation: MEO (GPS at 20200 km). Space Stations: LEO (ISS) or cislunar (Gateway). Defence: polar LEO (imaging), GEO (telecom). Science: various — deep space for planetary exploration."},{q:"What instruments does an ocean altimetry satellite carry and why?",a:"Radar altimeter (measures ocean surface height via round-trip time), microwave radiometer (calibrates wet troposphere delay), GPS receiver + DORIS receiver + laser retroreflector (all three provide precise orbit determination). The orbit must be known to cm accuracy — otherwise the altimetry measurement is useless."}]},

{id:"explore",title:"2. Scientific Exploration S/C",sl:"19–36",icon:"🚀",
ov:`Scientific exploration spacecraft categories:\n\n• Flyby: continuous trajectory past target, never captured. Must carry instruments compensating for apparent motion of passing targets. Survives long interplanetary cruise. Examples: Pioneer 10/11, Voyager 1/2, New Horizons (Pluto/Charon).\n\n• Orbiter: travels to distant body and enters orbit. Needs substantial propulsion for orbit insertion. Must endure eclipses (power storage needed). Examples: Cassini (Saturn), Juno (Jupiter), MESSENGER/BepiColombo (Mercury), Europa Clipper, JUICE.\n\n• Atmospheric probe: separates from mothership, enters atmosphere with aeroshell, deploys parachute, telemeters data to mothership for relay. Examples: Galileo Jupiter probe, Huygens (Titan — descended 2.5 hours through atmosphere at 6.2 km/s entry velocity).\n\n• Lander: reaches surface, survives landing, telemeters data. Powered descent or parachute. Examples: Viking 1/2 (Mars), Mars Pathfinder, MSL/Curiosity (sky crane), Perseverance.\n\n• Rover: semi-autonomous, steerable from Earth, takes images and soil analyses. Examples: Sojourner (Mars Pathfinder), Spirit/Opportunity (MER), Curiosity (MSL), Perseverance.\n\n• Penetrator: survives hundreds of g impact, measures subsurface. Example: Deep Space 2 (failed).\n\n• Quadcopter: Ingenuity on Mars (1.8 kg, solar-powered, 72 flights!). Future: Dragonfly on Titan.`,
kf:`Mission Type     | Key Challenge              | Example\n─────────────────┼────────────────────────────┼─────────────────\nFlyby            | Long cruise, fast encounter| Voyager, New Horizons\nOrbiter          | Orbit insertion ΔV         | Cassini, Juno, JUICE\nAtmo Probe       | Entry heating, parachute   | Huygens (6.2 km/s)\nLander           | Soft landing, surface ops  | Viking, Curiosity\nRover            | Mobility, autonomy         | Perseverance\nPenetrator       | 100s g impact survival     | Deep Space 2\nQuadcopter       | Flight in thin atmosphere  | Ingenuity\n\nCassini: 4m HGA (S/X/Ku/Ka), RTG power, 13 years at Saturn\nJuno: 2.5m HGA, 60m² solar arrays (14kW@Earth, 400W@Jupiter)\n       Spinning: 1-5 RPM. 200 kg Ti electronics vault.\nHuygens: 6.2 km/s entry, 10-25g peak deceleration, 2.5h descent`,
det:`Cassini spacecraft in detail (Prof. Iess's primary mission reference):\n\nCassini is the most frequently cited mission in this course. Key subsystems visible on the spacecraft diagrams:\n\n• 4 m High Gain Antenna (HGA): fixed, body-mounted Cassegrain reflector. Operates at S, X, Ku, Ka bands simultaneously. Also serves as sunshield during Venus flybys.\n• Low Gain Antennas (LGA): two — one on each side for omnidirectional emergency communication.\n• Reaction Wheels: at least 3 visible (RW #2, #3), providing 3-axis attitude control.\n• Hydrazine thruster clusters: multiple clusters for attitude control and trajectory manoeuvres.\n• Main rocket engines: bipropellant (N₂O₄/MMH) for large ΔV burns (Saturn orbit insertion: 626 m/s).\n• RTG (Radioisotope Thermoelectric Generator): 3 units, providing ~880 W at launch, ~670 W at end of mission. No solar panels — too far from Sun.\n• Science instruments: VIMS, ISS (NAC/WAC), CIRS, UVIS, RADAR, CAPS, MIMI, MAG.\n• Radio science: gravity measurements via X/Ka-band Doppler tracking — Prof. Iess's own experiment!\n\nJuno spacecraft:\n• First solar-powered Jupiter mission. Three 60 m² panels → 14 kW at Earth, only 400 W at Jupiter.\n• Spin-stabilised: 1 RPM cruise, 2 RPM science, 5 RPM manoeuvres.\n• 200 kg titanium electronics vault (1 cm thick) to protect from Jupiter's intense radiation belts.\n• 2.5 m HGA for X/Ka-band communication and gravity science.`,
mat:'<span class="c">% === Cassini Mission Key Parameters ===</span>\n\n<span class="c">% Saturn orbit insertion ΔV</span>\ndV_SOI = <span class="n">626</span>;  <span class="c">% m/s</span>\n\n<span class="c">% RTG power decay</span>\nP0 = <span class="n">880</span>;  <span class="c">% watts at launch (1997)</span>\nhalf_life = <span class="n">87.7</span>;  <span class="c">% Pu-238 half-life [years]</span>\nt_mission = <span class="n">0</span>:<span class="n">20</span>;  <span class="c">% years</span>\nP = P0 * <span class="n">2</span>.^(-t_mission/half_life);\n\n<span class="f">fprintf</span>(<span class="s">\'RTG Power Decay:\\n\'</span>);\n<span class="k">for</span> y = [<span class="n">0</span>, <span class="n">7</span>, <span class="n">13</span>, <span class="n">20</span>]\n    <span class="f">fprintf</span>(<span class="s">\'  Year %2d: %.0f W\\n\'</span>, y, P0*<span class="n">2</span>^(-y/half_life));\n<span class="k">end</span>\n\n<span class="c">% Juno solar power at Jupiter</span>\nP_earth = <span class="n">14000</span>;  <span class="c">% W at 1 AU</span>\nd_jup = <span class="n">5.2</span>;  <span class="c">% AU</span>\nP_jup = P_earth / d_jup^<span class="n">2</span>;\n<span class="f">fprintf</span>(<span class="s">\'\\nJuno solar power: %.0f W @ Earth → %.0f W @ Jupiter\\n\'</span>, ...\n    P_earth, P_jup);\n<span class="f">fprintf</span>(<span class="s">\'Ratio: 1/%.1f (inverse square law)\\n\'</span>, d_jup^<span class="n">2</span>);',
dia:'<div class="imf"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Cassini_Saturn_Orbit_Insertion.jpg/800px-Cassini_Saturn_Orbit_Insertion.jpg" alt="Cassini at Saturn" loading="lazy"><div class="imc">Cassini at Saturn orbit insertion (artist concept). The 4m HGA is visible at top. RTGs at bottom provide power without solar panels. The 626 m/s orbit insertion burn used the bipropellant main engines. Cassini spent 13 years studying the Saturn system (2004–2017).</div></div>\n<div class="imf"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Juno_spacecraft_model_1.png/800px-Juno_spacecraft_model_1.png" alt="Juno spacecraft" loading="lazy"><div class="imc">Juno spacecraft with its three massive solar arrays (20 m across, 60 m² total). At Jupiter distance (5.2 AU), solar flux drops to 1/27 of Earth level → only 400 W available. The 200 kg titanium electronics vault protects against Jupiter\'s radiation belts.</div></div>',
gra:'<div class="gd"><h4>RTG Power Decay — Cassini (Pu-238)</h4><p>Exponential decay: P = P₀ × 2^(−t/87.7). At launch (1997): 880 W. At Saturn arrival (+7 yr): ~830 W. At end of mission (+20 yr): ~750 W. The slow decay of Pu-238 (half-life 87.7 yr) makes RTGs ideal for outer solar system missions where solar panels are impractical. But RTGs are expensive, Pu-238 supply is limited, and public opposition exists.</p></div><div class="gd"><h4>Solar Power vs Distance</h4><p>P ∝ 1/d². At Jupiter (5.2 AU): solar flux is 1/27 of Earth. Juno gets only ~400 W from 60 m² panels. At Saturn (9.5 AU): 1/90 → solar panels impractical. This is why Cassini, Voyager, and New Horizons use RTGs.</p></div>',
traps:[{n:1,t:"Cassini's HGA is FIXED (not steerable) — doubles as sunshield. Know why: mass, reliability, thermal protection."},{n:2,t:"Juno is the first solar-powered Jupiter mission. Previous Jupiter missions (Galileo, Cassini flyby) all used RTGs."},{n:3,t:"Huygens entry velocity was 6.2 km/s with 10–25g peak deceleration. Know these numbers for mission design context."}],
drill:[{q:"Name 5 types of scientific exploration spacecraft and give one example of each.",a:"Flyby: Voyager 1/2. Orbiter: Cassini (Saturn). Atmospheric probe: Huygens (Titan). Lander: Viking (Mars). Rover: Perseverance (Mars). Also: penetrator (Deep Space 2), quadcopter (Ingenuity)."},{q:"Why does Cassini use RTGs while Juno uses solar panels?",a:"Cassini orbits Saturn (9.5 AU) where solar flux is 1/90 of Earth — solar panels would need to be impractically large. Juno orbits Jupiter (5.2 AU) where solar flux is 1/27 — still viable with very large panels (60 m²). Juno chose solar to avoid the political and supply challenges of RTGs."}]},

{id:"obs",title:"3. Observatories & Future S/C",sl:"37–44",icon:"🔭",
ov:`Observatory spacecraft don't travel to targets — they observe from orbit:\n\n• Space telescopes: HST, JWST, Chandra (X-ray), Compton (gamma-ray), SIRTF/Spitzer (IR)\n• Exoplanet missions: Kepler, TESS (NASA), CoRoT, CHEOPS, PLATO, ARIEL (ESA)\n• Astrometric: GAIA — measures positions and proper motions of 10⁹ stars with 2–200 µas accuracy. Star positions expressed in ICRS. No moving parts onboard! Attitude controlled by nitrogen microthrusters (1.5×10⁻⁶ g/s).\n• Gravitational waves: LISA (future — laser interferometry in space)\n\nFuture spacecraft types:\n• Quadcopters: Mars (Ingenuity, 1.8 kg, 72 flights) and Titan (Dragonfly — much larger)\n• Submarines/floating probes: subsurface oceans of Europa, Enceladus; Titan's seas\n\nGAIA details:\n  Dual telescope (two lines of sight separated by 106.5°)\n  Optical bench: silicon carbide torus\n  Star trackers for attitude reference\n  Phased array antenna for data downlink\n  Located at Sun-Earth L2 point\n  Mass: ~2000 kg, mission duration: 5+ years`,
kf:`Observatory Key Specs:\n  HST: 2.4m mirror, LEO, visible/UV/IR\n  JWST: 6.5m mirror, L2, infrared\n  GAIA: 10⁹ stars, 2-200 µas, L2\n  LISA: 2.5 Mkm arm length, gravitational waves\n\nIngenuity (Mars quadcopter):\n  Mass: 1.8 kg\n  Rotor: 1.2 m diameter\n  Power: 350 W motor, solar + Li-ion\n  Flights: 72 (far exceeding planned 5)\n  Comms: Zigbee to Perseverance rover`,
det:`GAIA — why it matters for this course:\n\nGAIA measures positions of ~1 billion stars in the ICRS (International Celestial Reference System) with µas accuracy. These star positions are used by star sensors onboard spacecraft for attitude determination — connecting directly to Chapter 2B (TRIAD, QUEST algorithms).\n\nThe ICRF is realized by quasars (radio sources, VLBI). But most star sensors work in the optical band. GAIA bridges this gap by providing optical star positions accurately tied to the ICRF.\n\nGAIA has NO moving parts onboard — attitude is controlled by nitrogen cold-gas microthrusters producing incredibly tiny forces (1.5 µN level). This eliminates vibration that would blur the ultra-precise measurements.\n\nIngenuity on Mars:\nFlying on Mars is extraordinarily difficult: atmospheric density is ~1% of Earth's. The rotor must spin at ~2400 RPM (vs ~500 RPM for an Earth helicopter). The thin atmosphere means the speed of sound is lower → blade tips approach transonic speeds. Ingenuity proved powered flight is possible on Mars, paving the way for larger vehicles like Dragonfly on Titan (which has 4× Earth's surface density → easier flying).`,
mat:'<span class="c">% === Mars vs Titan: Flight Conditions ===</span>\n\n<span class="c">% Mars atmosphere</span>\nrho_mars = <span class="n">0.02</span>;  <span class="c">% kg/m³ (1% of Earth)</span>\ng_mars = <span class="n">3.72</span>;   <span class="c">% m/s²</span>\n\n<span class="c">% Titan atmosphere</span>\nrho_titan = <span class="n">5.4</span>;   <span class="c">% kg/m³ (4× Earth!)</span>\ng_titan = <span class="n">1.35</span>;   <span class="c">% m/s²</span>\n\n<span class="c">% Earth for comparison</span>\nrho_earth = <span class="n">1.225</span>;  g_earth = <span class="n">9.81</span>;\n\n<span class="c">% Lift scaling: L ∝ ρ × v² × A</span>\n<span class="c">% For same lift as 1kg on Earth, needed rotor speed ratio:</span>\nv_ratio_mars = <span class="f">sqrt</span>(rho_earth/rho_mars * g_mars/g_earth);\nv_ratio_titan = <span class="f">sqrt</span>(rho_earth/rho_titan * g_titan/g_earth);\n\n<span class="f">fprintf</span>(<span class="s">\'Rotor speed ratio vs Earth (same disc area):\\n\'</span>);\n<span class="f">fprintf</span>(<span class="s">\'  Mars:  %.1f× faster (very hard!)\\n\'</span>, v_ratio_mars);\n<span class="f">fprintf</span>(<span class="s">\'  Titan: %.2f× (much easier)\\n\'</span>, v_ratio_titan);',
dia:'<div class="imf"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Ingenuity_Helicopter_on_Sol_46.png/800px-Ingenuity_Helicopter_on_Sol_46.png" alt="Ingenuity on Mars" loading="lazy"><div class="imc">Ingenuity helicopter on the Martian surface (Sol 46). The 1.2 m rotor must spin at ~2400 RPM in Mars\'s thin atmosphere (1% of Earth density). Solar panel visible on top charges Li-ion batteries. Completed 72 flights far exceeding the planned 5 technology demonstrations.</div></div>',
gra:'',
traps:[{n:1,t:"GAIA star positions are in the ICRS — same reference system as ICRF (quasars). This connection between optical and radio frames is fundamental."},{n:2,t:"GAIA has NO moving parts — microthrusters only. This is extreme precision engineering for µas astrometry."},{n:3,t:"Mars atmosphere is ~1% of Earth's → helicopters need ~5× higher rotor speed. Titan's is 4× Earth's → flight is easier there."}],
drill:[{q:"Why is GAIA relevant to spacecraft attitude determination?",a:"GAIA measures positions of ~1 billion stars in the ICRS with µas accuracy. Star sensors onboard spacecraft use these catalogued star positions to determine attitude (via TRIAD, QUEST algorithms). GAIA provides the optical star catalogue tied to the radio-based ICRF — bridging the gap between the two wavelength regimes."},{q:"Why could Ingenuity fly on Mars despite the thin atmosphere?",a:"Mars atmosphere is ~1% of Earth's density, so the rotor spins at ~2400 RPM (vs ~500 on Earth). The low gravity (3.72 m/s² vs 9.81) partially compensates. Carbon fibre blades, lightweight construction (1.8 kg total), and autonomous flight control algorithms enabled the 72 successful flights."}]},

{id:"se",title:"4. Systems Engineering & Phases",sl:"45–62",icon:"⚙️",
ov:`Systems engineering is the interdisciplinary approach to designing, developing, and managing complex systems over their life cycle.\n\nWhat is a "system"? It depends on perspective:\n• Attitude control engineer: IRUs, reaction wheels, thrusters, star sensors, software\n• Spacecraft engineer: ADCS, C&DH, telecom, thermal, power, propulsion subsystems\n• Project engineer: spacecraft, ground data system, mission operations\n• Project manager: flight system, ground system, tracking network\n\nSpacecraft subsystems:\n  Data Handling, Attitude & Articulation Control, Telecom, Electrical Power, Temperature Control, Propulsion, Mechanical Devices, Payload\n\nTechnology Readiness Levels (TRL):\n  TRL 1: basic principles observed\n  TRL 2: concept formulated\n  TRL 3: analytical/experimental proof of concept\n  TRL 4: breadboard validated in lab\n  TRL 5: breadboard validated in relevant environment\n  TRL 6: prototype demonstrated in relevant environment\n  TRL 7: prototype demonstrated in space\n  TRL 8: flight-qualified through test\n  TRL 9: flight-proven through mission operations`,
kf:`Mission Phases:\n  Pre-Phase A: Conceptual Study (AO, SWG, science goals)\n  Phase A:     Preliminary Analysis (design, plan, cost)\n  Phase B:     Definition (requirements, specs, SRR, SDR)\n  Phase C/D:   Design & Development (PDR, CDR, TRR, FRR)\n  Phase E:     Operations (launch, cruise, science)\n\nKey Reviews:\n  SRR: System Requirements Review\n  SDR: System Design Review\n  PDR: Preliminary Design Review\n  CDR: Critical Design Review\n  TRR: Test Readiness Review\n  FRR: Flight Readiness Review\n\nTRL Scale: 1 (basic principles) → 9 (flight-proven)\n  TRL 5-6: typical minimum for mission selection\n  TRL 8-9: required for flight`,
det:`Phase A — Preliminary Analysis:\nCreates preliminary design and project plan: what to build, when to launch, trajectory, cruise operations, target operations, build-vs-buy decisions, instruments, test locations, ground systems, experimenters. Publication of the preliminary plan with costing marks Phase A completion.\n\nPhase B — Mission Definition:\nConverts preliminary plan into baseline technical solution. Requirements defined, schedules determined, specifications prepared. Experiments divided into facilities (existing resources) and experimenters. Major reviews: SRR, SDR.\n\nPhase C/D — Design and Development:\nSchedules negotiated, flight system designed, developed, integrated, tested, launched. ATLO (Assembly, Test, and Launch Operations). Ground systems developed in parallel. Reviews: PDR, CDR, TRR, FRR. Typically ends 30 days after launch.\n\nPhase E — Operations:\nMission Operations and Data Analysis (MO&DA). Includes launch, cruise, encounter, extended operations, project closeout.\n\nESA requirements documents:\n• Yellow Book: Mission Assessment Study Report\n• Red Book: Definition Study Report\n• MRD: Mission Requirement Document`,
mat:'<span class="c">% === TRL Level Summary ===</span>\nTRL = (<span class="n">1</span>:<span class="n">9</span>)\';\nnames = {<span class="s">\'Basic principles observed\'</span>;\n         <span class="s">\'Concept formulated\'</span>;\n         <span class="s">\'Proof of concept\'</span>;\n         <span class="s">\'Breadboard validated (lab)\'</span>;\n         <span class="s">\'Breadboard validated (relevant env)\'</span>;\n         <span class="s">\'Prototype demonstrated (relevant env)\'</span>;\n         <span class="s">\'Prototype demonstrated (space)\'</span>;\n         <span class="s">\'Flight qualified through test\'</span>;\n         <span class="s">\'Flight proven (mission ops)\'</span>};\n\n<span class="f">fprintf</span>(<span class="s">\'Technology Readiness Levels:\\n\'</span>);\n<span class="k">for</span> i = <span class="n">1</span>:<span class="n">9</span>\n    <span class="f">fprintf</span>(<span class="s">\'  TRL %d: %s\\n\'</span>, i, names{i});\n<span class="k">end</span>\n<span class="f">fprintf</span>(<span class="s">\'\\nMinimum for mission selection: TRL 5-6\\n\'</span>);\n<span class="f">fprintf</span>(<span class="s">\'Required for flight: TRL 8-9\\n\'</span>);',
dia:'<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" class="svg"><defs><marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0ea5e9"/></marker></defs><style>text{font-family:\'DM Sans\',sans-serif;fill:#1a1a18;font-size:11px}</style><text x="340" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#0ea5e9">Mission Life Cycle Phases</text><rect x="20" y="50" width="110" height="50" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="75" y="72" text-anchor="middle" font-weight="600" font-size="10">Pre-Phase A</text><text x="75" y="88" text-anchor="middle" font-size="9" fill="#2563eb">Conceptual Study</text><line x1="130" y1="75" x2="152" y2="75" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="155" y="50" width="100" height="50" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="205" y="72" text-anchor="middle" font-weight="600" font-size="10">Phase A</text><text x="205" y="88" text-anchor="middle" font-size="9" fill="#2563eb">Prelim. Analysis</text><line x1="255" y1="75" x2="277" y2="75" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="280" y="50" width="100" height="50" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="330" y="72" text-anchor="middle" font-weight="600" font-size="10">Phase B</text><text x="330" y="88" text-anchor="middle" font-size="9" fill="#6d28d9">Definition</text><line x1="380" y1="75" x2="402" y2="75" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="405" y="50" width="110" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="460" y="72" text-anchor="middle" font-weight="600" font-size="10">Phase C/D</text><text x="460" y="88" text-anchor="middle" font-size="9" fill="#dc2626">Design & Dev.</text><line x1="515" y1="75" x2="537" y2="75" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a1)"/><rect x="540" y="50" width="110" height="50" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="595" y="72" text-anchor="middle" font-weight="600" font-size="10">Phase E</text><text x="595" y="88" text-anchor="middle" font-size="9" fill="#0f766e">Operations</text><line x1="75" y1="100" x2="75" y2="120" stroke="#5a5a55" stroke-dasharray="3,3"/><line x1="205" y1="100" x2="205" y2="120" stroke="#5a5a55" stroke-dasharray="3,3"/><text x="140" y="135" text-anchor="middle" font-size="9" fill="#5a5a55">SRR</text><line x1="330" y1="100" x2="330" y2="120" stroke="#5a5a55" stroke-dasharray="3,3"/><text x="268" y="135" text-anchor="middle" font-size="9" fill="#5a5a55">SDR</text><line x1="425" y1="100" x2="425" y2="140" stroke="#5a5a55" stroke-dasharray="3,3"/><text x="425" y="155" text-anchor="middle" font-size="9" fill="#dc2626">PDR</text><line x1="460" y1="100" x2="460" y2="160" stroke="#5a5a55" stroke-dasharray="3,3"/><text x="460" y="175" text-anchor="middle" font-size="9" fill="#dc2626">CDR</text><line x1="495" y1="100" x2="495" y2="140" stroke="#5a5a55" stroke-dasharray="3,3"/><text x="495" y="155" text-anchor="middle" font-size="9" fill="#dc2626">TRR</text><line x1="540" y1="100" x2="540" y2="160" stroke="#5a5a55" stroke-dasharray="3,3"/><text x="540" y="175" text-anchor="middle" font-size="9" fill="#dc2626">FRR</text><rect x="20" y="200" width="640" height="28" rx="6" fill="#fafaf8" stroke="#d8d6d0"/><text x="340" y="218" text-anchor="middle" font-size="10" fill="#1a1a18">Requirements flow DOWN from top · Realized products flow UP from bottom</text></svg>',
gra:'<div class="gd"><h4>TRL Scale</h4><p>Technology readiness increases from TRL 1 (basic research) to TRL 9 (flight-proven). Critical gates: TRL 5–6 typically required for mission selection (agencies won\'t fund missions with unproven technology). TRL 8 required for integration into the flight system. The jump from TRL 4 (lab breadboard) to TRL 6 (relevant environment prototype) is often called the "valley of death" in technology development — many concepts fail here.</p></div>',
traps:[{n:1,t:"Know the phase letters and their names: Pre-A, A, B, C/D, E. Know which reviews happen in each phase."},{n:2,t:"PDR and CDR are in Phase C/D, NOT Phase B. Phase B has SRR and SDR."},{n:3,t:"Requirements flow DOWN (from top level to subsystems). Realized products flow UP (from lowest level to integrated system). This is the V-model."}],
drill:[{q:"What are the five mission phases and what happens in each?",a:"Pre-Phase A: Conceptual Study — idea, SWG, AO, feasibility. Phase A: Preliminary Analysis — preliminary design, project plan, cost estimate. Phase B: Definition — baseline technical solution, requirements, specs, SRR/SDR. Phase C/D: Design & Development — build, test, integrate (PDR, CDR, TRR, FRR). Phase E: Operations — launch, cruise, science, extended ops, closeout."},{q:"What is TRL and why does it matter for mission selection?",a:"Technology Readiness Level (1–9) indicates development maturity. TRL 1 = basic principles, TRL 9 = flight-proven. Agencies require TRL 5–6 minimum for mission selection — they won't fund missions depending on technology that hasn't been demonstrated in a relevant environment. TRL 8 is needed before integration into the flight system."}]}
];

let aS=M[0].id,aT=0;
function R(){
 document.getElementById('sL').innerHTML=M.map(m=>`<button class="sitem ${aS===m.id?'active':''}" onclick="S('${m.id}')"><span class="sicon">${m.icon}</span><div class="stxt"><div class="st">${m.title}</div><div class="sp">Slides ${m.sl}</div></div></button>`).join('');
 const m=M.find(x=>x.id===aS);if(!m)return;
 document.getElementById('mH').innerHTML=`<h2>${m.icon} ${m.title}</h2><div class="sub">Slides ${m.sl}</div>`;
 const tb=document.getElementById('tB'),ca=document.getElementById('cA');
 tb.innerHTML=T.map((t,i)=>`<button class="tab-btn ${aT===i?'active':''}" onclick="P(${i})"><span>${TI[i]}</span>${t}</button>`).join('');
 if(aT===0)ca.innerHTML=`<div class="prose">${m.ov}</div>`;
 else if(aT===1)ca.innerHTML=`<div class="eqbox">${m.kf}</div>`;
 else if(aT===2)ca.innerHTML=`<div class="prose">${m.det}</div>`;
 else if(aT===3)ca.innerHTML=`<div class="mb">${m.mat}</div>`;
 else if(aT===4)ca.innerHTML=m.dia||'<p style="color:var(--t3)">See lecture slides for additional diagrams.</p>';
 else if(aT===5)ca.innerHTML=m.gra||'<p style="color:var(--t3)">No graphs for this module.</p>';
 else if(aT===6)ca.innerHTML=(m.traps||[]).map(t=>`<div class="tc"><div class="lb">Trap #${t.n}</div><p>${t.t}</p></div>`).join('');
 else if(aT===7)ca.innerHTML=(m.drill||[]).map((d,i)=>`<div class="dc"><div class="q">Q${i+1}: ${d.q}</div><button class="db" onclick="F(this)">Reveal answer</button><div class="da">${d.a}</div></div>`).join('');
}
function S(id){aS=id;aT=0;R();}
function P(i){aT=i;R();}
function F(b){const a=b.nextElementSibling;a.classList.toggle('show');b.textContent=a.classList.contains('show')?'Hide':'Reveal answer';}
R();
</script>
